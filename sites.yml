# Every site this node knows about: the canonical list bin/build-sites.py reads.
# Roles: site, scaffold, tenant, listed. See docs/members.md.

core: member-site-core

# Inside the build root, or nothing serves it. Removing a tenant below takes its site down.
publish_to: site/member-sites

sites:
  - path: site
    role: site
    # The address this site is served at. A machine that serves it finds the files by this name:
    #   python3 bin/build-sites.py --deploy-root fcpublicmedia.org
    domain: fcpublicmedia.org
    # Built from site/ by whoever serves it (the other choice, intermediate, ships a prebuilt copy).
    deliver: source
    why: fcpublicmedia.org itself. bin/deploy-site builds it and uploads it to Cloudflare Pages (fcpm-new).

  - path: site-template
    role: scaffold
    why: >-
      What a member's own repository holds — two data files and a .gitignore,
      and deliberately no markup. Composed with `core` and built here so it
      cannot rot unnoticed; site/bin/check-template.py separately proves the
      composed feed is still readable, which is the part that is a contract.
