<header class="site-head">
  <div class="wrap site-head-inner">

    <a class="wordmark" href="{{ '/' | relative_url }}">
      <span class="wordmark-mark" aria-hidden="true"></span>
      <span class="wordmark-text">
        <b>Fort Collins</b>
        <span>Public Media</span>
      </span>
    </a>

    <button class="nav-toggle" aria-expanded="false" aria-controls="site-nav">
      <span class="nav-toggle-bars" aria-hidden="true"></span>
      <span class="visually-hidden">Menu</span>
    </button>

    <nav class="site-nav" id="site-nav" aria-label="Main">
      <ul>
        {% for item in site.data.nav.primary %}
          <li>
            <a href="{{ item.url | relative_url }}"
               {% if page.url contains item.url %}aria-current="page"{% endif %}>{{ item.title }}</a>
          </li>
        {% endfor %}
      </ul>
      <a class="btn btn-cta" href="{{ site.data.nav.cta.url | relative_url }}">{{ site.data.nav.cta.title }}</a>
    </nav>

  </div>
</header>
