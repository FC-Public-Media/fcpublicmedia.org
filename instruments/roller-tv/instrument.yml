# see docs/inline/instruments/roller-tv/instrument.yml.md#1

version: 1

instrument: roller-tv
kind: screen
for: >
  A 55-inch set on a rolling stand, turned on its side, in the control room's
  opening. Seen from the studio floor; from the control room it is often
  facing away.

# see docs/inline/instruments/roller-tv/instrument.yml.md#2
match:
  manufacturer: VIZ
  product: VIZ1006
  model: M551d-A2R
  # see docs/inline/instruments/roller-tv/instrument.yml.md#3

# see docs/inline/instruments/roller-tv/instrument.yml.md#4
orientation: portrait

# see docs/inline/instruments/roller-tv/instrument.yml.md#5
input: pointer

# WHERE IT PLAYS IS A PLACEMENT. Whoever finds it plugged in may drive it.
placement:
  where: control-room opening, on its stand
  driven-by: editing-bay-1   # machines/editing-bay-1; it answers to EDIT2
  since: 2026-09-25

# see docs/inline/instruments/roller-tv/instrument.yml.md#6
played-through: msedge

show: show.yml
