# see docs/inline/instruments/roller-tv/show.yml.md#1

version: 1

# see docs/inline/instruments/roller-tv/show.yml.md#2
route: wall

# see docs/inline/instruments/roller-tv/show.yml.md#3
modules:
  - {name: studio, label: Studio, page: kiosk}
  - {name: files, label: Files, page: depot}

# see docs/inline/instruments/roller-tv/show.yml.md#4
layout:
  header: checkin            # the check-in block, colours inverted, on a -8deg plane
  main: rotate
  every: 45                  # seconds on each module. A guess, to be watched
  others: none
  takeover: classes          # docs/KIOSK.md, "The class on now"

# see docs/inline/instruments/roller-tv/show.yml.md#5
controls: small

# see docs/inline/instruments/roller-tv/show.yml.md#6
animated: true

# see docs/inline/instruments/roller-tv/show.yml.md#7
