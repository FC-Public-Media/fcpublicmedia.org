# What this repository runs of troves/kiosk-screen/, when a job orders it (machines/<job>/services).
# Paths are from this repository's root. See machines/README.md.

serves:
  - service: screen
    for: "a studio page kept on a screen this host finds plugged in (the rolling TV)"
    desktop: true                    # Edge on a monitor: only with someone's desktop to put it on
    start: "powershell -NoProfile -ExecutionPolicy Bypass -File troves/kiosk-screen/screen.ps1 keep roller-tv"
    env: {FCPM_BY: "production"}
