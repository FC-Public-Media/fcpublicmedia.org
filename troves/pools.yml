# What this repository runs of troves/pools/, when a job orders it (machines/<job>/services).
# {python} is the crew's Python; paths are from this repository's root. See machines/README.md.

serves:
  - service: pools
    for: "the timeline and the squares: the nights, the windows, transcript time, the episodes"
    start: "{python} troves/pools/pools.py timeline"
    env: {POOLS_NO_OPEN: "1"}        # served without a window; `fcpm pools` opens one onto it
    alive: {port: 8091}

  - service: episodes
    for: "the supervisor of released episodes: admits each to post as a take (troves/post); a held episode is left alone"
    start: "{python} troves/pools/episodes.py tick"
    needs: [pools]                   # it asks the pools server, the one writer of the groups
