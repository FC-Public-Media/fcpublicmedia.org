<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pools · timeline</title>
<style>
  :root {
    --bg: #07090d; --ink: #c9d1dc; --dim: #6b7584; --faint: rgba(255,255,255,.07);
    --lane: 46px; --label: 150px; --dock: 0px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: radial-gradient(ellipse at 20% -10%, #14203a 0%, transparent 55%),
                radial-gradient(ellipse at 90% 110%, #1d1430 0%, transparent 50%), var(--bg);
    background-attachment: fixed; display: flex; flex-direction: column;
    color: var(--ink); font: 13px/1.4 "Segoe UI", system-ui, sans-serif;
    user-select: none; -webkit-user-select: none;   /* dragging anywhere never selects text: no flicker in the gutters */
  }
  header { flex: none; padding: 14px 18px 10px; display: flex; gap: 8px 22px; align-items: baseline; flex-wrap: wrap; }
  header h1 { margin: 0; font-size: 13px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; }
  header a { color: var(--dim); text-decoration: none; }
  header a:hover { color: var(--ink); }
  header .meta, header .hint { color: var(--dim); }
  main { flex: 1; min-height: 0; overflow-y: auto; padding-bottom: calc(var(--dock) + 24px); user-select: none; }
  .axis, .lane { display: flex; }
  .axis { position: sticky; top: 0; z-index: 3; height: 20px; background: var(--bg); }
  .lab { flex: 0 0 var(--label); padding: 0 12px 0 18px; display: flex; flex-direction: column; justify-content: center; }
  .lab b { font-weight: 500; }
  .lab small { color: var(--dim); }
  .track { flex: 1; position: relative; margin-right: 18px; }
  .axis .track span { position: absolute; top: 3px; font-size: 10px; color: var(--dim); transform: translateX(-50%); }
  .lane { height: var(--lane); border-top: 1px solid var(--faint); }
  .lane .track, #win { cursor: text; touch-action: none; }
  body.panning, body.panning * { cursor: grabbing !important; }
  .tick { position: absolute; top: 0; bottom: 0; width: 1px; background: rgba(255,255,255,.11); pointer-events: none; }
  .tick.hour { background: rgba(255,255,255,.04); }
  .f { position: absolute; top: 9px; bottom: 11px; min-width: 1px; border-radius: 1px; }
  .f.short { opacity: .35; }
  .lane .f.unk { opacity: .3; }
  .sel { position: absolute; top: 1px; bottom: 1px; background: rgba(255,255,255,.16);
         box-shadow: inset 0 1px 0 rgba(255,255,255,.35), inset 0 -1px 0 rgba(255,255,255,.35); pointer-events: none; }
  .ph { position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: #fff; opacity: .9; pointer-events: none; z-index: 2; }   /* a narrow clip shows through it */
  .grp { position: absolute; bottom: 3px; height: 3px; border-radius: 2px; cursor: pointer; }
  .grp:hover { height: 5px; }
  .grpname { position: absolute; top: -1px; font-size: 10px; white-space: nowrap; cursor: pointer; z-index: 1; }
  .grpname:hover { text-decoration: underline; }
  .grp.tmp { background: repeating-linear-gradient(90deg, currentColor 0 6px, transparent 6px 10px); }
  .grpname.tmp { font-style: italic; }
  /* an edge's handle: a wide grip just outside the edge it holds, so what lies at the edge stays readable */
  .hdl { position: absolute; top: 0; bottom: 0; width: 14px; cursor: ew-resize; z-index: 4; touch-action: none; }
  .hdl[data-edge="a"] { margin-left: -14px; }
  .hdl[data-edge="b"] { margin-left: 0; }
  .hdl::after { content: ''; position: absolute; top: 12%; bottom: 12%; width: 3px; border-radius: 2px; background: #ff3b30; opacity: .85; }
  .hdl[data-edge="a"]::after { right: 2px; }
  .hdl[data-edge="b"]::after { left: 2px; }
  .hdl:hover::after { opacity: 1; width: 4px; }
  #win .out { position: absolute; top: 0; bottom: 0; background: rgba(0,0,0,.5); pointer-events: none; z-index: 1; }
  #ctl button.tmp { font-style: italic; }
  #ctl select.pick { font: inherit; color: var(--ink); background: #10141c; border: 1px solid rgba(255,255,255,.2);
                     border-radius: 4px; padding: 4px 8px; max-width: 260px; cursor: pointer; }
  #ctl select.pick.tmp { font-style: italic; border-style: dashed; }
  #ctl select.pick option:disabled { color: var(--dim); }
  #ctl select.pick option, #ctl select.pick optgroup { background: #10141c; color: var(--ink); font-style: normal; }
  #ctl input.name { user-select: text; -webkit-user-select: text; font: inherit; color: var(--ink); background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.4);
                    border-radius: 4px; padding: 4px 8px; width: 160px; }
  .miss { height: 9px; margin: 0 18px 0 var(--label); border-top: 1px solid var(--faint);
          background: linear-gradient(rgba(255,255,255,.16), rgba(255,255,255,.16)) center / 100% 3px no-repeat; }
  .lane .lab { cursor: pointer; }
  .lane .lab:hover b { text-decoration: underline; }
  .axis .lab.all { cursor: pointer; color: var(--dim); font-size: 11px; justify-content: center; }
  .axis .lab.all:hover { color: var(--ink); text-decoration: underline; }

  /* the window: a stretch, at full width, that plays */
  #dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; display: none; height: 24vh; min-height: 170px;
          flex-direction: column; background: rgba(9,11,16,.97); border-top: 1px solid rgba(255,255,255,.12); padding: 8px 18px 12px; }
  /* the show's own line under the window is its scroll bar: thicker under the pointer, the window's part lit inside it */
  #win .grp.bar { height: 6px; bottom: 3px; cursor: pointer; touch-action: none; z-index: 5; transition: height .12s; }
  #win .grp.bar:hover, body.panning #win .grp.bar { height: 9px; }
  #win .grp.bar .thumb { position: absolute; top: 0; bottom: 0; border-radius: 3px; background: currentColor; cursor: grab;
                         box-shadow: 0 0 0 1px rgba(0,0,0,.55); }
  #win .grp.bar.full .thumb { opacity: .75; cursor: pointer; }
  /* on the bar, the reach's count sits on its own dark ground, so it reads over the colour or the slot */
  #reachlbl.onbar { background: rgba(7,9,13,.82); padding: 0 4px; border-radius: 2px; text-shadow: none; }
  /* transcript time: the window's transcription regions, side by side, where the nights were */
  #tx { display: none; flex: 1; min-height: 0; gap: 10px; padding: 4px 18px calc(var(--dock) + 14px); }
  body.txtime main { display: none; }
  body.txtime #tx { display: flex; }
  .txp { --c: #c9d1dc; flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 6px; font-size: 12px;
         border-top: 3px solid var(--c); background: rgba(255,255,255,.025); border-radius: 3px; padding: 8px 10px 10px; }
  .txp.lit { background: rgba(255,255,255,.05); box-shadow: inset 0 0 0 1px rgba(255,255,255,.14); }
  .txp .sh { display: flex; align-items: baseline; gap: 8px; color: var(--ink); cursor: pointer; white-space: nowrap; overflow: hidden; }
  .txp .sh:hover b { text-decoration: underline; }
  .txp .sh b { font-weight: 500; }
  .txp .sh small { color: var(--dim); overflow: hidden; text-overflow: clip; }
  .txp .st { color: var(--c); min-width: 1em; }
  .txp textarea { flex: 1 1 50%; min-height: 70px; font: 13px/1.45 "Segoe UI", system-ui, sans-serif; color: var(--ink);
                  background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.18); border-radius: 4px; padding: 8px;
                  resize: none; user-select: text; -webkit-user-select: text; }
  .txp textarea:focus { outline: none; border-color: rgba(143,176,255,.7); }
  .txp .saved { color: var(--dim); font-size: 11px; min-height: 14px; }
  .txp .eng { flex: 1 1 40%; min-height: 0; overflow: auto; border-top: 1px solid var(--faint); padding-top: 6px; color: #aeb7c4; line-height: 1.45; }
  .txp .eng b { color: var(--ink); font-weight: 500; }
  .txp .eng .score { color: var(--dim); margin-left: 6px; }
  .txp .eng p { margin: 3px 0 8px; user-select: text; -webkit-user-select: text; }
  .txp .none { color: var(--dim); }
  .txp button.mark { align-self: flex-start; font: inherit; color: var(--ink); background: none; border: 1px solid rgba(255,255,255,.2); border-radius: 4px; padding: 3px 8px; cursor: pointer; }
  .txp.ep input, .txp.ep textarea { font: 13px/1.4 "Segoe UI", system-ui, sans-serif; color: var(--ink); background: rgba(255,255,255,.04);
                                    border: 1px solid rgba(255,255,255,.18); border-radius: 4px; padding: 5px 8px; user-select: text; -webkit-user-select: text; }
  .txp.ep input:focus, .txp.ep textarea:focus { outline: none; border-color: rgba(143,176,255,.7); }
  .txp.ep .row { display: flex; gap: 6px; }
  .txp.ep .row .wide { flex: 1; min-width: 0; }
  .txp.ep .row .num { width: 64px; }
  .txp.ep textarea { flex: 1 1 30%; min-height: 50px; resize: none; }
  .txp.ep .derived { color: var(--dim); font-size: 11px; }
  .txp.ep .derived .out { color: var(--ink); font-family: Consolas, monospace; }
  .txp.ep .pipe { border-top: 1px solid var(--faint); padding-top: 6px; display: flex; flex-direction: column; gap: 4px; }
  .txp.ep .ph2 { display: flex; gap: 8px; align-items: baseline; }
  .txp.ep .ph2 b { font-weight: 500; }
  .txp.ep .ph2 small { color: var(--dim); flex: 1; }
  .txp.ep .ej { font-size: 11px; padding: 0 6px; border-radius: 8px; border: 1px solid rgba(255,255,255,.25); color: var(--dim); }
  .txp.ep .ej.on { color: #ffd27a; border-color: #ffd27a; }
  .txp.ep ol { margin: 0; padding-left: 20px; color: #aeb7c4; }
  .txp.ep ol b { font-weight: 500; color: var(--ink); margin-right: 8px; }
  .txp.ep .rel { display: flex; gap: 10px; align-items: center; border-top: 1px solid var(--faint); padding-top: 8px; color: var(--dim); }
  .txp.ep .rel button { font: inherit; font-weight: 600; color: #07090d; background: var(--c); border: none; border-radius: 4px; padding: 5px 14px; cursor: pointer; }
  .txp.ep .rel.on button { color: var(--ink); background: none; border: 1px solid rgba(255,255,255,.3); font-weight: 400; }
  .txp.ep .rel.on span { color: var(--c); }
  /* in the header: the regions' marks, to bring transcript time back; in it, the way out */
  #txbar { display: inline-flex; gap: 2px; }
  #txbar button { font: 14px/1 "Segoe UI Symbol", "Segoe UI", sans-serif; background: none; border: 1px solid transparent; border-radius: 3px;
                  color: var(--dim); padding: 1px 4px; cursor: pointer; }
  #txbar button:hover { border-color: rgba(255,255,255,.25); }
  #txbar button.away { color: var(--ink); border-color: rgba(255,255,255,.25); }
  #win { position: relative; flex: 1; min-height: 0; border-radius: 3px; background: rgba(255,255,255,.025); overflow: hidden; }
  /* in the window a recording's body is only a faint field (and its seam); the waveform is the picture */
  #win .f { top: 22px; bottom: 22px; opacity: .04; }
  /* skipped: a grey hatch over the whole body, so even a sliver reads as out of play */
  #win .f.skip { opacity: .5; background: repeating-linear-gradient(135deg, #8a8d94 0 2px, #2c2f35 2px 6px) !important; }
  /* a ghost, a recording that was here and is not now: it darkens what is under it, a hole, not light */
  .ghost { position: absolute; top: 9px; bottom: 11px; min-width: 1px; border-radius: 1px;
           background: rgba(0,0,0,.42); box-shadow: inset 0 0 0 1px rgba(150,60,60,.22); mix-blend-mode: multiply; }
  #win .ghost { top: 22px; bottom: 22px; }
  .grp.rm { background: repeating-linear-gradient(135deg, #e0574f 0 4px, transparent 4px 7px) !important; height: 5px; }
  .grpname.rm { color: #f07a6e !important; }
  .grp.gone { opacity: .6; }
  .grpname.gone { font-style: italic; opacity: .8; }
  #rmbtn { font: inherit; color: #f07a6e; background: none; border: 1px solid rgba(240,122,110,.5); border-radius: 4px; padding: 3px 10px; cursor: pointer; }
  #rmbtn:hover { border-color: #f07a6e; }
  #wave, #wavenow { position: absolute; left: 0; top: 22px; pointer-events: none; }
  #wavenow { z-index: 2; }
  /* a clip's own particulars, printed faintly in its background: it is fine for them to run out of frame */
  #win .lbl { position: absolute; bottom: 30px; z-index: 1; pointer-events: none; display: flex; flex-direction: column;
              font-size: 9px; line-height: 11px; color: rgba(201,209,220,.32); white-space: nowrap; font-variant-numeric: tabular-nums; }
  #win .lbl .nm { color: rgba(201,209,220,.18); }
  /* the reach: from the playhead out to the cursor */
  #reach { position: absolute; height: 4px; z-index: 4; pointer-events: none; display: none; }
  #reach i { position: absolute; inset: 0; }
  #reach.onbar { z-index: 7; filter: drop-shadow(0 0 1px #000) drop-shadow(0 0 1px #000); }
  #reachlbl.onbar { z-index: 8; }
  #strong { position: absolute; left: 3px; display: none; font-size: 9px; line-height: 12px; color: var(--dim); cursor: help; }
  #reachlbl { position: absolute; z-index: 6; pointer-events: none; display: none; font-size: 10px; line-height: 13px; color: #fff; white-space: pre;
              font-variant-numeric: tabular-nums; text-shadow: 0 0 4px #000, 0 0 2px #000; }
  /* the grid, over the recordings: major lines labelled top and bottom, minor between */
  #win .g { position: absolute; top: 0; bottom: 0; width: 1px; pointer-events: none; z-index: 1; }
  #win .g.minor { background: rgba(255,255,255,.05); top: 18px; bottom: 18px; }
  #win .g.major { background: rgba(255,255,255,.17); }
  #win .g span { position: absolute; left: 4px; font-size: 10px; color: var(--dim); white-space: nowrap; font-variant-numeric: tabular-nums; }
  #win .g span.top { top: 3px; } #win .g span.bot { bottom: 3px; }
  /* a cut: time with no recording (and clips the skip passes over), squeezed to a sliver that says how long it was */
  #win .cut { position: absolute; top: 0; bottom: 0; z-index: 2; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
              background: repeating-linear-gradient(90deg, rgba(255,255,255,.035) 0 1px, transparent 1px 4px), rgba(0,0,0,.35);
              border-left: 1px solid rgba(255,255,255,.12); border-right: 1px solid rgba(255,255,255,.12); pointer-events: none; overflow: hidden; }
  #win .cut .len { font-size: 9px; color: var(--dim); writing-mode: vertical-rl; transform: rotate(180deg); white-space: nowrap; font-variant-numeric: tabular-nums; }
  #win .cut .dots { font-size: 9px; letter-spacing: 1px; color: #8a8d94; writing-mode: vertical-rl; white-space: nowrap; }
  #win .cut .dots.rm { color: #f07a6e; }
  /* a clip's state, where its waveform is not: loading flows gently backwards; unreadable and unplayable lie still */
  #win .state { position: absolute; bottom: 24px; height: 4px; z-index: 1; pointer-events: auto; border-radius: 2px; }
  /* the selection in the window: what the list acts on */
  #win .sel.pick { background: rgba(143,176,255,.16); box-shadow: inset 0 1px 0 rgba(143,176,255,.7), inset 0 -1px 0 rgba(143,176,255,.7),
                   inset 1px 0 0 rgba(143,176,255,.9), inset -1px 0 0 rgba(143,176,255,.9); z-index: 3; }
  /* staged for removal: still there, still playing, plainly marked */
  #win .staged { position: absolute; top: 0; bottom: 0; z-index: 1; pointer-events: none;
                 background: repeating-linear-gradient(135deg, rgba(224,87,79,.2) 0 5px, transparent 5px 11px);
                 box-shadow: inset 0 2px 0 rgba(224,87,79,.6); }
  #ctl .chip.picked { color: #dbe5ff; background: rgba(143,176,255,.16); box-shadow: inset 0 0 0 1px rgba(143,176,255,.6); }
  #win .state.loading { bottom: auto; top: calc(22px + (100% - 44px) * .38); height: 4px;
                        background: radial-gradient(circle, rgba(201,209,220,.75) 1.3px, transparent 1.8px) 0 50% / 9px 4px repeat-x;
                        animation: flowback 2.2s linear infinite; opacity: .8; }
  #win .state.unreadable, #win .state.unplayable { background: repeating-linear-gradient(90deg, rgba(220,110,100,.75) 0 2px, transparent 2px 6px); }
  @keyframes flowback { from { background-position: 0 50%; } to { background-position: -9px 50%; } }
  /* the clip playing: red dots marching forward, a record light, once its sound is coming (.waiting below) */
  #win .state.playing { pointer-events: none; opacity: 1; height: 8px; bottom: 22px; z-index: 9;   /* over everything in the window */
                        background: radial-gradient(circle, #ff3b30 2.6px, rgba(255,59,48,.35) 3.2px, transparent 3.6px) 0 50% / 14px 8px repeat-x;
                        animation: flowdots 1.1s linear infinite; }
  @keyframes flowdots { from { background-position: 0 50%; } to { background-position: 14px 50%; } }
  /* the clip asked to play, its sound not here yet: the dots hold still and blink, trying to start, and its time with them */
  #win.waiting .state.playing { animation: trying .9s ease-in-out infinite; }
  #win.waiting #cliptag { animation: trying .9s ease-in-out infinite; }
  @keyframes trying { 0%, 100% { opacity: 1; } 50% { opacity: .2; } }
  /* clinging to the playing clip's right end (just past it, when the clip is too narrow): in it, and left of it */
  #cliptag { position: absolute; bottom: 20px; z-index: 9; pointer-events: none; font-size: 9px; line-height: 12px; padding: 0 4px;
             border-radius: 2px; background: rgba(7,9,13,.8); color: #fff; white-space: pre; font-variant-numeric: tabular-nums; }
  #cliptag b { font-weight: normal; color: #ff8a80; }
  /* what was heard: a line of text where it was said, along the top of the waveform */
  #win .heard { position: absolute; bottom: 11px; height: 13px; z-index: 3; overflow: hidden; white-space: nowrap; text-overflow: clip;
                font-size: 9.5px; line-height: 13px; padding: 0 3px; color: #e8edf4; background: rgba(12,15,21,.78);
                border-left: 1px solid rgba(255,255,255,.5); border-radius: 0 2px 2px 0; cursor: pointer; }
  #win .heard:hover { background: rgba(30,36,48,.95); }
  #win .heard.unsure { color: rgba(232,237,244,.55); }
  #ctl .scale { color: var(--dim); font-size: 11px; }
  #win .grp { bottom: 4px; }
  #ctl { display: flex; align-items: center; gap: 12px; margin-top: 9px; white-space: nowrap; }
  #ctl button { font: inherit; color: var(--ink); background: none; border: 1px solid rgba(255,255,255,.14);
                border-radius: 4px; padding: 4px 10px; cursor: pointer; }
  #ctl button:hover { border-color: rgba(255,255,255,.5); }
  #ctl button.on { border-color: rgba(255,255,255,.6); }
  #ctl button i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
  #ctl .ico { width: 34px; height: 30px; padding: 0; display: inline-flex; align-items: center; justify-content: center; color: var(--dim); }
  #ctl .ico:hover, #ctl .ico.on { color: var(--ink); }
  #ctl .clock { font-variant-numeric: tabular-nums; min-width: 74px; }
  #ctl .sum { color: var(--dim); overflow: hidden; text-overflow: ellipsis; }
  #ctl .sum b { color: var(--ink); font-weight: 500; }
  #ctl .gap { flex: 1; min-width: 0; }
  #ctl .keys { color: var(--dim); font-size: 11px; }
  #ctl .err { color: #f0a050; }
  /* the pre-processing strip: glyph toggles, pressed in when on, and the stop slider */
  #ctl .strip { display: inline-flex; align-items: center; gap: 2px; padding: 0 6px; border-left: 1px solid rgba(255,255,255,.08); border-right: 1px solid rgba(255,255,255,.08); }
  #ctl .ico.tog { width: 30px; color: rgba(201,209,220,.38); border-color: transparent; }
  #ctl .ico.tog.idle { opacity: .35; }
  #ctl .ico.tog.on { color: var(--ink); background: rgba(255,255,255,.07); border-color: rgba(255,255,255,.14); box-shadow: inset 0 1px 3px rgba(0,0,0,.6); }
  #ctl .stops { display: inline-flex; align-items: center; height: 30px; padding: 0 10px 0 8px; cursor: pointer; }
  #ctl .stops .track { position: relative; width: 58px; height: 2px; background: rgba(255,255,255,.18); border-radius: 1px; touch-action: none; }
  #ctl .stops .stop { position: absolute; top: -5px; width: 12px; height: 12px; margin-left: -6px; }
  #ctl .stops .stop::after { content: ''; position: absolute; left: 5px; top: 1px; width: 2px; height: 10px; background: rgba(255,255,255,.35); border-radius: 1px; }
  #ctl .stops .stop.on::after { background: transparent; }
  #ctl .stops .knob { position: absolute; top: -8px; width: 18px; height: 18px; margin-left: -9px; border-radius: 50%; background: #c9d1dc; color: #0b0e14;
                      font-size: 9px; font-weight: 600; line-height: 18px; text-align: center; pointer-events: none; font-variant-numeric: tabular-nums; }
  /* the readout, in the selection's look */
  #ctl .chip { font-variant-numeric: tabular-nums; padding: 3px 8px; border-radius: 3px; white-space: nowrap; }
  #ctl .chip.clock { color: #fff; box-shadow: inset 2px 0 0 #fff; background: rgba(255,255,255,.05); min-width: 78px; }
  #ctl .span { display: inline-flex; flex: none; align-items: center; gap: 4px; position: relative; padding-bottom: 5px; }   /* never squeezed: its chips must not overlap */
  #ctl .span .slice { position: absolute; left: 0; bottom: 0; width: 100%; max-width: 170px; height: 3px; border-radius: 2px; background: rgba(255,255,255,.12); }
  #ctl .span .slice .lit { position: absolute; top: 0; bottom: 0; border-radius: 2px; }
  #ctl .span .ico { width: 26px; height: 26px; }
  #ctl .chip.range, #ctl .chip.picked { cursor: pointer; }
  #ctl .chip.range:hover, #ctl .chip.picked:hover { box-shadow: inset 0 0 0 1px rgba(255,255,255,.6); }
  #ctl .chip.range { color: var(--ink); background: rgba(255,255,255,.13); box-shadow: inset 0 1px 0 rgba(255,255,255,.35), inset 0 -1px 0 rgba(255,255,255,.35); }
  #ctl .badge { display: inline-flex; align-items: center; gap: 3px; color: var(--dim); font-size: 11px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  #ctl .badge svg { opacity: .8; }
  #ctl .badge.keys { width: 18px; height: 18px; justify-content: center; border: 1px solid rgba(255,255,255,.18); border-radius: 50%; cursor: help; }
  #ctl label.opt { color: var(--dim); font-size: 12px; display: inline-flex; align-items: center; gap: 4px; cursor: pointer; }
  #ctl label.opt input { accent-color: #8fb0ff; margin: 0; }
  #ctl select.under { font: inherit; font-size: 12px; color: var(--ink); background: #10141c; border: 1px solid rgba(255,255,255,.18); border-radius: 3px; padding: 1px 2px; }
  #tip { position: fixed; z-index: 9; pointer-events: none; display: none; max-width: 360px; padding: 8px 10px;
         background: rgba(12,15,21,.95); border: 1px solid var(--faint); border-radius: 4px; font-size: 12px; }
  #tip b { display: block; font-weight: 500; word-break: break-all; }
  #tip span { color: var(--dim); display: block; }
</style>
</head>
<body>
<header>
  <h1>Timeline</h1>
  <a href="/">squares</a>
  <span class="meta" id="meta">looking…</span>
  <span id="txbar"></span>
  <span class="hint" id="hint">drag along a night to look closer</span>
</header>
<main id="main"></main>
<div id="tx"></div>
<div id="dock">
  <span id="strong" title="strong voice: a peak over about -9 dBFS crosses this dashed line">&minus;9</span>
  <div id="win"></div>
  <div id="ctl"></div>
</div>
<div id="tip" role="tooltip"></div>
<script>
(function () {
  // Nights from the day's seam (view: day_starts_at); a drag along them opens a window, docked. See troves/pools/README.md.
  var main = document.getElementById('main'), dock = document.getElementById('dock'),
      winEl = document.getElementById('win'), ctl = document.getElementById('ctl'), tip = document.getElementById('tip');
  var COLORS = ['#e0a63a', '#3ec28f', '#b07cf0', '#4fb3d9', '#d96b9b', '#5b8def'];
  var data = null, files = [], lanes = [], shows = [], groups = [], ghosts = [], sig = '';
  var win = null, views = [], drag = null;
  var SEL = null;   // a stretch selected in the window, for marking or naming; the view does not move
  var P = {t: null, playing: false, muted: true, cur: null, audio: new Audio(), raf: 0, err: '', forced: null,
           bad: {}, tried: null, fails: 0};   // bad: path -> why it would not play

  // Proofing settings, kept between visits in localStorage.
  var S = {amp: true, skip: true, under: 6, squeeze: true, silence: false, follow: true, muted: false, v: 2};
  try { var kept = JSON.parse(localStorage.getItem('pools.timeline') || '{}'); for (var k in kept) S[k] = kept[k]; } catch (e) {}
  if (S.v !== 2) { S.silence = false; S.v = 2; }   // removals are staged in view now; hearing without them is a preview you choose
  P.muted = !!S.muted;   // sound is on unless it was last turned off; the choice is kept
  function keepS() { try { localStorage.setItem('pools.timeline', JSON.stringify(S)); } catch (e) {} }
  // A short clip is passed over, unless someone insisted on it (P.forced).
  function short(x) { return S.skip && x !== P.forced && x.f.duration != null && x.f.duration < S.under; }
  // Marked for removal: with "silence marked" on, passed over and counted as cut before anything moves.
  function inRemoval(x) { return groups.some(function (g) { return g.remove && x.end > g.start && x.start < g.end; }); }
  function silenced(x) { return S.silence && x !== P.forced && inRemoval(x); }
  function skipped(x) { return short(x) || silenced(x); }
  P.audio.preload = 'auto';

  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function hm(t) { return new Date(t * 1000).toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'}); }
  function hms(t) { return new Date(t * 1000).toLocaleTimeString([], {hour: '2-digit', minute: '2-digit', second: '2-digit'}); }
  function dayname(t) { return new Date(t * 1000).toLocaleDateString([], {weekday: 'short', month: 'short', day: 'numeric'}); }
  function wd(t) { return new Date(t * 1000).toLocaleDateString([], {weekday: 'short'}); }
  function hours(s) { return s < 3600 ? Math.round(s / 60) + ' min' : (s / 3600).toFixed(1) + ' h'; }
  function dur(s) { return s == null ? 'length unknown' : s < 60 ? s.toFixed(s < 10 ? 1 : 0) + ' s' : hours(s); }
  // A lane runs seam to seam, an hour the studio is quiet, so no session is cut in two.
  var SEAM = 9;
  function dayStart(t) { var d = new Date(t * 1000); d.setHours(SEAM, 0, 0, 0); if (d.getTime() / 1000 > t) d.setDate(d.getDate() - 1); return d.getTime() / 1000; }
  function next(o) { var d = new Date(o * 1000); d.setDate(d.getDate() + 1); return d.getTime() / 1000; }
  function color(slug) { var i = shows.map(function (s) { return s.slug; }).indexOf(slug); return COLORS[(i < 0 ? 0 : i) % COLORS.length]; }
  function title(slug) { var s = shows.filter(function (s) { return s.slug === slug; })[0]; return s ? s.title : slug; }
  // A group belongs to a show, or carries a provisional name ("unknown 1"), drawn dashed.
  function gname(g) { return g.show ? title(g.show) : g.name ? g.name : g.remove ? 'to remove' : g.removed ? 'removed' : g.transcribe ? 'to transcribe' : 'unnamed'; }
  function ncolor(name) { var h = 0; for (var i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) >>> 0; return COLORS[(shows.length + h) % COLORS.length]; }
  function gcolor(g) { return g.show ? color(g.show) : g.name ? ncolor(g.name) : g.transcribe && !g.remove ? '#c9d1dc' : '#e0574f'; }
  // Where a group marked for transcription stands: marked, being heard, heard (or heard with failures).
  function txState(g) {
    if (!g.transcribe) return null;
    var ev = (g.events || []).filter(function (e) { return e.phase === 'transcribe'; }), last = ev[ev.length - 1];
    if (!last) return {glyph: '\u25cb', says: 'marked for transcription: not sent yet'};
    var j = heard.filter(function (h) { return h.id === last.job; })[0];
    if (!j || j.state === 'running') return {glyph: '\u25d0', says: 'being heard (' + last.engine + ', sent ' + last.at.slice(11, 16) + ')'};
    var bad = (j.errors || []).length;
    return {glyph: bad ? '\u25cf!' : '\u25cf', says: 'heard by ' + last.engine + ' at ' + last.at.slice(11, 16) + ': ' + (j.segments || []).length + ' phrases' + (bad ? ', ' + bad + ' recordings could not be heard' : '')};
  }
  function names() {   // the provisional names in use, so they can be given again
    var seen = {};
    return groups.filter(function (g) { return !g.show && g.name && !seen[g.name] && (seen[g.name] = 1); }).map(function (g) { return g.name; });
  }
  // Icons in the page's ink: a button is its icon; its name is the tooltip and aria-label.
  var ICONS = {
    play:  '<path d="M7 4.5v15l12-7.5z" fill="currentColor"/>',
    pause: '<rect x="6" y="4.5" width="4" height="15" rx="1" fill="currentColor"/><rect x="14" y="4.5" width="4" height="15" rx="1" fill="currentColor"/>',
    sound: '<path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="currentColor"/>' +
           '<path d="M15.5 9a4.5 4.5 0 0 1 0 6M18 6.5a8 8 0 0 1 0 11" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>',
    muted: '<path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="currentColor"/>' +
           '<path d="M16 9.5l5 5M21 9.5l-5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>'
  };
  ICONS.amp = '<path d="M2 12h2.5l2-5 3 11 3-14 3 12 2-7 1.5 3H22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>';
  ICONS.squeeze = '<rect x="2.5" y="5" width="5" height="14" rx="1" fill="currentColor"/><rect x="16.5" y="5" width="5" height="14" rx="1" fill="currentColor"/>' +
                  '<circle cx="9.8" cy="12" r="1.1" fill="currentColor"/><circle cx="12" cy="12" r="1.1" fill="currentColor"/><circle cx="14.2" cy="12" r="1.1" fill="currentColor"/>';
  ICONS.silence = '<path d="M3 19.5h18" stroke="currentColor" stroke-width="3" stroke-dasharray="3 2"/><path d="M8 4.5l8 8M16 4.5l-8 8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>';
  ICONS.follow = '<path d="M12 3v18" stroke="currentColor" stroke-width="2"/><path d="M8.5 3h7l-3.5 4z" fill="currentColor"/>' +
                 '<path d="M4 12h4M16 12h4M6 10l-2 2 2 2M18 10l2 2-2 2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>';
  ICONS.zoom = '<circle cx="10.5" cy="10.5" r="6" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M15 15l5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>';
  ICONS.speech = '<path d="M4 5h16a1.5 1.5 0 0 1 1.5 1.5v8A1.5 1.5 0 0 1 20 16h-9l-4.5 3.5V16H4a1.5 1.5 0 0 1-1.5-1.5v-8A1.5 1.5 0 0 1 4 5z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>' +
                 '<path d="M6.5 9h11M6.5 12h7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>';
  ICONS.manifest = '<path d="M6 3h9l4 4v14H6z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>' +
                   '<path d="M9 11h7M9 14h7M9 17h4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><path d="M15 3v4h4" fill="none" stroke="currentColor" stroke-width="1.4"/>';
  ICONS.reset = '<path d="M4 7v5h5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>' +
                '<path d="M4.6 12A7.5 7.5 0 1 0 7 6.4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>';
  ICONS.dot = '<circle cx="12" cy="12" r="3.2" fill="currentColor"/>';
  ICONS.files = '<rect x="4" y="5" width="3" height="14" rx="1" fill="currentColor"/><rect x="9" y="8" width="3" height="11" rx="1" fill="currentColor"/><rect x="14" y="4" width="3" height="15" rx="1" fill="currentColor"/><rect x="19" y="10" width="2" height="9" rx="1" fill="currentColor"/>';
  ICONS.grid = '<path d="M5 4v16M12 4v16M19 4v16" stroke="currentColor" stroke-width="1.6"/><path d="M8.5 8v8M15.5 8v8" stroke="currentColor" stroke-width=".9" opacity=".6"/>';

  // Skip short clips: a slider of clickable stops, spaced by square root, not to scale.
  var STOPS = [0, 3, 6, 10];
  function stops() {
    var wrap = el('span', 'stops'), track = el('span', 'track'), cur = S.skip ? S.under : 0;
    wrap.title = 'Skip clips under ' + (cur ? cur + ' s' : 'nothing: off') + '. Ctrl-click, right-click or hold in the window to play one anyway';
    wrap.appendChild(track);
    function pos(v) { return v ? Math.sqrt(v) / Math.sqrt(STOPS[STOPS.length - 1]) : 0; }
    function set(v) { S.skip = v > 0; if (v) S.under = v; keepS(); drawWin(); drawCtl(); }
    STOPS.forEach(function (v) {
      var t = el('span', 'stop' + (v === cur ? ' on' : '')); t.style.left = (pos(v) * 100) + '%';
      t.title = v ? 'skip clips under ' + v + ' s' : 'skip nothing';
      t.onclick = function (e) { e.stopPropagation(); set(v); };
      track.appendChild(t);
    });
    var knob = el('span', 'knob', cur ? String(cur) : '0'); knob.style.left = (pos(cur) * 100) + '%';
    track.appendChild(knob);
    track.onpointerdown = function (e) {   // drag along it: it jumps from stop to stop
      var r = track.getBoundingClientRect();
      function near(ev) {
        var f = Math.min(1, Math.max(0, (ev.clientX - r.left) / r.width)), best = 0;
        STOPS.forEach(function (v) { if (Math.abs(pos(v) - f) < Math.abs(pos(best) - f)) best = v; });
        return best;
      }
      var v0 = near(e);
      function move(ev) { var v = near(ev); if (v !== v0) { v0 = v; set(v); } }
      function up() { document.removeEventListener('pointermove', move); document.removeEventListener('pointerup', up); }
      document.addEventListener('pointermove', move); document.addEventListener('pointerup', up);
      set(v0); e.preventDefault();
    };
    return wrap;
  }
  function brief(sec) {   // a duration as few characters as it can be: 45s, 13m, 2h05
    sec = Math.round(sec);
    if (sec < 60) return sec + 's';
    if (sec < 3600) return Math.round(sec / 60) + 'm';
    var m = Math.round(sec / 60);
    return Math.floor(m / 60) + 'h' + (m % 60 < 10 ? '0' : '') + (m % 60);
  }

  function icon(name, label) {
    var b = el('button', 'ico');
    b.innerHTML = '<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">' + ICONS[name] + '</svg>';
    b.title = label; b.setAttribute('aria-label', label);
    return b;
  }
  function post(path, body) { return fetch(path, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)}); }
  function within(a, b) { return files.filter(function (x) { return x.end > a && x.start < b; }); }

  // --- recordings: one per name and size, wherever its copies are ---------

  function build() {
    var stages = data.stages || {}, by = {}, vw = data.view || {};
    SEAM = vw.day_starts_at != null ? +vw.day_starts_at : 9;
    files = [];
    data.pools.forEach(function (p) {
      p.rows.forEach(function (r) {
        (r.files || []).forEach(function (f) {
          var key = f.name + '|' + f.bytes, where = r.label + (p.kind === 'smb' ? ' (' + p.title + ')' : '');
          var x = by[key];
          if (x) {
            x.copies.push(where);
            if (p.kind !== 'smb' && x.remote) { x.f = f; x.remote = false; }   // play the local copy
            return;
          }
          var end = f.duration != null ? f.start + f.duration : f.end;
          x = by[key] = {f: f, start: f.start, end: Math.max(end, f.start + 1), copies: [where], remote: p.kind === 'smb',
                         color: (stages[r.stage] || {}).color || '#888', stage: (stages[r.stage] || {}).label || r.stage};
          files.push(x);
        });
      });
    });
    files.sort(function (a, b) { return a.start - b.start; });
    files.forEach(function (x, i) { x.i = i; });   // order, for alternating tones
    var lane = {};
    files.forEach(function (x) { var o = dayStart(x.start); (lane[o] = lane[o] || []).push(x); });
    // ghosts: what was here and is not now, where it was (a night of only ghosts still gets its lane)
    ghosts = (data.removed || []).map(function (r) {
      return {start: r.start, end: Math.max(r.end, r.start + 1), r: r};
    });
    ghosts.forEach(function (g) { var o = dayStart(g.start); lane[o] = lane[o] || []; });
    // keep each night's drawn track across reloads, so a repaint between redraws finds its lane
    var old = {};
    lanes.forEach(function (L) { old[L.origin] = L; });
    lanes = Object.keys(lane).map(Number).sort(function (a, b) { return a - b; })
      .map(function (o) { return {origin: o, end: next(o), files: lane[o], track: old[o] && old[o].track, w: old[o] && old[o].w}; });
  }

  // On the nights a bar is as tall as its average level, -72 to -24 dBFS; not measured yet: full and faint.
  var LOW = -72, HIGH = -24;
  function meter(d, x) {
    var lv = x.f.level;
    if (lv == null) { d.classList.add('unk'); return d; }
    var h = Math.max(.12, Math.min(1, (lv - LOW) / (HIGH - LOW)));
    d.style.top = (9 + (1 - h) * 26) + 'px';
    return d;
  }

  // What is marked for removal, and the button that moves it into .removed/<date>/, after asking.
  function marked() {
    var ms = groups.filter(function (g) { return g.remove; });
    var hit = files.filter(function (x) { return ms.some(function (g) { return x.end > g.start && x.start < g.end; }); });
    var b = document.getElementById('rmbtn');
    if (!hit.length) { if (b) b.remove(); return; }
    if (!b) { b = el('button'); b.id = 'rmbtn'; document.querySelector('header').appendChild(b); }
    var size = hit.reduce(function (s, x) { return s + x.f.bytes; }, 0);
    b.textContent = 'Remove marked: ' + hit.length + ' recordings, ' + (size / 1e9).toFixed(2) + ' GB…';
    b.onclick = function () {
      if (!confirm('Move ' + hit.length + ' recordings (' + (size / 1e9).toFixed(2) + ' GB) in ' + ms.length +
                   (ms.length === 1 ? ' marked group' : ' marked groups') + ' into .removed on their drive?\n\n' +
                   'Nothing is deleted: moving them back undoes it. They will show here as ghosts.')) return;
      b.disabled = true; b.textContent = 'moving…';
      fetch('/remove-marked', {method: 'POST'}).then(function (r) { return r.json(); })
        .then(function (d) { b.remove(); alert('Moved ' + d.moved + ' recordings into .removed.'); tick(); })
        .catch(function () { b.disabled = false; b.textContent = 'could not move them: see the window that ran fcpm pools'; });
    };
  }

  function ghost(g, span0, span, w) {
    var d = el('div', 'ghost');
    d.style.left = ((g.start - span0) / span * w) + 'px';
    d.style.width = ((g.end - g.start) / span * w) + 'px';
    d.onmouseenter = function () {
      if (drag) return;
      tip.textContent = '';
      tip.appendChild(el('b', null, g.r.name));
      tip.appendChild(el('span', null, 'removed · was ' + hms(g.start) + '–' + hms(g.end) + ' · ' + dur(g.r.duration)));
      tip.appendChild(el('span', null, g.r.held === 'Recycle Bin' ? 'in the Recycle Bin: restore it there'
        : g.r.held ? 'moved aside: ' + g.r.held : 'gone: not in the Recycle Bin or .removed'));
      tip.style.display = 'block';
    };
    d.onmousemove = function (e) { tip.style.left = Math.min(e.clientX + 14, innerWidth - 370) + 'px'; tip.style.top = Math.max(8, e.clientY - 64) + 'px'; };
    d.onmouseleave = function () { tip.style.display = 'none'; };
    return d;
  }

  function frag(x, span0, span, w, cls) {
    var d = el('div', 'f' + (x.f.short ? ' short' : '') + (cls || ''));
    d.style.left = ((x.start - span0) / span * w) + 'px';
    d.style.width = ((x.end - x.start) / span * w) + 'px';
    d.style.background = x.color;
    d.onmouseenter = function () {
      if (drag) return;
      tip.textContent = '';
      tip.appendChild(el('b', null, x.f.name));
      tip.appendChild(el('span', null, hms(x.start) + '–' + hms(x.end) + ' · ' + dur(x.f.duration) + ' · ' + x.stage));
      tip.appendChild(el('span', null, x.f.level != null ? 'average level ' + x.f.level.toFixed(0) + ' dBFS' : 'level not measured yet'));
      if (x.copies.length > 1) tip.appendChild(el('span', null, 'also on: ' + x.copies.slice(1).join(', ')));
      tip.style.display = 'block';
    };
    d.onmousemove = function (e) { tip.style.left = Math.min(e.clientX + 14, innerWidth - 370) + 'px'; tip.style.top = Math.max(8, e.clientY - 64) + 'px'; };
    d.onmouseleave = function () { tip.style.display = 'none'; };
    d.ondblclick = function () { post('/open', {path: x.f.path}); };
    return d;
  }

  // --- the nights ---------------------------------------------------------

  function drawLanes() {
    main.textContent = '';
    var axis = el('div', 'axis'), at = el('div', 'track');
    var all = el('div', 'lab all', 'all');
    all.title = 'every night as one window: compressed, a timeline to shuttle on';
    all.onclick = function () { if (files.length) setWindow(extent().a, extent().b); };
    axis.appendChild(all); axis.appendChild(at); main.appendChild(axis);
    var prev = null;
    lanes.forEach(function (L) {
      for (var o = next(prev ? prev.origin : L.origin); prev && o < L.origin - 3600; o = next(o)) {
        var d = el('div', 'miss'); d.title = dayname(o) + ' \u2192 ' + wd(next(o)) + ': nothing recorded';
        main.appendChild(d);   // a night with nothing: a hard divider of its own
      }
      prev = L;
      var lane = el('div', 'lane'), lab = el('div', 'lab'), tr = el('div', 'track');
      var sound = L.files.reduce(function (s, x) { return s + (x.f.duration || 0); }, 0);
      lab.appendChild(el('b', null, dayname(L.origin) + ' → ' + wd(L.end)));
      lab.appendChild(el('small', null, hours(sound) + ' sound · ' + L.files.length));
      lab.title = 'open this whole night';
      lab.onclick = (function (L) { return function () { setWindow(L.origin, L.end); }; })(L);
      lane.appendChild(lab); lane.appendChild(tr); main.appendChild(lane);
      L.track = tr;
    });
    var W = lanes.length ? lanes[0].track.clientWidth : 0;
    [0, 3, 6, 9, 12, 15, 18, 21, 24].forEach(function (h) {
      var s = el('span', null, ((h + SEAM) % 24) + ':00'); s.style.left = (W * h / 24) + 'px'; at.appendChild(s);
    });
    lanes.forEach(function (L) {
      L.w = L.track.clientWidth;
      for (var h = 1; h < 24; h++) {   // every hour faint, every six stronger
        var t = el('div', 'tick' + (h % 6 ? ' hour' : '')); t.style.left = (L.w * h / 24) + 'px'; L.track.appendChild(t);
      }
      L.files.forEach(function (x) { L.track.appendChild(meter(frag(x, L.origin, L.end - L.origin, L.w), x)); });
      ghosts.forEach(function (g) { if (g.start >= L.origin && g.start < L.end) L.track.appendChild(ghost(g, L.origin, L.end - L.origin, L.w)); });
    });
    paintLanes();
  }

  // A stretch [a, b] painted on every lane it crosses, as a text selection wraps.
  function spans(a, b, make) {
    var n = 0;
    lanes.forEach(function (L) {
      var s = Math.max(a, L.origin), e = Math.min(b, L.end);
      if (e <= s || !L.track) return;
      var span = L.end - L.origin, d = make(L, n++ === 0);
      d.style.left = ((s - L.origin) / span * L.w) + 'px';
      d.style.width = Math.max(2, (e - s) / span * L.w) + 'px';
      L.track.appendChild(d);
    });
  }

  function groupLine(g, first, L, span0, span, w) {
    var gone = g.removed && !g.remove;
    var d = el('div', 'grp' + (g.show ? '' : ' tmp') + (g.remove ? ' rm' : '') + (gone ? ' gone' : '')); d.style.color = gone ? '#5c3535' : gcolor(g);
    if (g.show) d.style.background = gcolor(g);
    d.title = gname(g) + (g.show ? '' : ' (not yet a show)') + ' · ' + hm(g.start) + '–' + hm(g.end);
    d.onpointerdown = function (e) { e.stopPropagation(); };
    d.onclick = function () { openView(g.start, g.end); if (g.transcribe) openTx(g); };

    drawWin();
  };
  P.audio.addEventListener('playing', function () { P.fails = 0; P.tried = null; });

  function mss(s) {   // 0:07, 2:14, 1:02:10
    s = Math.max(0, Math.floor(s));
    var h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), r = ('0' + s % 60).slice(-2);
    return h ? h + ':' + ('0' + m).slice(-2) + ':' + r : m + ':' + r;
  }
  function clipTag() {
    var ct = document.getElementById('cliptag');
    if (!ct || !P.cur || !M) return;
    var into = Math.min(Math.max(P.t - P.cur.start, 0), P.cur.end - P.cur.start);
    ct.innerHTML = mss(into) + ' · <b>−' + mss(P.cur.end - P.cur.start - into) + '</b>';
    var wl = winEl.clientWidth, x0 = Math.max(tx(P.cur.start), 0), x1 = Math.min(tx(P.cur.end), wl), tw = ct.offsetWidth;
    if (x1 - x0 >= tw + 4) { ct.style.left = (x1 - tw - 1) + 'px'; }   // room inside: against its right end
    else ct.style.left = Math.min(x1 + 3, wl - tw) + 'px';             // too narrow: just past it
  }

  // Playing, but its sound is not coming (loading, seeking, or run dry): the clock says so.
  function waiting() {
    var a = P.audio;
    return P.playing && (a.paused || a.seeking || a.readyState < 3);
  }

  function frame() {
    if (!P.playing) { winEl.classList.remove('waiting'); return; }
    var w = waiting();
    if (w && !P.waitFrom) P.waitFrom = performance.now(); else if (!w) P.waitFrom = 0;
    winEl.classList.toggle('waiting', w);   // the class and P.waitFrom start together: dots and dashes blink as one
    if (P.cur && !P.audio.paused) P.t = P.cur.start + P.audio.currentTime;
    var v = view(), ph = document.getElementById('ph'), c = document.getElementById('clock');
    if (ph && M) ph.style.left = tx(P.t) + 'px';
    drawNow();
    if (hover) showReach();
    if (S.follow && M && win && !drag && P.t > xt(winEl.clientWidth * .9)) {   // near the right edge: turn the page
      var span = win.b - win.a;
      if (P.t + span * .85 <= extent().b + span) { setView(P.t - span * .1, P.t + span * .9, true); }
    }
    if (c) c.textContent = hms(P.t);
    try { clipTag(); } catch (e) {}
    P.raf = requestAnimationFrame(frame);   // first, so a failed repaint never stops the player
    if (!frame.n || ++frame.n % 15 === 0) { frame.n = 1; try { paintLanes(); } catch (e) {} }
  }

  function toggle() {
    if (!win) return;
    if (P.playing) return stop();
    var x = at(P.t != null ? P.t : win.a);
    if (!x) x = at(win.a);
    if (!x) return;
    P.playing = true; P.t = Math.max(P.t || x.start, x.start);
    start(x, P.t - x.start); drawCtl(); frame();
  }

  function stop() {
    P.playing = false; P.audio.pause(); cancelAnimationFrame(P.raf); winEl.classList.remove('waiting');
    if (win) { drawWin(); drawCtl(); paintLanes(); }
  }

  function setMuted(m) { P.muted = S.muted = m; P.audio.muted = m; keepS(); drawCtl(); }

  // --- gestures -------------------------------------------------------------

  function laneTime(e) {
    var best = null, bd = Infinity;
    lanes.forEach(function (L) {
      var r = L.track.getBoundingClientRect(), d = e.clientY < r.top ? r.top - e.clientY : e.clientY > r.bottom ? e.clientY - r.bottom : 0;
      if (d < bd) { bd = d; best = {L: L, r: r}; }
    });
    var x = Math.min(Math.max(e.clientX - best.r.left, 0), best.r.width);
    return best.L.origin + x / best.r.width * (best.L.end - best.L.origin);
  }
  function timeAtX(clientX) { var r = winEl.getBoundingClientRect(); if (!M) layout(); return xt(Math.min(Math.max(clientX - r.left, 0), r.width)); }
  function playFromStartOr(t) {   // the window's start (t null), or t: the playhead goes there, and it plays
    seek(t == null ? win.a : t);
    if (!P.playing) toggle();
  }

  // The reach: a tapering line from the playhead to the cursor, labelled with playing time to it.
  var hover = null, onBar = false;
  function ahead(a, b) {   // seconds of playing from a to b (negative if b is behind)
    var lo = Math.min(a, b), hi = Math.max(a, b), n = 0;
    within(lo, hi).forEach(function (x) { if (!skipped(x)) n += Math.max(0, Math.min(x.end, hi) - Math.max(x.start, lo)); });
    return b >= a ? n : -n;
  }
  function signed(sec) {
    var s = Math.round(Math.abs(sec)), m = Math.floor(s / 60), r = s % 60;
    return (sec < 0 ? '\u2212' : '+') + (m >= 60 ? Math.floor(m / 60) + ':' + (m % 60 < 10 ? '0' : '') + (m % 60) : m) + ':' + (r < 10 ? '0' : '') + r;
  }
  function showReach() {
    var rl = document.getElementById('reach'), rt = document.getElementById('reachlbl');
    if (!rl || !rt) return;
    if (!hover || !win || !M) { rl.style.display = rt.style.display = 'none'; return; }
    // in the strip between the waveform's floor (22 px up) and the show's bar (the bottom 9)
    var cx = hover.x, tc = xt(cx), mid = onBar ? winEl.clientHeight - 7.5 : winEl.clientHeight - 15;   // on the bar: in it
    rt.classList.toggle('onbar', !!onBar);
    rt.textContent = (P.t != null ? signed(ahead(P.t, tc)) + '  ' : '') + hms(tc);
    rt.style.display = 'block'; rt.style.top = (mid - 7) + 'px';
    var wl = winEl.clientWidth, right = cx < wl - 120;
    rt.style.left = right ? (cx + 8) + 'px' : 'auto'; rt.style.right = right ? 'auto' : (wl - cx + 8) + 'px';
    if (P.t == null) { rl.style.display = 'none'; return; }
    var px = tx(P.t);
    rl.style.display = 'block'; rl.style.top = (mid - 2) + 'px'; rl.classList.toggle('onbar', !!onBar);
    rl.style.left = Math.min(px, cx) + 'px'; rl.style.width = Math.max(1, Math.abs(cx - px)) + 'px';
    var ri = rl.firstChild, far = onBar ? 'rgba(255,255,255,.75)' : 'rgba(201,209,220,.35)';   // on the bar: white to the end
    ri.style.clipPath = cx >= px ? 'polygon(0 0, 100% 45%, 100% 55%, 0 100%)' : 'polygon(0 45%, 100% 0, 100% 100%, 0 55%)';
    ri.style.background = 'linear-gradient(' + (cx >= px ? 90 : 270) + 'deg, rgba(255,255,255,.8), ' + far + ')';
  }
  winEl.addEventListener('mousemove', function (e) { hover = {x: e.clientX - winEl.getBoundingClientRect().left}; showReach(); });
  winEl.addEventListener('mouseleave', function () { hover = null; showReach(); });

  function winTime(e) {   // through the window's layout, compressed or not
    var r = winEl.getBoundingClientRect();
    if (!M) layout();
    return xt(Math.min(Math.max(e.clientX - r.left, 0), r.width));
  }

  // Dragging: on the nights, in the window, or an edge's handle (the window rescales on release).
  var redraw = 0;
  function soon(fn) { if (!redraw) redraw = requestAnimationFrame(function () { redraw = 0; fn(); }); }

  document.addEventListener('pointerdown', function (e) {
    if (e.button !== 0) return;
    var h = e.target.closest('.hdl');
    if (h && win) {
      drag = {on: 'edge', edge: h.dataset.edge, src: h.closest('#win') ? 'win' : 'lanes', from: {a: win.a, b: win.b}, x: e.clientX, y: e.clientY};
      drag.fv = drag.src === 'win' ? view() : null;
    } else {
      var on = e.target.closest('#win') ? 'win' : e.target.closest('.lane .track') ? 'lanes' : null;
      if (!on || e.target.closest('.grp, .grpname')) return;
      var t = on === 'win' ? winTime(e) : laneTime(e);
      if (on === 'lanes' && win && t > win.a && t < win.b) on = 'pan';   // inside the window on the nights: carry it
      drag = {on: on, a: t, b: t, x: e.clientX, y: e.clientY, force: on === 'win' && (e.ctrlKey || e.metaKey), from: win && {a: win.a, b: win.b}};
      if (on === 'pan') document.body.classList.add('panning');
      if (on === 'win') drag.hold = setTimeout(function () {   // a long press insists: play exactly here
        if (drag && !drag.moved) { drag.long = true; seek(drag.a, false, true); }
      }, 500);
    }
    tip.style.display = 'none';
    e.target.setPointerCapture && e.target.setPointerCapture(e.pointerId);
    e.preventDefault();
  });
  document.addEventListener('pointermove', function (e) {
    if (!drag) return;
    drag.moved = drag.moved || Math.abs(e.clientX - drag.x) > 3 || Math.abs(e.clientY - drag.y) > 3;
    if (drag.on === 'edge') {
      var t = drag.src === 'win' ? winTime(e) : laneTime(e);
      if (drag.edge === 'a') win.a = Math.min(t, win.b - 1); else win.b = Math.max(t, win.a + 1);
      soon(function () { paintLanes(); if (drag && drag.src === 'win') drawWin(); });
      return;
    }
    if (drag.on === 'pan') {
      var dt = laneTime(e) - drag.a;
      win = {a: drag.from.a + dt, b: drag.from.b + dt};
      soon(function () { paintLanes(); });
      return;
    }
    drag.b = drag.on === 'win' ? winTime(e) : laneTime(e);
    soon(function () { if (!drag) return; if (drag.on === 'win') drawWin(); else paintLanes(); });
  });
  document.addEventListener('pointerup', function () {
    if (!drag) return;
    var d = drag; drag = null;
    clearTimeout(d.hold);
    document.body.classList.remove('panning');
    if (d.long) return;
    if (d.on === 'pan') {
      var to = {a: win.a, b: win.b};
      win = d.from;
      if (d.moved) setView(to.a, to.b); else { drawWin(); paintLanes(); }
      return;
    }
    if (d.on === 'edge') {
      var now = {a: win.a, b: win.b};
      win = d.from;
      if (d.moved) setView(now.a, now.b);
      else if (d.src === 'win') playFromStartOr(d.edge === 'a' ? null : timeAtX(d.x));   // not dragged: a click, fallen through
      else { drawWin(); paintLanes(); }
      return;
    }
    if (!d.moved) {   // a click: put the playhead there
      if (d.on === 'win' && SEL) { SEL = null; drawCtl(); }   // a plain click lets go of the selection
      if (win && d.on === 'win' && !d.force && d.a <= win.a) playFromStartOr(null);   // the gutter: play from the start
      else if (win && d.on === 'win') seek(d.a, false, d.force);
      else { if (win) drawWin(); paintLanes(); }
      return;
    }
    var a = Math.min(d.a, d.b), b = Math.max(d.a, d.b);
    if (d.on === 'win') { SEL = {a: a, b: b}; drawWin(); drawCtl(); }   // select; the view stays where it is
    else setWindow(a, b);
    if (!win) paintLanes();
  });

  winEl.addEventListener('contextmenu', function (e) {   // a right-click insists too
    if (!win) return;
    e.preventDefault();
    seek(winTime(e), false, true);
  });

  // On the nights, the hand says the window can be carried; elsewhere, the text cursor says a new one starts
  main.addEventListener('pointermove', function (e) {
    if (drag || !win) return;
    var tr = e.target.closest && e.target.closest('.lane .track');
    if (!tr) return;
    var t = laneTime(e);
    tr.style.cursor = t > win.a && t < win.b ? 'grab' : '';
  });

  // The wheel zooms about the pointer; one burst of turning is one step back for Backspace.
  var wheeling = 0;
  winEl.addEventListener('wheel', function (e) {
    if (!win) return;
    e.preventDefault();
    var unit = e.deltaMode ? 40 : 1, dx = e.deltaX * unit, dy = e.deltaY * unit, a, b;
    if (e.shiftKey || Math.abs(dx) > Math.abs(dy)) {   // sideways: pan, by as much of the view as the wheel turned
      var sh = (Math.abs(dx) > Math.abs(dy) ? dx : dy) / winEl.clientWidth * (win.b - win.a);
      a = win.a + sh; b = win.b + sh;
    } else {   // up and down: zoom, about the pointer
      var t = winTime(e), f = Math.exp(dy * 0.0015);
      a = t - (t - win.a) * f; b = t + (win.b - t) * f;
    }
    var X = extent(), pad = (X.b - X.a) * .03;
    if (b - a < 1) return;
    if (b - a > X.b - X.a + 2 * pad) { a = X.a - pad; b = X.b + pad; }   // out no further than everything there is
    if (a < X.a - pad) { b += X.a - pad - a; a = X.a - pad; }
    if (b > X.b + pad) { a -= b - X.b - pad; b = X.b + pad; }
    if (Math.abs(a - win.a) < .01 && Math.abs(b - win.b) < .01) return;
    if (!wheeling) remember();
    clearTimeout(wheeling); wheeling = setTimeout(function () { wheeling = 0; }, 450);
    setView(a, b, true);
  }, {passive: false});
  document.addEventListener('keydown', function (e) {
    if (e.key === ' ' && win) { e.preventDefault(); toggle(); }
    else if ((e.key === 'm' || e.key === 'M') && win) setMuted(!P.muted);
    else if (e.key === 'Backspace' && win) { e.preventDefault(); back(); }
    else if (e.key === 'Escape') { if (SEL) { SEL = null; drawWin(); drawCtl(); } else if (TX.open) closeTx(); else closeWindow(); }
    else if ((e.key === 't' || e.key === 'T') && win) toggleTx();
    else if ((e.key === 'z' || e.key === 'Z') && SEL) { var z = SEL; setView(z.a, z.b); }
  });

  // --- data -----------------------------------------------------------------

  function tick() {
    var began = saves;
    Promise.all([fetch('/now', {cache: 'no-store'}).then(function (r) { return r.json(); }),
                 fetch('/groups', {cache: 'no-store'}).then(function (r) { return r.json(); })])
      .then(function (v) {
        if (drag) return;
        data = v[0]; shows = v[1].shows;
        if (saves === began) groups = v[1].groups;
        var cur = P.cur && P.cur.f.path;
        build();
        if (cur) P.cur = files.filter(function (x) { return x.f.path === cur; })[0] || null;
        var sound = files.reduce(function (s, x) { return s + (x.f.duration || 0); }, 0);
        document.getElementById('meta').textContent = files.length + ' recordings · ' + hours(sound) + ' of sound · ' +
          groups.length + (groups.length === 1 ? ' group' : ' groups') + (ghosts.length ? ' · ' + ghosts.length + ' removed' : '');
        marked();
        var known = files.filter(function (x) { return x.f.level != null; }).length;   // levels arriving redraw the nights
        var s = files.length + ':' + (files.length ? files[files.length - 1].end : 0) + ':' + innerWidth + ':' + known + ':' + ghosts.length;
        if (s !== sig) { sig = s; drawLanes(); } else paintLanes();
        if (win) { drawWin(); if (!P.playing) drawCtl(); }
        drawTx();
      })
      .catch(function () { document.getElementById('meta').textContent = 'the window that showed this has closed'; });
  }
  addEventListener('resize', function () { sig = ''; tick(); });
  tick(); setInterval(tick, 15000); loadHeard();
})();
</script>
