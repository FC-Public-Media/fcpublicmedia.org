# switch.cfg -- EdgeOS configure-mode commands that make an EdgeRouter X a dumb switch.
# Two commits, to a freshly reset unit: see troves/edgerouter-x/README.md.

#   PHASE 1 -- eth0 untouched, so the unit stays reachable at 192.168.1.1

set interfaces switch switch0 switch-port interface eth1
set interfaces switch switch0 switch-port interface eth2
set interfaces switch switch0 switch-port interface eth3
set interfaces switch switch0 switch-port interface eth4
delete interfaces ethernet eth1 address
set interfaces switch switch0 address dhcp
set interfaces switch switch0 description studio-switch
delete service unms
set system host-name fcpm-switch
set system time-zone America/Denver
# + set system login user ubnt authentication plaintext-password <from Credential Manager>

#   PHASE 2 -- commit-confirm: eth0 joins the switch and 192.168.1.1 goes away

delete interfaces ethernet eth0 address
set interfaces switch switch0 switch-port interface eth0
