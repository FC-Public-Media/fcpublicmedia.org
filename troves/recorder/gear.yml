# gear.yml — the recorder trove's gear, in ../../machines/gear.yml's fields; the bay provisions it. See README.md.
# Presence is never declared here: the procedure's `check` finds it.

version: 1

gear:
  - gear: obs-portable
    for: >
      The recorder on Windows: what plays a capture deck, a multiviewer or a
      RØDECaster into files a node catches. A second OBS, beside and never in
      place of the one people sit down to.
    platform: windows
    vendor: OBS Project (github.com/obsproject/obs-studio), GPL-2.0

    # Not winget: its OBS is the members' install; only the portable zip keeps its settings to itself.
    package: OBS-Studio-<version>-Windows-x64.zip
    source: https://github.com/obsproject/obs-studio/releases
    provisioner: bay
    updates: bay
    self-update: "off: EnableAutoUpdates=false in config\\obs-studio\\global.ini, asserted by the bay after every install"

    # under %LOCALAPPDATA%\<profile>\: the prefix says whose code this is (../README.md, Rules)
    at: troves\recorder\obs
    portable: obs_portable_mode.txt
    launch: --multi --portable --profile "FCPM Recorder" --collection "FCPM Recorder" --minimize-to-tray (obs.ps1 start)

    restart-tier: app        # only this OBS bounces; the system one is not touched
    holds: >
      its own config\ folder: the fcpm-recorder profile and scene collection,
      and the websocket's settings. The password is in Credential Manager under
      fcpm-recorder:obs-websocket.
    websocket: 4456          # the system OBS has 4455
    grants: >
      one, placed at the desk at install: a Windows Firewall rule BLOCKING
      inbound for this obs64.exe. Loopback is not filtered, so the node on this
      machine still reaches the websocket and nothing else can.
