# presets.yml -- the camera settings an operator sets with one button.
#
# The operator page (/presets) shows one button per preset, in this order.
# Pressing one sets each value below over USB, then reads every one back and
# says which took. Curating this list is the whole point: nobody at the button
# has to know what an ND stop is.
#
# DRAFT. These are starting points for the studio's lights and the ATEM, which
# runs 1080p at 24 fps today. Autumn curates them; edit freely.
#
# Settings, written the way a person says them:
#   resolution   one of the camera's own: "1920 x 1080", "3840 x 2160", "4096 x 2160", ...
#   fps          project frame rate: 23.98, 24, 25, 29.97, 30, 50, 59.94
#   shutter      shutter speed, the bottom of the fraction: 48 is 1/48
#   iso          100 to 16000 (the camera's list)
#   wb           white balance in kelvin, 2500 to 10000 in steps of 50
#   tint         -50 to 50
#   nd           built-in ND filter, in stops: 0, 2, 4 or 6
# Order matters: frame rate comes before shutter, because the shutter can't be
# slower than a frame.

presets:
  - name: studio-tungsten
    label: Studio, warm lights
    says: For the studio's tungsten and warm LED lights.
    settings: {fps: 24, shutter: 48, iso: 800, wb: 3200, tint: 0, nd: 0}

  - name: studio-daylight
    label: Studio, daylight LEDs
    says: For daylight-balanced LED panels.
    settings: {fps: 24, shutter: 48, iso: 800, wb: 5600, tint: 0, nd: 0}

  - name: window-light
    label: By the window
    says: Bright daylight through the window. Adds 2 stops of ND.
    settings: {fps: 24, shutter: 48, iso: 800, wb: 5600, tint: 0, nd: 2}

  - name: low-light
    label: Low light
    says: A dim room with no studio lights. Grainier, but bright enough.
    settings: {fps: 24, shutter: 48, iso: 3200, wb: 4300, tint: 0, nd: 0}
