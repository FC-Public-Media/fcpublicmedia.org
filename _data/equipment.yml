# What kinds of gear FCPM has.
#
# Deliberately NOT an inventory.
#
# The real inventory lives in Booqable, which is the system of record and the
# only place staff actually work from. Members do not pick items themselves —
# they email fcpmequipment@gmail.com describing what they need, and staff
# select the gear. So an item-level list here would serve nobody: it would
# duplicate Booqable, drift from it within a month, and answer a question no
# visitor is asking.
#
# What a visitor is actually asking is "do you have the sort of thing I need,
# and is joining worth it?" — which is a question about categories, not serial
# numbers. That answer changes maybe once a year, so keeping it here costs
# nothing and cannot meaningfully go stale.
#
# If FCPM ever wants a real catalogue on the site, the right move is to read
# Booqable, not to retype it — the same pattern as script/sync-cablecast.py.

categories:
