# THE MISSION STATEMENT. The board president's words, September 2026, verbatim.
#
# Do not rewrite this into the site's voice. It is shorter and plainer than
# anything we would have written and that is exactly why it is here — see
# CLAUDE.md, "Bryan's wording is authoritative".
#
# Rendered on the homepage above the channel, and it belongs on /about/ too
# once that page has the rest of its content. Empty is a valid state: the
# homepage band disappears entirely rather than leaving a gap.
mission: >-
  Fort Collins Public Media offers the equipment, training, and artistic space
  for Northern Coloradans to craft their visions into reality.

# Optional homepage photo. Set it to something like /assets/img/studio.jpg and
