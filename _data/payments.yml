# How FCPM takes money, and which system takes which kind.
#
# THE SHORT VERSION
# -----------------
# Stripe takes membership and class money. Booqable takes equipment rental
# money, through its own Stripe connection. Nothing goes through Wix.
#
# TWO SYSTEMS, ONE STRIPE ACCOUNT, TWO CREDENTIALS
# ------------------------------------------------
# Booqable is already connected to the Stripe account and already charges
# through it. We are adding a second, separate credential for our own use
# rather than reusing whatever Booqable holds — same account, same balance,
# same payouts, but neither system can act as the other, and either can be
# revoked without taking the other down.
#
# WHICH KEYS EXIST, AND WHERE EACH ONE LIVES
# ------------------------------------------
# Stripe issues three kinds and they are not interchangeable:
#
#   pk_live_…   Publishable. Safe in public. It can start a payment and can do
#               nothing else — this is the one below, in this file, in git.
#   rk_live_…   Restricted. NOT public. Permissions chosen per key; ours may
#               write Checkout Sessions and nothing else. Lives in the worker
#               as a secret. Never in this repository.
#   sk_live_…   Secret, unrestricted, can do anything to the account including
#               move money out. Stripe now recommends against using these for
#               new work. We do not have one in play and should not.
#
# If a key beginning `rk_` or `sk_` ever appears in a file in this repository,
# it is compromised the moment it is pushed — treat it as burned, rotate it in
# the Stripe dashboard, and do not merely delete the line. GitHub scans public
# repositories for exactly this pattern and will usually tell you first.
#
# To set the restricted key:
#
#     cd worker && npx wrangler secret put STRIPE_KEY
#
# It prompts, reads from the terminal, and stores it encrypted at Cloudflare.
# It is never written to disk here and never appears in wrangler.jsonc.

stripe:
  # The publishable key. Safe to commit — see above.
  #
  # TODO — paste from https://dashboard.stripe.com/apikeys. Use the pk_test_
  # key while checking the flow works; nothing is charged with it and test
  # cards are at https://docs.stripe.com/testing.
  publishable_key: ""

  # Set true once the live key is in and the board has agreed the terms below.
  # Every buy button on the site checks this, so the whole thing can be turned
  # off in one line without unpicking any pages.
  live: false

# ------------------------------------------------------------------ the terms
#
# These exist because we are about to offer subscriptions, and a subscription
# is a standing promise about future prices. A yearly charge that changes
# without notice is the single most common cause of a chargeback, and being
# right about the amount does not help once the bank is involved.
#
# The prices themselves are NOT here. They are in _data/membership.yml, and the
# broker charges from a copy generated out of it — so a price change is a
# commit, a diff, and a pull request. That is the announcement flow, and it is
# the reason prices are not kept in the Stripe dashboard where a change leaves
# no trace. See script/build-prices.py.
terms:
  # TODO — board to confirm. Thirty days is the usual floor and is what the
  # card networks expect to see when a cardholder disputes a renewal.
  price_change_notice_days: 30

  # WHAT THE TWO OPTIONS ACTUALLY DIFFER ON
  # ---------------------------------------
  # Not convenience. They differ on what happens when a price changes, and
  # that has to be said out loud on the page, because a buyer choosing between
  # them cannot work it out.
  #
  #   Paying for the year up front IS a price lock, for that year. There is no
  #   renewal to reprice, so a change during those twelve months cannot reach
  #   you. It is the special deal, and it is special because it is prepaid.
  #
  #   Subscribing is the opposite: it renews at whatever the price is on your
  #   anniversary. FCPM has never had grandfathered plans — everybody is
  #   always on the current one — so a subscription is a standing agreement to
  #   the current price, not to today's.
  #
  # Stripe will not do that second part on its own. A subscription is pinned
  # to the amount it was created at and renews at that amount forever; Stripe
  # never reads this repository. Moving existing subscribers onto a new price
  # is script/reprice-subscriptions.py, run by a person AFTER the notice
  # period below has actually elapsed.
  lock:
    upfront: >-
      Paying for the year up front fixes your price for that year. Nothing can
      change until you renew.
    subscription: >-
      A renewing membership is charged at the price on the day it renews. We
      announce any change at least a month beforehand, and it applies to
      everyone at once — we do not keep old members on old prices.

  # Said on the checkout page and in the confirmation email, not buried.
  summary:
    - A membership runs one year from the day you buy it.
    - You choose whether it renews. A single payment simply lapses at the end of the year.
    - Paying up front fixes your price for that year.
    - If you choose to renew, we email you before each renewal.
    - We announce any price change at least a month before it would affect you.
    - Everyone pays the current price. We do not keep old members on old prices.
    - You can cancel a renewal at any time, and the year you already paid for still runs out.

  # How a price change actually reaches people. The steps are in order and the
  # order is the point — step 5 must not happen before step 4 has been true
  # for `price_change_notice_days`.
  #
  #   1. Edit the price in _data/membership.yml.
  #   2. Pull request, review, merge. That is the price history.
  #   3. New members pay the new price as soon as it deploys.
  #   4. Email the membership. (Constant Contact, per the note below.)
  #   5. After the notice period: python3 script/reprice-subscriptions.py --apply
  #   6. Everyone renews at the new price on their own anniversary.
  #
  # Nobody is prorated at step 5. The year already bought runs out at the price
  # it was bought at.
  announcements:
    # TODO — confirm. Autumn's recollection is Constant Contact; whoever holds
    # that login should be named here, because step 4 above is a person's job
    # and an unnamed job is nobody's.
    channel: Constant Contact
    owner: TODO

  # TODO — needs a real page before subscriptions are switched on. A link to
  # this is required on the checkout page for recurring charges.
  page: /policies/membership-terms/

# --------------------------------------------------------------- what we sell
#
# Kept as a list so the pages can be generated rather than hand-maintained, and
# so there is one place to see everything that can take a payment.
#
# `sku` matches the key in worker/src/prices.js. If it does not, the button
# 400s — which is the right failure, since the alternative is charging for
# something other than what was clicked.
sells:
  - what: Membership
    sku_prefix: "membership:"
    system: stripe
    page: /membership/
    note: One year from purchase, optionally renewing.

  - what: Class drop-in
    sku_prefix: "class-dropin:"
    system: stripe
    page: /classes/
    note: >-
      Not switched on — the drop-in prices in _data/classes.yml are still TODO,
      so the generator refuses to put them up for sale.

  - what: Equipment rental
    sku_prefix: null
    system: booqable
    page: /equipment/
    note: >-
      Booqable's own checkout, on Booqable's own Stripe connection. We
      deliberately do not sell equipment through our broker — two systems
      charging for one booking is how somebody gets billed twice and only one
      side knows to release the gear.

# ------------------------------------------------------------------ Booqable
#
# Spelled with a q. It is booqable.com, a rental business system — not
# "Bookable", which is what several files in this repository called it before
# anybody had checked.
#
# WHAT IS WRONG WITH IT TODAY
# ---------------------------
# On Wix, Booqable is embedded in an iframe, and the iframe is too short. There
# are more than six items available and no indication of it — you have to
# discover that the inner frame scrolls. That is not Booqable's fault. Wix's
# HTML element IS an iframe, so it is the only thing Wix can do.
#
# On our own site it does not have to be one. Booqable's real integration is a
# script plus a set of mount points — `<div class="booqable-product-search">`
# and friends — that render inline, in our own page, in our own stylesheet,
# sized by the page like any other content. No inner scrollbar, no fixed
# height, nothing hidden below a fold that is not the real fold.
#
# THE EMBED NEEDS NO CREDENTIAL. This was wrong in the first draft of this
# file, which listed an API token as though it were required to show products.
# It is not, and the distinction is worth keeping straight:
#
#   The embed is authenticated by a COMPANY ID, which is public by design.
#   Booqable pre-populates it into the snippet precisely so it can be pasted
#   into any website's HTML. Products, live availability, real pricing, cart
#   and checkout all work from it. Nothing secret is involved and nothing
#   needs storing anywhere but this file.
#
#   The API token is a different thing entirely. Booqable's own docs say to
#   keep it out of client-side code — it is an employee-scoped credential that
#   can read and write the business. It buys exactly one thing we might want
#   and cannot get from the embed: the catalog as data at BUILD time, so gear
#   appears in our own HTML rather than being drawn by their JavaScript after
#   the page loads.
#
# So the token is optional, and it is not needed for anybody to reserve
# anything. It would only be worth adding if we want the equipment list to be
# in the page source — indexable by search engines, readable with JavaScript
# off, and styled entirely by us. That is a real benefit and it is also a
# GitHub Action, a stored secret, and a sync that can drift. Not yet.
booqable:
  # The snippet, copied verbatim from Booqable: Settings → Online Bookings →
  # Website integration → "Copy to clipboard".
  #
  # Pasted rather than reconstructed, and this is the evidence for why. The
  # guess was `https://SLUG.booqable.com/embed.js`. The real thing is a UUID
  # on a different host under a versioned path — nothing about it is derivable
  # from the company name, and a snippet assembled from a guess reviews fine
  # and loads nothing.
  #
  # Public by design: it goes in a <script> tag on a public page, which is as
  # public as a string gets. It is an asset identifier, not a credential — it
  # cannot read the business the way an API access token can.
  snippet: '<script src="https://1463eea8-db0a-45d4-9801-176111dc06a5.assets.booqable.com/v2/booqable.js"></script>'

  # NOT the same identifier as the one in the snippet above.
  #
  # The snippet's UUID belongs to the asset host. The API lives at
  # https://SLUG.booqable.com/api/4/ where SLUG is the subdomain of the
  # Booqable dashboard — a short name, not a UUID. Only needed if a build-time
  # catalog sync is ever wanted, which today it is not. Left empty rather than
  # filled in with the UUID, because the two are easy to confuse and a wrong
  # value here would fail in a way that looks like the token being wrong.
  company_slug: ""

  # Deliberately absent: an API token. See above. If a build-time catalog sync
  # is ever wanted, that is when a BOOQABLE_TOKEN repository secret earns its
  # keep — and it should be created read-only, since listing products is all
  # this repository would ever do with it.

  # The mount points Booqable's script hydrates. Listed here rather than
  # hardcoded in the page so the set can change without a template edit, and
  # so there is one place to see what the page is asking Booqable to draw.
  #
  # These are ordinary divs in our own document, not an iframe. That is the
  # whole reason for doing this on our own site: the page grows to fit the
  # content, so there is no inner scrollbar and no hidden seventh item.
  #
  # `booqable-product-list` takes data attributes, and two of them are aimed
  # straight at what is wrong today. `data-per` sets how many items a page
  # shows, so the list PAGINATES — a control you can see, with a next button —
  # instead of hiding the seventh item below the fold of a fixed-height box.
  # `data-show-search="true"` folds the search field in rather than needing a
  # second mount point. Also available: data-tags, data-collections,
  # data-limit.
  components:
    - class: booqable-datepicker
      what: Pick the dates first, so everything below shows real availability.
    - class: booqable-product-list
      attributes: 'data-per="12" data-show-search="true"'
      what: Every product, twelve to a page, with the search field built in.
