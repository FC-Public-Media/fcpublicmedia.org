# Who is on the floor, and what they can help you do.
#
# NOTHING RENDERS THIS YET, ON PURPOSE. It is a roster taken down from the
# secretary so the design in RESERVE-DESIGN.md has something real to be built
# against. Publishing a person's name is a decision, not a side effect of
# recording it, so no page reads this file until somebody says so.
#
# When it does go live it replaces _data/board.yml — same people, and one card
# serving /meet/ and /reserve/ rather than two lists that drift.
#
# WHAT IS DELIBERATELY NOT IN HERE
# --------------------------------
# The roster arrived with a lot of candid, affectionate detail about how each
# person works: who rambles, who is a wildcard, whose background is in what,
# who should not be left alone with a camera. None of that is written down
# here, and it should not be added later either.
#
# Two reasons, and the second is the load-bearing one:
#
#   1. It was said in confidence to describe an operation, not to describe
#      people on a public page that search engines index.
#   2. A capability list says the same thing without characterising anybody.
#      Somebody who does not operate cameras simply has no `video` entry. The
#      absence carries the fact; a sentence about it would carry a judgement.
#
# `bio` is left EMPTY for everyone rather than filled in with a guess. Each
# person writes their own introduction. That is the whole point of an
# introduction, and it is why the ones here are blank rather than TODO — a
# TODO in this field would render on a public page. The UI shows the gap.
#
# WHAT A HOST IS CALLED IS UNSETTLED. "Host" is a placeholder and nobody likes
# it. See the note at the end of RESERVE-DESIGN.md.

# ---------------------------------------------------------------- vocabulary
#
# Shared, so two people who can do the same thing describe it the same way.
# Picked from, never written freehand. Adding to this list is a decision about
# what we offer; adding one to a person is a decision about what they offer.
#
# There is a ladder implied here, and it is worth naming because it is what
# the roster actually varies along:
#
#   presence     somebody is here, the door opens, nobody is unsupervised
#   orientation  you get shown where things are and how to start
#   operation    somebody who can competently run the gear is here
#   production   somebody does the work for you  <- NOT OFFERED YET
#
# `presence` is not in the list below because everybody has it. It is what
# being on the schedule means, so recording it per-person would be noise.
#
# `production` is deliberately absent too. It is a real future offering — paid,
# an escalation of responsibility rather than of skill, and possibly discounted
# for members — but nobody has agreed to it, so nobody is listed for it.
activities:
  - id: orientation
    label: Getting started
    detail: >-
      Finding the equipment, getting the software open, making sure sound is
      coming out of the right place. Nobody should leave because they could not
      work out how to begin.
  - id: audio
    label: Audio
  - id: video
    label: Video
  - id: podcast
    label: Podcasting
  - id: broadcast
    label: Broadcast
  - id: editing
    label: Editing
  - id: web
    label: Web
  - id: outreach
    label: Outreach and publicity

# --------------------------------------------------------------------- people
#
# Order is not significance. Officers carry `role`; the rest do not have one
# and that is not a gap.
#
# `scheduled: false` means they are on the board but not in the hosting
# rotation, and it is not a judgement either — see the notes.

people:
  - name: Bryan
    role: Board president
    bio: ""
    # Also the BOOKER: the person who confirms appointments, knows when the
    # usual host cannot make it this week, and is the point of contact for
    # anything outside a normal slot. That is a separate job from hosting and
    # will want its own field once the reserve page exists.
    booker: true
    # Left empty on purpose rather than filled in with "everything". He can
    # cover essentially anything, which makes him the hardest one to describe
    # honestly in a list, and he has not picked yet.
    supports: []

  - name: Morey
    role: Treasurer
    bio: ""
    supports: [orientation, outreach]

  - name: Autumn
    role: Secretary
    bio: ""
    supports: [orientation, audio, web]

  - name: Nate Keen
    bio: ""
    supports: [orientation, audio, video, podcast, broadcast, outreach]

  - name: James
    bio: ""
    supports: [orientation]

  - name: Chris Crenshaw
    bio: ""
    # Kept minimal at the secretary's explicit request. His own words only,
    # when he writes them.
    supports: [orientation, outreach]

  - name: Anatoly Samsonov
    bio: ""
    supports: [video, editing]
    # Rarely at board meetings, so weekly availability is not assumed. Worth
    # having on the calendar when he is in — the production work he could do
    # is revenue, and board members are cut in on that the way they are for
    # teaching a class.

  - name: Josh Colonnieves
    bio: ""
    scheduled: false
    supports: []
    # Not in the rotation because he already hosts a standing weekly session of
    # his own — a live Dungeons & Dragons stream — which is how he meets the
    # hosting commitment. Covering the room for his own booking is the same
    # work; putting him in the general pool would double-count it.

# NOT LISTED, AND ON PURPOSE:
#
# Carson, the city's representative. Not a board member on paper and not in the
# rotation. The working relationship with the city — retired equipment finding
# a responsible home, and the technical help that comes with it — runs through
# him and matters enormously, but none of that is a slot on a booking page.
