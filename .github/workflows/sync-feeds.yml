name: Sync member feeds

# see docs/inline/.github/workflows/sync-feeds.yml.md#1

on:
  schedule:
    - cron: "0 12 * * *" # 06:00 America/Denver in summer, 05:00 in winter
  workflow_dispatch:

  # see docs/inline/.github/workflows/sync-feeds.yml.md#2
  push:
    paths:
      - "site/_data/feeds.yml"
      - ".github/workflows/sync-feeds.yml"

permissions:
  contents: write

# see docs/inline/.github/workflows/sync-feeds.yml.md#3
concurrency:
  group: sync-feeds
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install the YAML reader
        run: pip install --quiet pyyaml

      # see docs/inline/.github/workflows/sync-feeds.yml.md#4
      - name: Read the feeds
        run: python3 site/bin/sync-feeds.py

      - name: Commit if anything changed
        run: |
          if git diff --quiet -- site/_data/member_programs.json; then
            echo "No new items."
            exit 0
          fi

          count=$(python3 -c 'import json; print(len(json.load(open("site/_data/member_programs.json"))["items"]))')

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/_data/member_programs.json
          git commit -m "Sync member feeds: ${count} items"
          git push
