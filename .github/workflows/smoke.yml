name: Smoke tests

# see docs/inline/.github/workflows/smoke.yml.md#1

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # see docs/inline/.github/workflows/smoke.yml.md#2
    - cron: "0 14 * * 2"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: ruby/setup-ruby@v1
        with:
          # see docs/inline/.github/workflows/smoke.yml.md#3
          ruby-version: .ruby-version
          bundler-cache: true
          # The build root is `site/`; the version file and the Gemfile are there.
          working-directory: site

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build the site
        working-directory: site
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      # see docs/inline/.github/workflows/smoke.yml.md#4
      - name: Test the calendar parser
        run: python3 site/bin/test_sync_calendar.py

      # see docs/inline/.github/workflows/smoke.yml.md#5
      - name: Test the claim minter
        run: python3 site/bin/test_mint_claim.py

      # see docs/inline/.github/workflows/smoke.yml.md#6
      - name: Test the design tokens
        run: python3 site/bin/test_tokens.py

      # see docs/inline/.github/workflows/smoke.yml.md#7
      - name: Test the machine binding
        run: python3 bin/test_binding.py

      # see docs/inline/.github/workflows/smoke.yml.md#8
      - name: Test the wallpaper generator
        run: python3 bin/test_make_wallpaper.py

      # see docs/inline/.github/workflows/smoke.yml.md#9
      - name: Test the show proposer
        run: python3 site/bin/test_propose_shows.py

      # see docs/inline/.github/workflows/smoke.yml.md#10
      - name: Test the catalog report
        run: python3 site/bin/test_catalog_report.py

      # see docs/inline/.github/workflows/smoke.yml.md#11
      - name: Test the feed reader
        run: |
          pip install --quiet pyyaml
          python3 site/bin/test_sync_feeds.py

      # see docs/inline/.github/workflows/smoke.yml.md#12
      - name: Test the price list, and check it is up to date
        run: |
          python3 site/bin/test_build_prices.py
          python3 site/bin/build-prices.py --check

      # see docs/inline/.github/workflows/smoke.yml.md#13
      - name: Test the subscription repricing
        run: python3 site/bin/test_reprice_subscriptions.py

      # see docs/inline/.github/workflows/smoke.yml.md#14
      - name: Check no secret key reached the site
        run: python3 site/bin/test_no_secrets.py

      # see docs/inline/.github/workflows/smoke.yml.md#15
      - name: Check nothing internal reached the site
        run: python3 site/bin/test_nothing_internal_is_published.py

      # see docs/inline/.github/workflows/smoke.yml.md#16
      - name: Test the kiosk artifact builder
        run: python3 bin/test_build_kiosk.py

      - name: Check the kiosk artifact is not stale
        run: python3 bin/build-kiosk.py --check

      # see docs/inline/.github/workflows/smoke.yml.md#17
      - name: Build the member site template and read its feed back
        run: python3 site/bin/check-template.py

      # see docs/inline/.github/workflows/smoke.yml.md#18
      - name: Test the broker
        working-directory: worker
        run: npm test

      - name: Install test dependencies
        working-directory: site/tests
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run smoke tests
        working-directory: site/tests
        run: npx playwright test --grep-invert @external

      # see docs/inline/.github/workflows/smoke.yml.md#19
      - name: Check embeds and outbound links
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        working-directory: site/tests
        run: npx playwright test --grep @external

      # see docs/inline/.github/workflows/smoke.yml.md#20
      - name: Upload the report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            site/tests/playwright-report/
            site/tests/test-results/
          if-no-files-found: warn
          retention-days: 14
