name: Propose shows

# One pull request per proposed show, so each merges or closes alone. See docs/programming.md.

on:
  # Monthly, after the catalog sync has had a chance to bring in new material.
  schedule:
    - cron: "0 15 8 * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Most pull requests to open in one run"
        default: "5"
      min_episodes:
        description: "Fewest episodes to count as a series"
        default: "3"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: propose-shows
  cancel-in-progress: false

jobs:
  propose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Skips shows already in site/_shows/.
      - name: Find the clusters
        run: python3 site/bin/propose-shows.py --min "${{ inputs.min_episodes || 3 }}" --json > /tmp/proposals.json

      - name: Open one pull request per show
        env:
          GH_TOKEN: ${{ github.token }}
          # Low, so a scheduled run trickles; raise it by hand for the backlog.
          LIMIT: ${{ inputs.limit || 5 }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          base="${GITHUB_REF_NAME}"
          opened=0

          for slug in $(python3 -c "import json;[print(p['slug']) for p in json.load(open('/tmp/proposals.json'))]"); do
            if [ "$opened" -ge "$LIMIT" ]; then
              echo "Reached the limit of $LIMIT; the rest wait for the next run."
              break
            fi

            branch="shows/$slug"

            # An open pull request is under review; pushing again would reset it.
            if gh pr list --head "$branch" --state open --json number --jq 'length' | grep -qv '^0$'; then
              echo "$slug: already open, leaving it alone"
              continue
            fi

            # Body first: once the file exists the show is configured, not proposed.
            python3 site/bin/propose-shows.py --body "$slug" > /tmp/body.md

            git checkout -B "$branch" "origin/$base"
            python3 site/bin/propose-shows.py --write --only "$slug"

            if git diff --quiet; then
              echo "$slug: nothing to write"
              continue
            fi

            git add "site/_shows/$slug.md"
            git commit -m "Propose $slug as a show"
            git push -f origin "$branch"

            gh pr create \
              --base "$base" \
              --head "$branch" \
              --title "Add $slug to the shows" \
              --body-file /tmp/body.md

            opened=$((opened + 1))
            git checkout "$base"
          done

          echo "Opened $opened pull request(s)."
