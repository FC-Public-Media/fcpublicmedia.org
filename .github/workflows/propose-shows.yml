name: Propose shows

# Adding a show to the platform, as a pull request somebody merges.
#
# ONE PULL REQUEST PER SHOW, ON PURPOSE
# -------------------------------------
# A single pull request with thirty files would have to be accepted or refused
# whole, and it will not be either — some of these are obviously right,
# some are obviously junk, and one or two need an argument about the name.
# Separate ones mean Paltrocast can be merged in a second while Parker St. is
# still being discussed.
#
# It is also the shape the steady state wants. Once the backlog is done, a new
# series showing up in the catalog produces exactly one pull request, which is
# exactly the thing that happened.
#
# The first run will open a lot of them. That is the backlog being visible
# rather than the workflow misbehaving, and closing one is a click.

on:
  # Monthly, after the catalog sync has had a chance to bring in new material.
  schedule:
    - cron: "0 15 8 * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Most pull requests to open in one run"
        default: "5"
      min_episodes:
        description: "Fewest episodes to count as a series"
        default: "3"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: propose-shows
  cancel-in-progress: false

jobs:
  propose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Reads _shows/ first, so anything already configured — or already
      # proposed and still open — is not proposed again.
      - name: Find the clusters
        run: python3 script/propose-shows.py --min "${{ inputs.min_episodes || 3 }}" --json > /tmp/proposals.json

      - name: Open one pull request per show
        env:
          GH_TOKEN: ${{ github.token }}
          # Defaults low so a scheduled run trickles rather than floods. Raise
          # it by hand when somebody has an afternoon for the backlog.
          LIMIT: ${{ inputs.limit || 5 }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          base="${GITHUB_REF_NAME}"
          opened=0

          for slug in $(python3 -c "import json;[print(p['slug']) for p in json.load(open('/tmp/proposals.json'))]"); do
            if [ "$opened" -ge "$LIMIT" ]; then
              echo "Reached the limit of $LIMIT; the rest wait for the next run."
              break
            fi

            branch="shows/$slug"

            # An open pull request for this show means somebody is already
            # looking at it. Pushing again would reset their review for no
            # reason — the proposal has not changed.
            if gh pr list --head "$branch" --state open --json number --jq 'length' | grep -qv '^0$'; then
              echo "$slug: already open, leaving it alone"
              continue
            fi

            # The body FIRST. Writing the file makes this show configured
            # rather than proposed, and asking for the description of a
            # proposal that no longer exists fails — which it should, and did.
            python3 script/propose-shows.py --body "$slug" > /tmp/body.md

            git checkout -B "$branch" "origin/$base"
            python3 script/propose-shows.py --write --only "$slug"

            if git diff --quiet; then
              echo "$slug: nothing to write"
              continue
            fi

            git add "_shows/$slug.md"
            git commit -m "Propose $slug as a show"
            git push -f origin "$branch"

            gh pr create \
              --base "$base" \
              --head "$branch" \
              --title "Add $slug to the shows" \
              --body-file /tmp/body.md

            opened=$((opened + 1))
            git checkout "$base"
          done

          echo "Opened $opened pull request(s)."
