name: Publish member sites

# see docs/inline/.github/workflows/publish-member-sites.yml.md#1

on:
  schedule:
    - cron: "0 13 * * 4" # 07:00 America/Denver in summer, 06:00 in winter
  workflow_dispatch:

permissions:
  contents: write

# see docs/inline/.github/workflows/publish-member-sites.yml.md#2
concurrency:
  group: publish-member-sites
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # see docs/inline/.github/workflows/publish-member-sites.yml.md#3
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: ruby/setup-ruby@v1
        with:
          # see docs/inline/.github/workflows/publish-member-sites.yml.md#4
          ruby-version: .ruby-version
          bundler-cache: true
          # see docs/inline/.github/workflows/publish-member-sites.yml.md#5
          working-directory: site

      - name: Install the YAML reader
        run: pip install --quiet pyyaml

      # see docs/inline/.github/workflows/publish-member-sites.yml.md#6
      - name: Build and publish
        id: publish
        shell: bash
        run: |
          python3 bin/build-sites.py --publish | tee /tmp/publish.log
          {
            echo "### Member sites"
            echo
            echo '```'
            cat /tmp/publish.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit if anything changed
        run: |
          # see docs/inline/.github/workflows/publish-member-sites.yml.md#7
          git add -A -- site/member-sites site/_data/member_sites.json

          if git diff --cached --quiet -- site/member-sites site/_data/member_sites.json; then
            echo "Nothing to publish: no member site changed."
            exit 0
          fi

          count=$(python3 -c 'import json; print(len(json.load(open("site/_data/member_sites.json"))["sites"]))')

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Publish member sites: ${count} listed"
          git push
