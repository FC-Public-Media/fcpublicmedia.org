name: Publish member sites
# The cadence: builds member sites into site/member-sites/ and commits; it never deploys.
# See docs/members.md#publish-workflow.

on:
  schedule:
    - cron: "0 13 * * 4" # 07:00 America/Denver in summer, 06:00 in winter
  workflow_dispatch:

permissions:
  contents: write

# Two runs writing site/member-sites/ at once could publish a half-composed site.
concurrency:
  group: publish-member-sites
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # Fetches pinned tenants; one still missing is reported `absent`, not an error.
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: ruby/setup-ruby@v1
        with:
          # A literal resolved inside working-directory; `site/.ruby-version` fails as "Unknown engine".
          ruby-version: .ruby-version
          bundler-cache: true
          working-directory: site

      - name: Install the YAML reader
        run: pip install --quiet pyyaml

      # `shell: bash` adds pipefail; without it the step takes tee's status and stays green.
      - name: Build and publish
        id: publish
        shell: bash
        run: |
          python3 bin/build-sites.py --publish | tee /tmp/publish.log
          {
            echo "### Member sites"
            echo
            echo '```'
            cat /tmp/publish.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit if anything changed
        run: |
          # Stage first: plain `git diff` misses a new, untracked site.
          git add -A -- site/member-sites site/_data/member_sites.json

          if git diff --cached --quiet -- site/member-sites site/_data/member_sites.json; then
            echo "Nothing to publish: no member site changed."
            exit 0
          fi

          count=$(python3 -c 'import json; print(len(json.load(open("site/_data/member_sites.json"))["sites"]))')

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Publish member sites: ${count} listed"
          git push
