name: Catalog report

# see docs/inline/.github/workflows/catalog-report.yml.md#1

on:
  schedule:
    # see docs/inline/.github/workflows/catalog-report.yml.md#2
    - cron: "0 16 12 * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: catalog-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Look for things that look wrong
        run: |
          python3 site/bin/catalog-report.py --out /tmp/report.md > /dev/null
          echo "count=$(python3 site/bin/catalog-report.py --count-only)" >> "$GITHUB_ENV"

      # see docs/inline/.github/workflows/catalog-report.yml.md#3
      - name: Put it in the run summary
        run: cat /tmp/report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Open, update, or close the issue
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "Catalog: records that look wrong"
        run: |
          set -euo pipefail

          existing=$(gh issue list --state open --search "$TITLE in:title" \
            --json number,title --jq "[.[] | select(.title == \"$TITLE\")][0].number // empty")

          if [ "$count" -eq 0 ]; then
            if [ -n "$existing" ]; then
              # see docs/inline/.github/workflows/catalog-report.yml.md#4
              gh issue comment "$existing" --body \
                "Everything previously listed here is now clean. Closing — it'll reopen if anything else turns up."
              gh issue close "$existing"
              echo "Closed #$existing; nothing left to report."
            else
              echo "Nothing to report, and no issue open. Silent."
            fi
            exit 0
          fi

          if [ -n "$existing" ]; then
            # see docs/inline/.github/workflows/catalog-report.yml.md#5
            gh issue edit "$existing" --body-file /tmp/report.md
            echo "Updated #$existing with $count finding(s)."
          else
            gh issue create --title "$TITLE" --body-file /tmp/report.md
            echo "Opened an issue with $count finding(s)."
          fi
