name: Sync Cablecast catalog and airings

# Weekly: refresh cablecast.json and airings.json, and rebuild even when unchanged so
# featured entries expire. See docs/programming.md.

on:
  schedule:
    - cron: "0 13 * * 1" # 07:00 America/Denver in summer, 06:00 in winter
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Fetch the catalog
        run: python3 site/bin/sync-cablecast.py

      # Same tick as the catalog: airings join on the show ids it just fetched.
      - name: Fetch the airing history
        run: python3 site/bin/sync-schedule.py

      - name: Commit if the catalog changed
        id: commit
        run: |
          if git diff --quiet -- site/_data/cablecast.json site/_data/airings.json; then
            echo "No catalog or schedule changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          before=$(git show HEAD:site/_data/cablecast.json | python3 -c 'import json,sys; print(json.load(sys.stdin)["total"])')
          after=$(python3 -c 'import json; print(json.load(open("site/_data/cablecast.json"))["total"])')

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          aired=$(python3 -c 'import json; print(json.load(open("site/_data/airings.json"))["totals"]["distinct"])')

          git add site/_data/cablecast.json site/_data/airings.json
          git commit -m "Sync Cablecast: ${before} to ${after} programs, ${aired} aired this year"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # A push above triggers deploy.yml by itself; this covers the no-change case.
      - name: Rebuild anyway so expired features drop off
        if: steps.commit.outputs.changed == 'false'
        run: gh workflow run deploy.yml --ref main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
