name: Sync Cablecast catalog

# Two jobs in one, both on the same weekly tick:
#
#   1. Refresh _data/cablecast.json from the station's Cablecast catalog, so
#      new programs appear in the archive without anyone doing anything.
#   2. Rebuild the site even when nothing changed, so date-windowed entries in
#      _data/featured.yml actually expire. A feature that ended on Tuesday
#      should not still be on the homepage on Friday just because nobody
#      pushed a commit.
#
# Monday morning, and on demand from the Actions tab.

on:
  schedule:
    - cron: "0 13 * * 1" # 07:00 America/Denver in summer, 06:00 in winter
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Fetch the catalog
        run: python3 script/sync-cablecast.py

      - name: Commit if the catalog changed
        id: commit
        run: |
          if git diff --quiet -- _data/cablecast.json; then
            echo "No catalog changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          before=$(git show HEAD:_data/cablecast.json | python3 -c 'import json,sys; print(json.load(sys.stdin)["total"])')
          after=$(python3 -c 'import json; print(json.load(open("_data/cablecast.json"))["total"])')

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/cablecast.json
          git commit -m "Sync Cablecast catalog: ${before} to ${after} programs"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # A push from the step above triggers deploy.yml on its own. This only
      # fires when nothing changed, so expiring features still get published.
      - name: Rebuild anyway so expired features drop off
        if: steps.commit.outputs.changed == 'false'
        run: gh workflow run deploy.yml --ref main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
