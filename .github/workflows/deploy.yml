name: Build and deploy
# Builds site/ on every push and pull request; deploys to Azure only if its token is set.
# See docs/site.md#deploy.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]
  # sync-cablecast.yml dispatches this so an expired featured item drops off.
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  build_and_deploy:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    name: Build and deploy
    # A job env, because secrets cannot be read directly in an `if:` expression.
    env:
      SWA_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - uses: ruby/setup-ruby@v1
        with:
          # A literal resolved inside working-directory; `site/.ruby-version` fails as "Unknown engine".
          ruby-version: .ruby-version
          bundler-cache: true
          working-directory: site

      - name: Build
        working-directory: site
        run: bundle exec jekyll build --trace
        env:
          JEKYLL_ENV: production

      - name: Deploy to Azure Static Web Apps
        if: env.SWA_TOKEN != ''
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: "site/_site"
          skip_app_build: true

      - name: Note skipped deploy
        if: env.SWA_TOKEN == ''
        run: |
          echo "### Deploy skipped" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "The site built successfully but was not deployed: the repository" >> "$GITHUB_STEP_SUMMARY"
          echo "secret \`AZURE_STATIC_WEB_APPS_API_TOKEN\` is not set." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Create the Static Web App in Azure, copy its deployment token," >> "$GITHUB_STEP_SUMMARY"
          echo "and add it under Settings, Secrets and variables, Actions." >> "$GITHUB_STEP_SUMMARY"

  close_pull_request:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close preview
    env:
      SWA_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
    steps:
      - name: Close the deploy preview
        if: env.SWA_TOKEN != ''
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: close
