name: Sync the nonprofit list

# see docs/inline/.github/workflows/sync-nonprofits.yml.md#1

on:
  schedule:
    # see docs/inline/.github/workflows/sync-nonprofits.yml.md#2
    - cron: "0 13 5 * *"
  workflow_dispatch:

  # see docs/inline/.github/workflows/sync-nonprofits.yml.md#3
  push:
    paths:
      - "site/bin/sync-nonprofits.py"
      - ".github/workflows/sync-nonprofits.yml"

permissions:
  contents: write

concurrency:
  group: sync-nonprofits
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # see docs/inline/.github/workflows/sync-nonprofits.yml.md#4
      - name: Read the IRS master file
        run: python3 site/bin/sync-nonprofits.py

      - name: Commit if anything changed
        run: |
          if git diff --quiet -- site/assets/nonprofits.json; then
            echo "No change."
            exit 0
          fi

          count=$(python3 -c 'import json; print(len(json.load(open("site/assets/nonprofits.json"))["orgs"]))')

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/assets/nonprofits.json
          git commit -m "Sync the nonprofit list: ${count} organizations"
          git push
