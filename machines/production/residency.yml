# What the production crew itself serves: a menu, not a startup script. See machines/README.md.

resident: production

serves:
  - service: remote-control
    for: "the root's Remote Control server and its one home session, so listed sessions keep their link through a restart; it wakes none"
    kind: listener
    start: "{home}/.local/bin/claude.exe remote-control"
    cwd: "{code}"
    alive: {process: "claude.exe.*\sremote-control(\s|$)"}
