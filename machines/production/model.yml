# model.yml: the studio's language model, an instrument: we get answers from it. model.ps1 (`fcpm
# model`) reads the keys it needs line by line. It listens on this bay's address in `network:` and
# admits only that network, whatever Windows calls it. A member on the guest network reaches it
# through a wizard's bottle, never directly (docs/kiosk.md, Replies).

version: 1
instrument: model
kind: api                 # OpenAI-shaped: /v1/models, /v1/chat/completions, /health
network: 10.209.1.0/24    # the switched network (Helm); not the building's 10.1.10.x, not Guest
port: 9931                # llama-server's own default; 11435 was runai's, gone with it
context: 32768

# The server: llama.cpp's own build, through the bay. CUDA 12.4: this driver (610.88) speaks 13.3,
# and a 13.4 build would refuse it. Both zips carry a GitHub build attestation from ggml-org/llama.cpp.
llama: b12047
llama-zip: llama-b12047-bin-win-cuda-12.4-x64.zip
llama-sha256: fed7cd0e67cec5206500cdf66a4de768f9c468657ae12be43a32fc1aa81e9d88
cudart-zip: cudart-llama-bin-win-cuda-12.4-x64.zip
cudart-sha256: 8c79a9b226de4b3cacfd1f83d24f962d0773be79f1e7b75c6af4ded7e32ae1d6

# The models: one file each in models/, pinned by its hash; the spread and why each is in it is
# models/README.md. One server answers for those picked (`fcpm model pick`), loading each when asked.
store: ""                 # where the model files go; empty: %LOCALAPPDATA%\editing-bay-1\model\models
loaded-at-once: 2         # at most this many models held at once; the one asked least lately leaves first
keep-free: 1024           # MiB of GPU memory left free when another model loads (whisper, OBS)

# Effort: a word of ours, never a field a person fills in. A shape names one (shapes/); here each word
# becomes the models' knobs, and a model without a knob ignores the word. A model that always thinks
# says so in its own file (thinking: effort), with what each word is to it. Considered must always end
# in an answer: the server ends the thinking at its budget and the answer follows; an empty answer is
# asked again at quick, and says so.
answer: 1024                        # tokens of answer, when no shape says
quick-thinking: 0                   # none: chat_template_kwargs enable_thinking false
considered-thinking: 1024           # thinking_budget_tokens; max_tokens is this plus the answer's
considered-nudge: " Time to answer." # reasoning_budget_message, said when the budget runs out
