# Production's post: the partition on this machine and the steps it does, for `fcpm post`.
# Doc: troves/post/README.md. A job also listed in `crews:` adds its own machines/<job>/post.yml steps.

crews: [production]          # digitization's post steps join when it has some
root: "E:/POST"              # the 1 TB LUN, iSCSI (fcpm drobo), shared as `enhance` (fcpm share): the tank
doors: "E:/DOORS"

steps:
  enhance:                   # Adobe Podcast, by hand: drag out, download back
    door: true
    lease: 7d

# Every sealed folder goes to digitization's landing when a run ends; the work stays on E:\POST.
# The key is this bay's own (ssh-keygen -t ed25519 -f ~/.ssh/fcpm-post -N ""), let in on digitization by
# `machines/digitization/post-receive authorize production KEY.pub`; until it exists nothing is sent.
deliver:
  to: user@digitization.local
  key: ~/.ssh/fcpm-post
  known_hosts: machines/digitization/known_hosts
