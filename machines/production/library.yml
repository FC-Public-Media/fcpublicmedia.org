# Where bay 1 keeps the library's holdings, for `fcpm library`. Labels are ../../library.yml's.
# A path is a filesystem address; any other store is a mapping (`store:`, and `needs: grant` when the
# address itself carries credentials). Nothing is written into a holding: its x-rays are kept in
# ~/code/library/retain (retain/production), never beside the files.
# Doc: docs/library.md.

holdings:
  attic: "D:/fcpm-audit"
  downloads: "~/Downloads"
  # Where it is meant to be (BAY1.md: E: is the LAN mount; post.yml, pools.yml, share.ps1 say E:), and
  # the label that proves it: a mismatch is told to a person, and nothing is x-rayed under the wrong name.
  enhance: {at: "E:/", label: "TO ENHANCE"}
  drive: "E:/My Drive"        # Google Drive for desktop, streamed; the letter is wherever it mounted
