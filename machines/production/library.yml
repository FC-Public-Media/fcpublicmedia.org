# Where bay 1 keeps the library's holdings, for `fcpm library`. Labels are ../../library.yml's.
# A path is a filesystem address; any other store is a mapping (`store:`, and `needs: grant` when the
# address itself carries credentials). Nothing is written into a holding: its x-rays are kept in
# ~/code/library/retain (retain/production), never beside the files.
# Doc: docs/library.md.

holdings:
  attic: "D:/fcpm-audit"
  downloads: "~/Downloads"
  # Where it is meant to be (code/AGENTS.md: E: is the LAN mount; post.yml, pools.yml, share.ps1 say E:), and
  # the label that proves it: a mismatch is told to a person, and nothing is x-rayed under the wrong name.
  enhance: {at: "E:/", label: "TO ENHANCE"}
  drive: {label: "Google Drive", in: "My Drive"}   # Google Drive for desktop, streamed: found on whatever letter it mounts
  # Kept in the barn, unplugged: found by its label on whatever letter it gets, and simply "not plugged
  # in" otherwise. RAID 6 with one drive down (troves/buffalo-drivestation): an x-ray reads only names,
  # so take one before any copy; the copy off it should be the one heavy read it gets.
  buffalo: {label: "RAID Backup"}
