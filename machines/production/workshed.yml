# Bay 1's sheds, for `fcpm workshed`, the Helm's /workshed/ and Places: each a name and a folder of
# <repo>@<branch> worktrees, wherever someone keeps them (relative to ~/code). As library.yml binds holdings.
# There is no workshed folder: only these. Doc: docs/workshed.md.

sheds:
  work: work        # sessions' worktrees, and anyone's who works there

# A shed for each origin branch, made here the first time someone asks to work in that branch (fcpm places,
# Fighter): origins/<branch>/<repo>@<branch>, at the branch's pins.
origins: origins
