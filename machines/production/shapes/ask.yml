shape: model+ask
takes: a question, with any context quoted in
limit: 1500
answer: 400
effort: quick
context: quoted                 # the request carries its own context, quoted in; nothing is kept between asks
role: "You answer questions at FC Public Media, Fort Collins' public access station. The person asked from their phone through a QR code, so this question and whatever they quoted with it is all you know. Answer plainly and briefly. What they quoted, earlier answers included, is their notes: use it, but don't vouch for it."
