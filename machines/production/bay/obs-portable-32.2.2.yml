payload: obs-portable
version: 32.2.2
replaces: nothing        # the first recorder on this host
vendor: OBS Project (github.com/obsproject/obs-studio), GPL-2.0
role: the recorder trove's OBS, beside and never in place of the OBS people operate
trove: recorder

received: 2026-09-25
source: https://github.com/obsproject/obs-studio/releases/download/32.2.2/OBS-Studio-32.2.2-Windows-x64.zip
size: 187851583

verified:
  sha256: 4d6e40e3ab155f56b30de517380566a206d74b63cdf5ad49aa596924768f97e1  # matches GitHub's published asset digest
  core: >
    obs64.exe, obs.dll, obs-frontend-api.dll, obs-websocket.dll and
    obs-ffmpeg.dll: Authenticode valid, signed OBS Project
  census: "all 86 executables and libraries in the zip: valid, OBS Project"
  # For comparison, the system OBS in Program Files (32.1.1, winget) carries 21
  # unsigned files and three signed by plugin authors. None of them came in
  # this zip. The gate is on the core; the rest is reported, not refused,
  # because a gate that rejects what Windows runs would refuse OBS itself.

staged: "%LOCALAPPDATA%\\editing-bay-1\\bay\\staged\\obs-portable-32.2.2"
portable: obs_portable_mode.txt, written at stage, beside bin\
install-to: "%LOCALAPPDATA%\\editing-bay-1\\troves\\recorder\\obs"
restart-tier: app
cover: none
grants: >
  one, not yet placed: a Windows Firewall rule blocking inbound for the
  installed obs64.exe. obs-websocket cannot be told to listen on loopback only,
  and the firewall does not filter loopback, so a block leaves it reachable from
  this host alone. Placed at the desk, by an administrator, before the websocket
  is enabled. `obs-portable.ps1 check` prints the command.

settings-carried: EnableAutoUpdates=false in the portable copy's global.ini,
  asserted at install, so the bay is the only way a new version arrives.

run-log: "%LOCALAPPDATA%\\editing-bay-1\\bay.ndjson (receive, verify, stage on 2026-09-25; verify, install, confirm on 2026-09-26)"

# staged -> installed | rolled-back | installed-outside, as it becomes known.
status: installed

# Installed 2026-09-26, after Autumn read this record (#144 merged), by the
# procedure: `verify` again first (the zip still matched), then `install` and
# `confirm`, each logged.
installed:
  at: "%LOCALAPPDATA%\\editing-bay-1\\troves\\recorder\\obs"
  obs64: 32.2.2
  # What obs.ps1 `start` compares before it runs anything: a copy the bay did
  # not install is not the staff copy, whatever it is called. Measured
  # 2026-09-26, identical to the staged copy the bay verified.
  obs64-sha256: e79066670cd8e8b95662f4cd417c4fa6f5b0c77e856a7b41c7de0e00059ba6f2
  obs64-signer: "Valid, OBS Project, LLC"
  portable: "true, in OBS's own log: Portable mode: true"
  updates: EnableAutoUpdates=false in its config\obs-studio\global.ini
  rollback-copy: none, because there was no previous copy. The next arrival cellars this one.

confirmed:
  ran: yes, and wrote its settings only under its own config\ folder
  theirs-untouched: "yes: %APPDATA%\\obs-studio listed the same before and after (names, sizes, times)"
  crashes: none
  nvenc: "13.0 on the RTX 4080: H.264, HEVC and AV1 encoders loaded"
  # NOT A PROGRAM UPDATE, written down so it is not mistaken for one. On
  # start, OBS fetched two data files: rtmp-services' services.json (the list
  # of streaming services) and whatsnew.json. EnableAutoUpdates governs its
  # binaries, not these. Neither changes what runs.
  network-at-start: services.json (rtmp-services v293) and whatsnew.json

# Still one, still not placed: the inbound block rule. It is not needed until
# the websocket is enabled; `obs-portable.ps1 check` prints the command.
grant-pending: inbound block for the installed obs64.exe
