# vendor.yml -- the page's libraries, the files a CDN serves for them, kept in page/vendor/ byte for
# byte so the page loads them as if from the web, with or without the internet. The page's import map
# names them; nothing is built. `python3 vendor` fetches any that are missing and checks every sum;
# after changing a version here, `python3 vendor update` fetches it again and writes the new sum.

