# nginx.conf -- ch97.fcpublicmedia.local, the broadcast job's page, as `install` puts it:
# /etc/nginx/sites-available/fcpm-ch97, enabled beside the static job's server. The page and the laid
# days are files (`publish` puts them in /var/lib/fcpm/ch97). /api/ is the Cablecast box's API, for
# reading only: nginx asks the box by its address and its own name (@NAME@ at @ADDRESS@, from
# ../cablecast.py), so the page works from inside the building whether or not that name does, and
# any method but GET is turned away here. /floor/ and /air are standby's (../standby): the floor, and who has
# the air. /slides/ is the bulletin board's slides, for the standby page (page/standby/). See ../PROFILE.md.

server {
    listen 80;
    listen [::]:80;
    server_name ch97.fcpublicmedia.local;

    root /var/lib/fcpm/ch97/page;
    absolute_redirect off;
    add_header Cache-Control no-cache;
    include /etc/nginx/mime.types;
    charset utf-8;
    charset_types text/css text/javascript application/javascript application/json;
    gzip on;
    gzip_types text/css text/javascript application/javascript application/json;

    location / {
        try_files $uri $uri/ =404;
    }

    location /schedule/ {                       # the days we laid; the folder lists itself
        root /var/lib/fcpm/ch97;
        autoindex on;
        autoindex_format json;
    }

    location /floor/ {                          # standby's floor, HLS in memory, to lay under a stream
        alias /dev/shm/fcpm-floor/;
        types { application/vnd.apple.mpegurl m3u8; video/mp2t ts; }
        add_header Cache-Control no-cache;
        add_header Access-Control-Allow-Origin *;
    }

    location = /floor/now.json {                # what the floor's jukebox is playing, from standby
        proxy_pass http://127.0.0.1:8482/now.json;
    }

    location = /floor/jukebox {                 # the jukebox list's buttons: skip, stop, play (../standby)
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:8482/jukebox;
        proxy_set_header Host $host;
        client_max_body_size 1k;
    }

    location = /air {                           # who has the air: claims, to standby (../standby)
        limit_except GET POST { deny all; }
        proxy_pass http://127.0.0.1:8482/air;
        client_max_body_size 1k;
    }

    location /slides/ {                         # the bulletin board's slides, as the repository has them
        root /var/lib/fcpm/ch97;
    }

    location /api/ {
        limit_except GET { deny all; }
        proxy_pass https://@ADDRESS@/CablecastAPI/v1/;
        proxy_set_header Host @NAME@;
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_ssl_server_name on;
        proxy_ssl_name @NAME@;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_ssl_verify_depth 3;
        proxy_read_timeout 120s;
    }
}
