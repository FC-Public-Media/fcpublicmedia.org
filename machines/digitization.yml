# What the digitization job itself serves, when it orders it (digitization/services). See README.md.

serves:
  - service: follow
    for: "this checkout follows origin.local's main, fast-forward only, troves and the Wix copy from there too; see digitization/PROFILE.md"
    start: "/bin/sh machines/digitization/follow"

  - service: names
    for: "this machine's names under fcpublicmedia.local (lan.yml: helm, the site, its directory and gear), by mDNS, while this runs"
    start: "/usr/bin/python3 -I machines/lan.py publish"

  - service: model-relay
    for: "bay 1's model (production's llama-server, 10.209.1.20:9931) on this machine's tailnet address, for tag:operator devices only, each asked of tailscale whois; see digitization/PROFILE.md"
    start: "/bin/sh machines/digitization/model-relay"

  - service: asks
    for: "the questions people showed us (wizard:model+ask), answered by bay 1's model one at a time, each labeled and kept under its nonce for the public loop; see digitization/PROFILE.md"
    start: "/usr/bin/python3 machines/digitization/asks"

  - service: senders
    for: "who may deliver finished post work to the landing: authorized_keys's marked lines kept to post-senders.yml"
    start: "/usr/bin/python3 machines/digitization/post-receive senders"

  - service: drain
    for: "the site-worker's tanks (every form reply on the site) brought here into ~/fcpm/answers and emptied behind; see digitization/PROFILE.md#replies"
    start: "/bin/sh machines/digitization/drain"
