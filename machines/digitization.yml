# What the digitization job itself serves, when it orders it (digitization/services). See README.md.

serves:
  - service: follow
    for: "this checkout follows origin.local's main the moment it moves there (the origin's `hear main`; five minutes at most), fast-forward only, troves and the Wix copy from there too, then the static job's sites; see digitization/PROFILE.md"
    start: "/bin/sh machines/digitization/follow heed"
    alive: {process: "machines/digitization/follow heed"}

  - service: refresh
    for: "the site's data from where it lives (Cablecast's catalog and schedule, the IRS nonprofit list), committed to origin.local's main once a week, so main, the LAN's site and a deploy all have it (../docs/programming.md, Sync jobs)"
    start: "/bin/sh machines/digitization/refresh"

  - service: names
    for: "this machine's names under fcpublicmedia.local (lan.yml: helm, the site, its directory and gear), by mDNS, while this runs"
    start: "/usr/bin/python3 -I machines/lan.py publish"

  - service: model-relay
    for: "bay 1's model (production's llama-server, 10.209.1.20:9931) on this machine's tailnet address, for tag:operator devices only, each asked of tailscale whois; see digitization/PROFILE.md"
    start: "/bin/sh machines/digitization/model-relay"

  - service: asks
    for: "the questions people showed us (wizard:model+ask), answered by bay 1's model one at a time, each labeled and kept under its nonce for the public loop; see digitization/PROFILE.md"
    start: "/usr/bin/python3 machines/digitization/asks"

  - service: seats
    for: "advocate seats called in by hand (wizard:seat+run): granted, admitted, run by the advocate engine on their own branch here, their finished reply in the public loop; see digitization/PROFILE.md#seats"
    start: "/usr/bin/python3 machines/digitization/seats"

  - service: shed
    for: "the library shed's worktrees (~/code/workshed/library) kept up to their origin branches, fast-forward only, never with changes; what /library/ searches (../docs/workshed.md, Search)"
    start: "/usr/bin/python3 machines/workshed.py follow library"

  - service: city
    for: "the city's shapes (parks, natural areas, Transfort's routes and stops) and its open-data catalog, written into the library shed's library branch once a day and pushed to origin.local; a source unchanged costs the city a 304 (../docs/library.md, The city)"
    start: "/usr/bin/python3 machines/digitization/city-shapes.py {code}/workshed/library/fcpublicmedia.org@library --commit --catalog"

  - service: layers
    for: "readers on top of the city's things, each its own .scopes: council and state districts, trails, and what OpenStreetMap maps inside each park (../docs/library.md, The city)"
    start: "/usr/bin/python3 machines/digitization/city-layers.py {code}/workshed/library/fcpublicmedia.org@library --commit"

  - service: senders
    for: "who may deliver finished post work to the landing: authorized_keys's marked lines kept to post-senders.yml"
    start: "/usr/bin/python3 machines/digitization/post-receive senders"

  - service: drain
    for: "the site-worker's tanks (every form reply on the site) brought here into ~/fcpm/answers and emptied behind; see digitization/PROFILE.md#replies"
    start: "/usr/bin/python3 machines/drain"

  - service: flush
    for: "every key this machine holds handed up to FCPM's keychain (machines/keychain), every 15 minutes; it keeps the same value once"
    start: "/usr/bin/python3 machines/keys flush"

  - service: tell
    for: "this machine's tell: one pass over its own lines, reading every pile to it whose shape names something, then serving its copy at lines.digitization.fcpublicmedia.local; the lines are its to carry, not the origin's (../docs/lines.md)"
    start: "/usr/bin/python3 machines/lines run"

  - service: loudspeaker
    for: "every signal this machine hears (UDP 9797 from the LAN, digitization/loudspeaker.yml's taps), one stream on TCP 9798 and one log; see README.md, The loudspeaker"
    start: "/usr/bin/python3 -I machines/loudspeaker serve"
    alive: {port: 9798}
