# What the digitization job itself serves, when it orders it (digitization/services). See README.md.

serves:
  - service: intake
    for: "GitHub's main into the origin at /srv/origin; see digitization/PROFILE.md, The origin"
    start: "/usr/bin/python3 -I machines/digitization/origin-intake"

  - service: standby
    for: "every branch and tag into origin.local, a minute behind; see origin/PROFILE.md"
    start: "/bin/sh machines/digitization/origin-standby"

  - service: follow
    for: "this checkout follows the origin's main, fast-forward only; see digitization/PROFILE.md"
    start: "/bin/sh machines/digitization/follow"

  - service: site
    for: "the public site, built from this checkout when its commit moves, for the LAN as fcpublicmedia.local and www; see digitization/PROFILE.md"
    start: "/bin/sh machines/digitization/site-build"

  - service: names
    for: "this machine's names under fcpublicmedia.local (lan.yml: helm, the site, its directory and gear), by mDNS, while this runs"
    start: "/usr/bin/python3 -I machines/lan.py publish"
