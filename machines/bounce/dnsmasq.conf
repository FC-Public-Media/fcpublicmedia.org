# The island's DHCP and DNS: every name is the box, and option 114 points phones at the captive API.
interface=wlan0
bind-dynamic
no-resolv
no-hosts
address=/#/10.97.97.1
dhcp-range=10.97.97.10,10.97.97.250,255.255.255.0,1h
dhcp-option=option:router,10.97.97.1
dhcp-option=option:dns-server,10.97.97.1
dhcp-option=114,"http://10.97.97.1/captive"
dhcp-authoritative
dhcp-leasefile=/run/fcpm-bounce/leases
