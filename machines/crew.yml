# crew.yml: who an FCPM machine can start, and how. A roster, not a startup script.
# The default; a profile's own replaces it whole. See docs/station.md, Crew and gear.
#
# No supervisor, pool or way to list sessions from outside is declared for this provider.

version: 1
platform: windows

providers:
  - provider: claude
    binding: claude-code
    for: >
      Claude Code, run at the console by whoever is sitting there. The gear
      entry for the install itself is in `gear.yml`; this is the fact that it
      is how work gets done on this machine at all.

    # Asked, never remembered: a pid or session id written at start is wrong after a crash.
    muster: "claude          # at the console, in the directory you mean"
    stand-down: "exit, or close the window"
    on-duty: "unanswerable from outside the session. See the note above."

    # Claude titles a session from its first message.
    names: derived

    # `cwd`: wherever the person was standing.
    lands: cwd

# A second provider supplies: start and stop rooted at a directory; a way to list what it runs from
# outside, or a statement that there is none; a session identity to reattach to, or that a fall is a death.
