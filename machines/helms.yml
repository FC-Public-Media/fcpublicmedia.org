# helms.yml: every helm, by the job it serves, where it answers on the switched network, and the
# wizards only that job's helm can apply. Helms are peers: a reply set down at any of them is applied
# there, or passed as it came to the helm that holds its wizard (replies.py, route). Nothing else
# commands one machine from another. docs/kiosk.md, Helms.
helms:
  digitization:
    at: http://digitization.local
    holds: [wizard:site+deploy]
  production:
    at: http://10.209.1.20:8080
    holds: [wizard:model+up]
  # Bay 2's models, the same wizard: only a reply naming `job: editing-bay-2` comes here (replies.py,
  # holder). It has no address on the switched network yet, so such a reply waits until `at:` is filled.
  editing-bay-2:
    at: ""
    holds: [wizard:model+up]
