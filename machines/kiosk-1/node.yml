# see docs/inline/machines/kiosk-1/node.yml.md#1

# see docs/inline/machines/kiosk-1/node.yml.md#2
browser: msedge
screens:
  - name: centre
    display: DISPLAY1        # the primary panel
    rect: [0, 0, 1050, 1680]
    url: /kiosk/
  - name: left
    display: DISPLAY2
    rect: [-1050, 0, 1050, 1680]
    url: /turn/            # turns like the roller: the cameras, then the files (2026-10-05). Was /preview/

# see docs/inline/machines/kiosk-1/node.yml.md#3
networks:
  - from: wifi               # site/_data/wifi.yml: ssid, security, confirmed
    label: Guest Wi-Fi
  # see docs/inline/machines/kiosk-1/node.yml.md#4

# see docs/inline/machines/kiosk-1/node.yml.md#5
facilities: [Video Studio, Podcast Studio, Editing Bays]

# Stations the public site does not list yet.
stations:
  - name: Digitization
    note: Opening soon
    activities: [digitization]
    # see docs/inline/machines/kiosk-1/node.yml.md#6
    preparing: true

# see docs/inline/machines/kiosk-1/node.yml.md#7
bookings: sample

# see docs/inline/machines/kiosk-1/node.yml.md#8

# see docs/inline/machines/kiosk-1/node.yml.md#9
m365:
  tenant: c2df68bb-b157-4f21-9a16-f574eb44ed6d
  client: 6a3863ca-5544-4ffc-9d1f-71311cfb1bfe
  certificate: 2280B1B905911D8C93C643EF292D86BD2F882C31   # expires 2028-09-24

# see docs/inline/machines/kiosk-1/node.yml.md#10
dropbox:
  app_key: ""                # from the App Console, once the app exists
  to: ""                     # the folder staff already use (Autumn, 2026-09-29): which one, to be named
  share: TO DROPBOX

# see docs/inline/machines/kiosk-1/node.yml.md#11
helo:
  host: aja-helo-1HE001404.local

depot:
  server: 10.209.1.1
  groups:
    - name: stations
      title: Stations
      rows:
        - files: false
          shares:
            - {share: BAY 1, label: Bay 1}
            - {share: BAY2, label: Bay 2}
        - shares:
            - {share: DIGISTATION, label: Digitization}
            - {share: FILMING, label: Filming}
            - {share: PODCAST, label: Podcast}
    - name: queues
      title: Queues
      match: "TO "
      rows:
        - shares:
            - {share: TO DROPBOX, label: To Dropbox}
            - {share: TO ENHANCE, label: To Enhance}
            - {share: TO STEM, label: To Stem}

# see docs/inline/machines/kiosk-1/node.yml.md#12
turn:
  rotate: 45                 # seconds on each, as on the wall
  modules:
    - {name: cameras, label: Cameras, url: /preview/}
    - {name: files, label: Files, url: /depot/}
    - {name: ti-89, label: TI-89, url: '/ti-89/?show&wake&rom=/ti-89/local/rom'}   # Autumn's AMS running our program, the show, fed over its link cable (ti89: below); '/ti-89/?show' alone is the bare machine, no OS

# see docs/inline/machines/kiosk-1/node.yml.md#13
ti89:
  code: '%USERPROFILE%\code\ref\ti-89'
  rom: '%LOCALAPPDATA%\media-node\troves\ti-89\ti89-ams203-hw1.rom'
# see docs/inline/machines/kiosk-1/node.yml.md#14
wall:
  share: DIGISTATION         # the partition is the depot's; .wall is this node's
  folder: .wall
  every: 60                  # seconds: how often it is rewritten; the shell reloads every tenth
  rotate: 45                 # seconds on each module before the next (show.yml's guess)
  class: instruments/roller-tv/class-sample   # class mode's demo, written as class.html; not in the turn
  modules:
    - {name: studio, label: Studio, page: kiosk}
    - {name: files, label: Files, page: drive}      # the wall's own Files: a list, like Classes
    - {name: classes, label: Classes, page: classes}

# see docs/inline/machines/kiosk-1/node.yml.md#15
wording:
  checkin:
    head: Check in
    sub: |-                  # our name, large, where people look; "Fort Collins" together
      Fort Collins
      Public Media
  camera:                    # over the check-in words while the camera is armed (door.py, THE CAMERA). Placeholder words
    head: Show your code
    sub: "The camera is on: {s} s"   # {s} is the seconds left
    arm: Show a code                  # the button that arms it: the panel takes touch
  wall:                      # the roller: the check-in head stays, the words are its own
    sub: |-                  # one line each, title case, as Autumn wrote it (2026-09-26)
      Don’t Just View It.
      Do It.
    brand: FCPM              # the bar's label; the lit button says which module is up
  map:
    until: until
  classes:                   # the upcoming list, and the takeover while a class is soon or on
    head: Classes
    soon: Starting soon
    now: Happening now
    starts: Starts
    until: Until
    join: Join until
    next: Next class
    none: No classes on the calendar yet.
    sample: Sample classes
    hint_wall: Check in with the code above.   # while joining late, on the wall
  depot:
    gateway: Gateway         # the strip on top: the router's address, and its partition count
    head: Files
    sub: On the studio drive
  footer:
    # see docs/inline/machines/kiosk-1/node.yml.md#16
    "on": "Hosting:"
    next: Next
    none: Ask whoever is at the desk.
