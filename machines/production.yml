# What the production job itself serves, when it orders it (production/services). See README.md.

serves:
  - service: follow
    for: "this bay's orders, by commit: main as the dev switch paces it (each pass on, weekly off), fast-forward only, then what the profile maps put on, every 15 minutes too; the crew restarts its lines when troves move (follow). Every bay's, so they take orders alike"
    start: '"C:/Program Files/Git/bin/bash.exe" machines/follow'

  - service: helm
    for: "this bay's helm: the intake for replies only its helm applies (helms.yml: wizard:model+up) and the board's pages, on 8080 for the switched network; not the media node's door, so no depot, wall or camera"
    start: "{python} machines/kiosk/door.py serve"
    env: {FCPM_DOOR_WATCH: "commit,replies,consoles"}

  - service: remote-control
    for: "the root's Remote Control server and its one home session, so listed sessions keep their link through a restart; it wakes none"
    start: "{home}/.local/bin/claude.exe remote-control"
    cwd: "{code}"
    alive: {process: 'claude.exe.*\sremote-control(\s|$)'}

  - service: drain
    for: "the site-worker's tanks (every form reply on the site) brought into ~/fcpm/answers on this bay and emptied behind, with this bay's own key; held by one machine at a time (../drain)"
    start: "{python} machines/drain"
