# What the static job serves, when it orders it (static/services). See README.md.

serves:
  - service: site
    for: "the public site, built from this checkout when its commit moves; static/sites.yml's `site`"
    start: "/bin/sh machines/static/site-build"

  - service: serve
    for: "every site in static/sites.yml, under the LAN names lan.yml gives it; the door forwards those names here"
    start: "/usr/bin/python3 -I machines/static/serve.py"
    alive: {port: 8480}
