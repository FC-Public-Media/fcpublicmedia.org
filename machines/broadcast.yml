# What the broadcast job serves, when it orders it (broadcast/services). See README.md.

serves:
  - service: ingest
    for: "where the Live 350 sends channel 97: an RTMP door on :1935 (nginx's RTMP module, its own instance), publish from the 350 only, read from this box only; see broadcast/PROFILE.md, To YouTube"
    start: "/usr/bin/python3 -I machines/broadcast/ingest"
    alive: {port: 1935}
  - service: youtube
    for: "channel 97 to YouTube's primary ingest: the ingest's stream copied by RTMPS with our key, once it is seen arriving; see broadcast/PROFILE.md, To YouTube"
    start: "/usr/bin/python3 -I machines/broadcast/relay"
    alive: {process: 'machines/broadcast/relay(\s|$)'}
    needs: [ingest]
  - service: backup
    for: "the floor: our own steady picture (the brand's slate and the room's clock) on the LAN and on YouTube's backup ingest, stepping off YouTube while a machine on top has the air; see broadcast/PROFILE.md, To YouTube"
    start: "/usr/bin/python3 -I machines/broadcast/standby"
    alive: {process: 'machines/broadcast/standby(\s|$)'}
  - service: jukebox
    for: "a folder of music FCPM owns (/srv/landing/jukebox), played by name and round again into standby's bus, so the backup stream isn't silent; see broadcast/PROFILE.md, To YouTube"
    start: "/usr/bin/python3 -I machines/broadcast/jukebox"
    alive: {process: 'machines/broadcast/jukebox(\s|$)'}
  - service: ch97
    for: "ch97.fcpublicmedia.local: the page and the days laid in the broadcast repository, published where nginx serves them; see broadcast/PROFILE.md, ch97"
    start: "sh machines/broadcast/ch97/publish"
  - service: lay
    for: "each night, the channel's days Cablecast has and the broadcast repository doesn't yet, laid down there, committed and pushed to our origin; see broadcast/PROFILE.md, ch97"
    start: "sh machines/broadcast/lay"
