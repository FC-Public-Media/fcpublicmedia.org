# fcpm.yml: each fcpm verb, once, for every platform. fcpm reads it before it runs a verb, `fcpm help` prints it,
# and the board (machines/kiosk/door.py) shows it. `windows:` and `linux:` (the Pi too) name what does the verb
# there; "not: ..." says it cannot yet and what stands in, and fcpm says that and exits 3.
# `board: switch` puts a control on the board: shown to all, flipped from that computer only.

verbs:
  - verb: watch
    args: ""
    says: "the watcher: what is going on here, and a short menu (fcpm alone)"
    windows: machines/watch
    linux: machines/watch

  - verb: status
    args: ""
    says: "which profile, and what differs from what it carries"
    windows: machines/sync
    linux: machines/sync

  - verb: card
    args: "[sync [/dev/sdX]]"
    says: "the cards plugged in here and how far each is behind; sync brings one current: partitions and images, its checkout, its kit, its origin (machines/cards/sync)"
    windows: "not: cards are made and kept on Linux (machines/cards)"
    linux: machines/cards/sync
  - verb: provision
    args: "[JOB [DISK]]"
    says: "at a box booted from a card: the jobs the card can put on a disk, this box's disks with serials; then JOB onto DISK, its serial typed back first (machines/cards/provision)"
    windows: "not: a card's Alpine does this, at the box being set up"
    linux: machines/cards/provision
  - verb: install
    args: "[JOB]"
    says: "this machine as its profile says: the latest brought in, then put on (its files, engines and system steps). A person runs this"
    windows: "bin/refs, machines/sync install, the engines, machines/watch copy, the weekly task"
    linux: "bin/refs where ~/code/refs holds the mirror (elsewhere the crew's follow line keeps the checkout), machines/sync install, the engines"

  - verb: pull
    args: ""
    says: "part of install now"
    windows: "not: fcpm install brings in the latest and puts it on"
    linux: "not: fcpm install brings in the latest and puts it on"

  - verb: check
    args: ""
    says: "what files cannot say: gear, settings, services"
    windows: "machines/<profile>/check.ps1"
    linux: "machines/<profile>/check.sh"

  - verb: weekly
    args: ""
    says: "bring in the latest, once a week (the task runs it)"
    windows: "machines/watch weekly: the pool's pass where the profile holds it, else the 'fcpm weekly' task"
    linux: "not: no weekly task; origin.local's intake asks GitHub weekly by itself (fcpm dev)"

  - verb: deploy
    args: "[--build]"
    says: "fcpublicmedia.org onto Cloudflare Pages: refresh, build, check, upload (--build uploads nothing)"
    windows: bin/deploy-site
    linux: bin/deploy-site

  - verb: deploy
    args: "SITE DIR [HOST]"
    says: "a finished site onto the static host (static.local): only what changed crosses"
    windows: "not: no key for the static host yet"
    linux: machines/static/deploy

  - verb: keys
    args: "[check|take GROUP KEY|offer GROUP DEVICE|run GROUP... -- CMD|birth]"
    says: "the keychain of the jobs this machine wears: what is held and wanted, never a value"
    windows: machines/keys
    linux: machines/keys

  - verb: lines
    args: "[reader|hear WRITER CHANNEL...|tell READER CHANNEL FILE...|read WRITER]"
    says: "this machine's lines on the LAN: data piles told and read through the origin (docs/lines.md)"
    windows: "not: Git Bash with age.exe and jq.exe, not tried yet"
    linux: machines/lines

  - verb: keep
    args: ""
    says: "the branches the origin keeps current with main (machines/origin/KEPT), as its last beat left them"
    windows: "origin.local's door (`kept`)"
    linux: "origin.local's door (`kept`)"

  - verb: relay
    args: "[status|on|off]"
    says: "the origin's mode: on, what is pushed there goes out to GitHub every ten minutes on the clock; off, LAN-only"
    windows: "not: no key for the origin yet"
    linux: "origin.local's switch (`ssh git@origin.local relay on`)"

  - verb: dev
    args: "[status|on|off]"
    says: "on: GitHub is asked every ten minutes on the clock; off: weekly"
    board: switch
    windows: "the flag %LOCALAPPDATA%\\fcpm\\dev; the pool and the door read it"
    linux: "origin.local's switch (`ssh git@origin.local dev on`), which paces its intake; the flag ~/.local/state/fcpm/dev beside it for the door"

  - verb: pool
    args: "[status|pass|off|on|check|install]"
    says: "the root's Remote Control server, and the task that keeps it (held by the profile's MANIFEST: fcpm install registers it)"
    windows: "machines/pool.ps1, where the profile's MANIFEST holds it"
    linux: "not: the pool is editing bay 1's"

  - verb: crew
    args: "[status|install|uninstall|check|log NAME|restart [LINE...]|serve]"
    says: "this machine's crew: its one service and what it keeps; restart has it read its order again and restart its lines"
    windows: "machines/crew.ps1; crew.py by uv"
    linux: "machines/crew.sh (fcpm-crew@<job>); crew.py by python3"

  - verb: refs
    args: "[status|pull [REPO...]|work REPO BRANCH|done REPO BRANCH]"
    says: "the read-only mirrors in ~/code/refs (the kiosk's ref/): how far each is behind, or each brought up; a worktree per branch in ~/code/work, and removed once merged"
    windows: bin/refs
    linux: bin/refs

  - verb: runnables
    args: "[...]"
    says: "the census, compile, prove"
    windows: bin/runnables
    linux: bin/runnables

  - verb: recorder
    args: "[status|prepare|start|record start|record stop|stop|grant]"
    says: "OBS, the recorder"
    windows: troves/recorder/obs.ps1
    linux: "not: Windows gear (OBS on the bays)"

  - verb: env
    args: "[list|status|start NAME|stop NAME|secret TARGET]"
    says: "OBS environments, beside the recorder (air: YouTube's primary; secret fcpm-youtube-key stores its key)"
    windows: troves/recorder/env.ps1
    linux: "not: Windows gear (OBS on the bays)"

  - verb: roku
    args: "[find|status|play|home|obs|off|grant]"
    says: "the Roku: its channel, and OBS relayed onto it (grant is an administrator's)"
    windows: troves/roku/roku.ps1
    linux: "not: the relay is the bay's (troves/roku)"

  - verb: screen
    args: "[status|on|off|reset|class|wall|toggle]"
    says: "the rolling TV (toggle: class mode <-> the wall)"
    windows: troves/kiosk-screen/screen.ps1
    linux: "not: Windows gear (the kiosk drives the TV)"

  - verb: audition
    args: "[status|install|remove]"
    says: "Audition as gear: the enhance engine's panel"
    windows: "machines/<profile>/audition.ps1"
    linux: "not: Windows gear (Adobe Audition)"

  - verb: drobo
    args: "[status|connect|header|list OUT]"
    says: "the Drobo, over iSCSI (CHAP)"
    windows: "machines/<profile>/drobo.ps1"
    linux: "not: Windows gear (the iSCSI initiator)"

  - verb: share
    args: "[status|install]"
    says: "the drop shares: enhance (E:, TO ENHANCE)"
    windows: "machines/<profile>/share.ps1"
    linux: "not: Windows gear (SMB shares on the bays)"

  - verb: audit
    args: "[status|on|off|collect [OUT]|window FROM TO [OUT]]"
    says: "a record, kept here, of the commands run on this machine"
    windows: "machines/<profile>/audit.ps1"
    linux: "not: no record kept here yet; the journal holds sudo's"

  - verb: model
    args: "[status|models|pick [NAMES]|install [NAME]|grant|on|off|shapes|contexts|ask TEXT [-Model NAME] [-Shape NAME] [-Effort quick|considered] [-Name NAME] [-From KEY]]"
    says: "the language models, for the switched network only: pick says which are up (grant is an administrator's)"
    windows: "machines/<profile>/model.ps1"
    linux: "not: Windows gear (the bay's GPU)"

  - verb: helm
    args: "[status|grant]"
    says: "this bay's helm, which takes what a peer helm passes it (grant is an administrator's)"
    windows: "machines/<profile>/helm.ps1"
    linux: "not: digitization's helm is its door, at login (at-login)"

  - verb: camera
    args: "[console|presets|apply NAME|state]"
    says: "the USB camera"
    windows: "troves/camera/camera.py by uv (comtypes)"
    linux: "not: it speaks Windows COM"

  - verb: ti89
    args: "[probe|version|screen OUT.png|rom OUT.rom] [--port COM1]"
    says: "a TI-89 on a GraphLink"
    windows: "troves/ti-89/cable/link.py by uv"
    linux: "troves/ti-89/cable/link.py by uv"

  - verb: pools
    args: "[timeline|key|sample|sample clear]"
    says: "the storage pools, as a page"
    windows: "troves/pools/pools.py by uv"
    linux: "troves/pools/pools.py by uv"

  - verb: workshed
    args: "[new BRANCH [--shed SHED] [--repo REPO|OWNER/REPO] [--from REV]|start NAME|stop NAME|serve NAME|check [NAME]|log [NAME]|remove NAME|follow [SHED]|search WHERE [WORDS]|wheres]"
    says: "worktrees someone works in (~/code/workshed), each site built whole and served on its own port, and a shed searched by words; the Helm's /workshed/ and /library/"
    windows: "machines/workshed.py by uv"
    linux: "machines/workshed.py by uv (it needs a Node and jekyll-enough: fcpm workshed check)"

  - verb: consoles
    args: "[NAME|beat]"
    says: "what this machine holds up to read, a screen each, written whole on its beat (~/code/consoles); the Helm's /consoles"
    windows: "machines/consoles.py by uv"
    linux: "machines/consoles.py by uv"

  - verb: places
    args: "[BRANCH]"
    says: "an origin branch's repositories, a row each: its worktree, its mirror, or offered (Fighter's location providers read it); the Helm's /places"
    windows: "machines/places.py by uv"
    linux: "machines/places.py by uv"

  - verb: issues
    args: "[PATH|story WORDS]"
    says: "a repository's issues in one look: its .issues file, a line each, and every commit that touched each line"
    windows: "machines/issues.py by uv"
    linux: "machines/issues.py by uv"

  - verb: library
    args: "[status|where|xray|diff|summary|log|browse LABEL ...|grant SEAT UNIT WORDS|release GRANT|grants|console|inbox [round|answer]|outbox [make]|signer [mint]]"
    says: "the library here (~/code/library): its holdings and their shapes (never contents), who is at work, and its console"
    windows: "machines/library.py by uv"
    linux: "machines/library.py by uv"

  - verb: post
    args: "[status|run [STEP]|admit CONFIG|retry TAKE N]"
    says: "after release: the takes and their steps, as a page"
    windows: "troves/post/post.py by uv"
    linux: "troves/post/post.py by uv"

  - verb: hear
    args: "[HOST]"
    says: "the loudspeaker: every signal this machine hears, live (README.md, The loudspeaker)"
    windows: "not: no loudspeaker on Windows yet; `fcpm hear digitization.local` there needs Python, so use curl.exe -N http://digitization.local:9798/"
    linux: machines/loudspeaker

  - verb: say
    args: "WHO WHAT..."
    says: "put one line on the loudspeaker (FCPM_LOUDSPEAKER=host for another machine's)"
    windows: "not: use a UDP datagram to port 9797 (README.md, The loudspeaker)"
    linux: machines/loudspeaker

  - verb: help
    args: ""
    says: "this, from machines/fcpm.yml"
    windows: machines/fcpm
    linux: machines/fcpm
