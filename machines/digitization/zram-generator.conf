# zram-generator.conf -- /etc/systemd/zram-generator.conf on digitization: swap in compressed RAM.
# With no swap at all, a box short of memory evicts the programs' own code and reads it back from the
# SD card again and again: everything stops, the kernel's OOM killer never fires, SSH answers the
# connection and nothing more (2026-10-17, 01:38, until the power button). Swap gives the pressure
# somewhere to go; earlyoom (earlyoom.default) ends it. See PROFILE.md, Memory.
[zram0]
zram-size = ram / 2
compression-algorithm = zstd
