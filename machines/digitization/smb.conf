# smb.conf -- digitization shares the landing to the LAN and the tailnet, nothing else. Installed by ./landing.
[global]
   server string = FCPM Digitization
   server role = standalone server
   # Samba skips tailscale0 (a /32) when bound by interface, so it listens everywhere and admits by address.
   hosts allow = 127.0.0.1 ::1 10.209.1.0/24 100.64.0.0/10 fd7a:115c:a1e0::/48
   hosts deny = ALL
   map to guest = never
   load printers = no
   printing = bsd
   printcap name = /dev/null
   disable spoolss = yes
   server min protocol = SMB2_10
   vfs objects = catia fruit streams_xattr
   fruit:metadata = stream
   fruit:model = MacSamba
   fruit:posix_rename = yes
   fruit:veto_appledouble = no
   fruit:nfs_aces = no
   fruit:wipe_intentionally_left_blank_rfork = yes
   fruit:delete_empty_adfiles = yes

[landing]
   path = /srv/landing
   valid users = fcpm
   read only = no
   force user = fcpm
   create mask = 0664
   directory mask = 0775
