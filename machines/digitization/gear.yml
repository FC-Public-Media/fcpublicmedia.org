# gear.yml: what the digitization job stands on, on Debian. Replaces ../gear.yml (Windows) whole.
# `package:` is an apt name. Presence is never written: check.sh asks dpkg. On the live boot, apt's
# installs live in the card's persistence file, and every .deb apt fetches is kept on the card's
# toolbox partition (/srv/toolbox/pkgs), so a fresh persistence can put them back without a network.

version: 1
platform: linux

gear:
  - gear: python3-yaml
    for: >
      The crew's supervisor (machines/crew.py) reads the order's menus with it.
      `crew.sh install` puts it on when it is missing.
    package: python3-yaml
    provisioner: apt
    updates: apt
    restart-tier: app
    holds: "nothing of its own"

  - gear: git
    for: >
      The origin's bare repositories and every checkout in ~/code.
    package: git
    provisioner: apt
    updates: apt
    restart-tier: none
    holds: "~/.gitconfig"

  - gear: gh
    for: >
      The GitHub login: intake's one query for every repository's main, and
      HTTPS remotes (`credential.helper=!gh auth git-credential`), so the SSH
      key's passphrase stays with a person.
    package: gh
    provisioner: apt
    updates: apt
    restart-tier: none
    holds: "the login, in ~/.config/gh/hosts.yml"

  - gear: systemd-timesyncd
    for: >
      The clock, from the network at every boot. This box's motherboard clock
      once read 2019, and a wrong date makes every certificate look invalid.
    package: systemd-timesyncd
    provisioner: apt
    updates: apt
    restart-tier: none
    holds: "nothing of its own"

  - gear: openssh-server
    for: >
      The LAN's door to this machine, keys only: no passwords, no root
      (/etc/ssh/sshd_config.d/10-no-passwords.conf).
    package: openssh-server
    provisioner: apt
    updates: apt
    restart-tier: app
    holds: "the host keys (an upgrade keeps them; the live boot restores them), and the no-passwords file"

  - gear: rsync
    for: >
      Deliveries into the landing: a capture member pushes each finished
      capture over SSH, no SMB. rsync's partial files are dotfiles, so the
      pools never show a half-copied recording.
    package: rsync
    provisioner: apt
    updates: apt
    restart-tier: none
    holds: "nothing of its own"

  - gear: npm
    for: >
      Deploys run here by hand: the site-worker's bin/deploy fetches wrangler with npx to
      put the site-worker Worker up and give it its Stripe key.
    package: npm
    provisioner: apt
    updates: apt
    restart-tier: none
    holds: "wrangler's cache in ~/.npm; its login is the keychain's cloudflare group, not ~/.wrangler"

  - gear: zenity
    for: >
      The door's one question on this screen: the signing key's passphrase
      (machines/kiosk/askpass), so it never passes through a page; and the
      keychain's (keys take), so a key is never typed into a chat or a log.
    package: zenity
    provisioner: apt
    updates: apt
    restart-tier: none
    holds: "nothing of its own"

  - gear: avahi-utils
    for: >
      avahi-publish, for this machine's names under fcpublicmedia.local (lan.yml),
      each an mDNS name beside digitization.local (../lan.py, the crew's names line).
    package: avahi-utils
    provisioner: apt
    updates: apt
    restart-tier: none
    holds: "nothing of its own"

  - gear: earlyoom
    for: >
      Ends the biggest process before a memory shortage hangs the box: browsers
      and headless captures first, the ways in last (earlyoom.default).
    package: earlyoom
    provisioner: apt
    updates: apt
    restart-tier: none
    holds: "nothing of its own"

  - gear: zram
    for: >
      Swap in compressed RAM (zram-generator.conf, sysctl-zram.conf), so memory
      pressure has somewhere to go instead of the SD card.
    package: systemd-zram-generator
    provisioner: apt
    updates: apt
    restart-tier: reboot
    holds: "nothing of its own"

  - gear: vivaldi
    for: >
      The browser, opened maximized at login with the door's page as a pinned
      tab (at-login, open-page). From Vivaldi's signed repository; the toolbox keeps the vetted .deb and key.
    package: vivaldi-stable
    provisioner: apt
    updates: apt
    restart-tier: app
    holds: "its profile, in ~/.config/vivaldi"

  - gear: librsvg2-bin
    for: >
      rsvg-convert: draws the brand's marks and the wallpapers as PNG, for
      FC-Public-Media/brand's render.py and bin/make-wallpaper.py.
    package: librsvg2-bin
    provisioner: apt
    updates: apt
    restart-tier: app
    holds: "nothing of its own"

  - gear: firefox
    for: >
      The resting screen (rest): brand/idle full screen, in its own kiosk
      profile, because Vivaldi's --kiosk shows its setup wizard first. On the
      Debian live image already.
    package: firefox-esr
    provisioner: apt
    updates: apt
    restart-tier: app
    holds: "its profile, in ~/.config/fcpm-rest"

  - gear: claude-code
    for: >
      The agent. Installed by hand with its own installer, so apt does not see it.
    at: "~/.local/bin/claude"
    provisioner: hand
    updates: self
    restart-tier: app
    holds: "~/.claude"
