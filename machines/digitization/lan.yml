# lan.yml -- what digitization answers to on the LAN, each an mDNS name of its own beside
# digitization.local (`../lan.py publish`, the crew's `names` line), and what the door serves under
# each. Names go as deep as DNS does. See PROFILE.md, Names.

domain: fcpublicmedia.local

# Names any machine may hold. The first to claim one has it; another that asks keeps asking every
# 30 seconds and takes it over when the holder goes. `@` is the domain itself.
shared:
  helm: board        # the board: the door's switches, screens and fcpm's verbs
  "@": site          # the public site (site-build), the same as www
  www: site

# <hostname>.fcpublicmedia.local is this machine's directory: its gear, each one level deeper
# (atem-mini-pro.digitization.fcpublicmedia.local), named for its trove, which holds its facts.
gear: [rodecaster-pro-ii, atem-mini-pro, aja-helo]
