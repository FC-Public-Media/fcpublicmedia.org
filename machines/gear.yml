# see docs/inline/machines/gear.yml.md#1

version: 1
platform: windows

gear:
  - gear: git
    for: >
      Having the repository at all. First thing on the box, and the reason
      anything else here can be said to be version-controlled.
    package: Git.Git
    provisioner: winget
    updates: winget
    restart-tier: none
    holds: "the PATH entry, and ~/.gitconfig"
    # Installed on the first FCPM Windows host, 2026-09-23. `machines/kiosk-1`.
    state: installed

  - gear: vscode
    for: >
      The editor, and the thing that makes a Windows box usable as a place to
      work rather than a place to run something.
    package: Microsoft.VisualStudioCode
    provisioner: winget
    updates: winget
    restart-tier: app
    holds: "the `code` PATH entry, the user profile in %APPDATA%\\Code, and extensions"
    state: installed

  - gear: claude-code
    for: >
      The agent. The crew this gear is for — see `crew.yml`, which declares the
      provider rather than the install.
    # see docs/inline/machines/gear.yml.md#2
    provisioner: hand
    updates: self
    restart-tier: app
    holds: "the PATH entry, and ~/.claude"
    state: installed
    reconcile: >
      Confirm the winget id, then decide whether to reinstall through winget on
      this box or accept hand-provisioning as this entry's permanent answer.
      Either is fine; having it be an accident is not.

# see docs/inline/machines/gear.yml.md#3
