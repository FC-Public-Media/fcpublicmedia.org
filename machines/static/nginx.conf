# nginx.conf -- port 80 on a machine wearing the static job, as `install` puts it:
# /etc/nginx/sites-available/fcpm, enabled, Debian's `default` taken away. A name with a link in
# /var/lib/fcpm/sites/by-name (publish.py puts one there per LAN name a site has) is served as
# files; any other name is the door's (../kiosk/door.py on loopback :8081), with the asker's
# address in X-Real-IP so the door still knows this computer from the LAN. Nothing here names a
# site: adding one is sites.yml and lan.yml, never this file. See CREW.md.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/lib/fcpm/sites/by-name/$host;
    absolute_redirect off;
    add_header Cache-Control no-cache;              # asked again each visit; unchanged is a 304
    gzip on;
    gzip_types text/css text/javascript application/javascript application/json
               image/svg+xml text/plain application/xml application/rss+xml;

    location / {
        if (!-d $document_root) { return 418; }     # not a site's name: the door's
        try_files $uri $uri.html $uri/ =404;        # the file, then .html, then a folder's index
    }
    error_page 404 /404.html;
    error_page 418 = @door;

    location @door {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 300s;
        client_max_body_size 1m;
    }
}
