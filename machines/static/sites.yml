# sites.yml -- what the static job serves: each site a folder of finished files, served by nginx
# under every LAN name lan.yml gives it (`www: site`). publish.py puts each in /var/lib/fcpm/sites
# when it moved: a site with a `build` is built when the last commit touching its `from` changes;
# one without is copied as it sits when its `root` does. Paths are from this checkout's root. See CREW.md.

sites:
  site:
    build: machines/static/site-build   # Jekyll, from site/
    from: [site, machines/static]
  wix:
    root: wix/site                      # the Wix site, photocopied (submodule `wix`): no build
