# nginx-host.conf -- port 80 on the static host, as its outfit puts it (/etc/nginx/http.d/fcpm.conf,
# Alpine's default.conf taken away). A name with a link in /srv/sites/by-name (./receive links, from
# sites.yml) is served as files; a member's site is a name of its own (nccv.you.fcpublicmedia.local)
# or a path under you. Range, ETag and gzip, for big video as for pages. Nothing here names a site.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /srv/sites/by-name/$host;
    absolute_redirect off;
    add_header Cache-Control no-cache;              # asked again each visit; unchanged is a 304
    # A site's CSP rides in its pages; framing is the one part a page cannot say for itself. No site is
    # framed, except one whose sites.yml says `frame: self` (NCCV, whose includes open its own
    # intermediates in iframes): receive marks it in /srv/sites/frame-self/<host>.
    set $frame "'none'";
    if (-f /srv/sites/frame-self/$host) { set $frame "'self'"; }
    add_header Content-Security-Policy "frame-ancestors $frame";

    # Sources served raw (a member's markdown, read by its own client) say what they are, and a module
    # script is JavaScript (a browser refuses to run one served as text/plain).
    include /etc/nginx/mime.types;
    types { text/markdown md markdown; text/javascript mjs; application/manifest+json webmanifest; }
    charset utf-8;
    charset_types text/plain text/css text/markdown text/javascript application/javascript application/json image/svg+xml;
    gzip on;
    gzip_types text/css text/javascript application/javascript application/json
               image/svg+xml text/plain application/xml application/rss+xml;
    client_max_body_size 1m;

    location / {
        if (!-d $document_root) { return 404 "No site by that name here.\n"; }
        try_files $uri $uri.html $uri/ =404;        # the file, then .html, then a folder's index
    }
    error_page 404 /404.html;
}
