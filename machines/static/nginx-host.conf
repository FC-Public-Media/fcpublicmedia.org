# nginx-host.conf -- port 80 on the static host, as its outfit puts it (/etc/nginx/http.d/fcpm.conf,
# Alpine's default.conf taken away). A name with a link in /srv/sites/by-name (./receive links, from
# sites.yml) is served as files; a member's site is a path under its name (you.fcpublicmedia.local/
# nccv/). Range, ETag and gzip, for big video as for pages. Nothing here names a site. See CREW.md.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /srv/sites/by-name/$host;
    absolute_redirect off;
    add_header Cache-Control no-cache;              # asked again each visit; unchanged is a 304
    gzip on;
    gzip_types text/css text/javascript application/javascript application/json
               image/svg+xml text/plain application/xml application/rss+xml;
    client_max_body_size 1m;

    location / {
        if (!-d $document_root) { return 404 "No site by that name here.\n"; }
        try_files $uri $uri.html $uri/ =404;        # the file, then .html, then a folder's index
    }
    error_page 404 /404.html;
}
