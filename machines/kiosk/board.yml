# board.yml: Helm's index, by noun, the menu at the bare name (fcpublicmedia.local). Each noun is a section; each
# row is a page here or a name on the LAN. A static site can fill the same menu from this file. docs/kiosk.md, The board.
#
#   href    a path here, or a URL; {domain} and {host} are filled in (a name may not resolve from away)
#   says    one line, what it is for
#   staff   a host's or keeper's function (marked, not hidden)
#   live    the state that lights the row: deploy, broadcast, loop, asks, models, workshed, qr, room:<r>, seat:<s>, job:<j>
#   from    rows made from what this machine knows: jobs (every machines/ profile), rooms, seats, wallpapers
nouns:
  - noun: Jobs
    rows:
      - {from: jobs}
  - noun: Sites
    rows:
      - {title: The site, href: "http://www.{domain}/", says: "fcpublicmedia.org as built here"}
      - {title: Deploy, href: /deploy/, says: "fcpublicmedia.org to the web, from main", staff: true, live: deploy}
      - {title: Workshed, href: /workshed/, says: "what is being worked on here, each on its own port", staff: true, live: workshed}
      - {title: The Wix copy, href: "http://wix.{domain}/", says: "the old site, photocopied"}
      - {title: Gear, href: "http://{host}.{domain}/", says: "this machine's gear, each piece and its facts"}
  - noun: Library
    rows:
      - {title: Search, href: /library/, says: "what we know, by words in any order; pick a shed to look in"}
  - noun: Streams
    rows:
      - {title: Out, href: /broadcast/, says: "where channel 97 goes, each destination", staff: true, live: broadcast}
      - {title: The day, href: "http://ch97.{domain}/", says: "what airs, laid out"}
      - {title: The jukebox, href: "http://ch97.{domain}/jukebox/", says: "the floor's playlist"}
  - noun: Screens
    rows:
      - {title: Welcome, href: /kiosk/, says: "check-in, Wi-Fi, who is on"}
      - {title: Idle, href: /idle/, says: "the lamp pointed at the room"}
      - {title: The loop, href: /loop/, says: "every answer of the last ten minutes, for a big screen", live: loop}
      - {title: Depot, href: /depot/, says: "what is on the studio drive"}
      - {title: Scanner, href: /qr/, says: "the camera's console: its eyes, the inbox, what it last heard", live: qr}
      - {from: wallpapers}
  - noun: Rooms
    rows:
      - {from: rooms}
  - noun: Asks
    rows:
      - {title: Ask, href: /ask/, says: "a question for the model, as a code", live: asks}
  - noun: Seats
    rows:
      - {from: seats}
  - noun: Spend
    rows:
      - {title: Spend, href: /spend/, says: "every paid call: who called it, what it read, what it cost", staff: true, live: spend}
  - noun: Consoles
    rows:
      - {title: Consoles, href: /consoles, says: "what this helm holds up to read, a screen each, in plain text"}
      - {title: Places, href: /places, says: "the origin's repositories, and where each one is here"}
  - noun: Models
    rows:
      - {title: Bay 1's models, href: /models/, says: "which are up", staff: true, live: models}
