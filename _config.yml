# Fort Collins Public Media — site configuration
#
# Deliberately small. Everything Jekyll needs is in this file; there are no
# plugins, no theme gem, and no build step beyond `jekyll build`. If you can
# read YAML and HTML you can maintain this site.
#
# THE SITE IS `site/`, AND THIS FILE STAYS AT THE ROOT.
#
# The repository is a node; the website is one thing the node keeps, and it
# lives under `site/`. `source:` below is the whole mechanism. The build is
# still `bundle exec jekyll build` run from the repository root, still writes
# `_site/` at the root, and `wrangler.jsonc` still finds it there — so the
# host's build command, the workflows and the deploy did not change when the
# site moved. See NODE.md for what else the root is for.
#
# This file is deliberately NOT inside `site/`. Jekyll looks for `_config.yml`
# in the directory it is run from, before it has read any `source:` setting, so
# a config inside the source directory would have to be passed on the command
# line every time — in CI, at the host, and by hand. One `source:` line here
# costs nothing and keeps `jekyll build` bare.

title: Fort Collins Public Media
tagline: Gear, training, and studio space for Fort Collins storytellers.
description: >-
  Fort Collins Public Media is a 501(c)(3) community media resource providing
  creators with equipment, training, studio space, and a channel to broadcast on.

url: https://www.fcpublicmedia.org
baseurl: ""

# Everything the public gets is under here. Anything outside it — the docs, the
# scripts, the broker, the seats — cannot be published by accident, because
# Jekyll never looks at it.
source: site

# /classes.md becomes /classes/ — clean URLs, no .html anywhere.
permalink: pretty
markdown: kramdown

# The only collection. Podcast pages are all the same shape, so they live in
# site/_podcasts/ and share one layout instead of being eight near-identical pages.
collections:
  podcasts:
    output: true
    permalink: /podcasts/:name/

  # One file per show, and the file IS the config: canonical name, how its
  # episodes are recognised in the Cablecast catalog, and the prose that goes
  # on its page. Cablecast titles are episode titles, so nothing else can say
  # what a show is — see site/bin/propose-shows.py for why no rule works.
  #
  # Merging a proposal is what makes a show real. Everything unmatched stays a
  # findable one-off rather than being forced into a group.
  shows:
    output: true
    permalink: /watch/:name/

defaults:
  - scope:
      path: ""
      type: podcasts
    values:
      layout: podcast
  - scope:
      path: ""
      type: shows
    values:
      layout: show
  - scope:
      path: ""
    values:
      layout: page

sass:
  style: compressed

# Jekyll skips source files that start with an underscore. These two are named
# by their hosts — Cloudflare Pages looks for exactly /_redirects and
# /_headers in the published output — so they have to be let back in.
include:
  - _redirects
  - _headers

# TWO DIRECTORIES ARE EXCLUDED, AND NOTHING ELSE EVER SHOULD BE.
#
# `bin/` and `tests/` live inside the site because that is the context they
# serve — the syncs write `_data/`, the browser tests drive the built pages —
# but neither is content and neither may be published.
#
# THIS IS NOT THE OLD LIST COMING BACK. That list named eleven *documents*, one
# line per file, and the failure mode was forgetting to add the twelfth: a `.md`
# with no front matter is copied verbatim to a public URL, and MANIFEST,
# REDIRECTS and RESERVE-DESIGN each reached one that way. REVIEW-NOTES.md was
# the one that mattered — unratified board feedback, verbatim, one guessable URL
# from anyone.
#
# These are two DIRECTORIES. Adding a script or a spec needs no edit here, so
# there is nothing to forget. `site/bin/test_nothing_internal_is_published.py`
# fails the build if either one reaches `_site` anyway, which is the difference
# between a rule and a habit.
#
# Internal DOCUMENTS still live outside `source:` — at the repository root and
# in `docs/` — where Jekyll cannot see them at all. Never put one in `site/`.
exclude:
  - bin
  - tests

# The history, kept because it is the reason for the rule above.
#
# There used to be a much longer list here, and it was a standing hazard. A `.md` file with
# no front matter is copied verbatim rather than rendered, so any internal
# document left off the list ended up fetchable at its own public URL —
# MANIFEST.md, REDIRECTS.md and RESERVE-DESIGN.md all were, which is how it was
# noticed. REVIEW-NOTES.md was the one that mattered: unratified board feedback,
# quoted verbatim, one guessable URL away from the public.
#
# The list is gone because the failure it guarded against can no longer happen.
# Internal documents live at the repository root, outside `source:`, so Jekyll
# does not see them at all. Forgetting to add one to a list is no longer a way
# to publish it; you would have to put it inside `site/` on purpose.
#
# So: a new internal document goes at the root. Do not move one into `site/`,
# and do not reintroduce this list to make that safe — it was never reliably
# safe, which is the whole reason for the move.
