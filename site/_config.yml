# Fort Collins Public Media: Jekyll config. This directory is the build root, so no `source:`.
# See docs/site.md.

title: Fort Collins Public Media
tagline: Gear, training, and studio space for Fort Collins storytellers.
description: >-
  Fort Collins Public Media is a 501(c)(3) community media resource providing
  creators with equipment, training, studio space, and a channel to broadcast on.

url: https://www.fcpublicmedia.org
baseurl: ""

permalink: pretty
markdown: kramdown

collections:
  podcasts:
    output: true
    permalink: /podcasts/:name/

  # One file per show: its name, how its episodes match in the Cablecast catalog, its prose.
  shows:
    output: true
    permalink: /watch/:name/

defaults:
  - scope:
      path: ""
      type: podcasts
    values:
      layout: podcast
  - scope:
      path: ""
      type: shows
    values:
      layout: show
  - scope:
      path: ""
    values:
      layout: page

sass:
  style: compressed

# Underscored, so skipped by default; the host reads them from the output root.
include:
  - _redirects
  - _headers

# Only these. Internal documents live outside site/; see docs/site.md#never-published.
exclude:
  - bin
  - tests
  - wrangler.jsonc
  - README.md
