# see docs/inline/site/_config.yml.md#1

title: Fort Collins Public Media
tagline: Gear, training, and studio space for Fort Collins storytellers.
description: >-
  Fort Collins Public Media is a 501(c)(3) community media resource providing
  creators with equipment, training, studio space, and a channel to broadcast on.

url: https://www.fcpublicmedia.org
baseurl: ""

# /classes.md becomes /classes/ — clean URLs, no .html anywhere.
permalink: pretty
markdown: kramdown

# see docs/inline/site/_config.yml.md#2
collections:
  podcasts:
    output: true
    permalink: /podcasts/:name/

  # see docs/inline/site/_config.yml.md#3
  shows:
    output: true
    permalink: /watch/:name/

defaults:
  - scope:
      path: ""
      type: podcasts
    values:
      layout: podcast
  - scope:
      path: ""
      type: shows
    values:
      layout: show
  - scope:
      path: ""
    values:
      layout: page

sass:
  style: compressed

# see docs/inline/site/_config.yml.md#4
include:
  - _redirects
  - _headers

# see docs/inline/site/_config.yml.md#5
exclude:
  - bin
  - tests

  # see docs/inline/site/_config.yml.md#6
  - wrangler.jsonc

  # see docs/inline/site/_config.yml.md#7
  - README.md

# see docs/inline/site/_config.yml.md#8
