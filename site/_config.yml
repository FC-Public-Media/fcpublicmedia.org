title: FC Public Media
url: https://www.fcpublicmedia.org
baseurl: ""

fcpm:
  hero_image: /assets/img/studio.avif
  slogan_1: Don't Just View It.
  slogan_2: Do It.
  tagline: You are PUBLIC MEDIA.
  mission: >-
    FC Public Media is a 501(c)(3) broadcasting the community of Fort Collins and its immediate area.
  email:
    info: info@fcpublicmedia.org
    equipment: equipment@fcpublicmedia.org
    bookings: bookings@fcpublicmedia.org
    donations: donations@fcpublicmedia.org
    non-profits: nonprofits@fcpublicmedia.org
  phone: 970-818-2490

  # The old front page's own video. It belongs to the Wix photocopy and would be better served from
  # there, but the zone has no `wix` record yet (docs/site.md#domain-and-dns names only @, www and
  # new), so it is served from here until that exists. Made from
  # wix/site/_wix/video.wixstatic.com/4dbbfd6f6fe0a3a7.mp4 with the audio dropped and scaled to
  # 1280: 12.3MB to 928K. _includes/reel.html renders nothing without `hero_video`.
  hero_video: /assets/video/wix-was.mp4
  hero_video_poster: /assets/img/wix-was-poster.jpg
  hero_video_caption: fcpublicmedia.org as it was, until this replaced it.

  address:
    venue: Center for Creativity
    street: 200 Mathews Street
    city: Fort Collins
    state: CO
    zip: "80524"
    note: Open by appointment

  menu:
    - Watch
    - Learn
    - Meet
    - Reserve
    - Join
    - Submit

  channels:
    On-site: /reserve/
    In town: /meet/
    YouTube: https://www.youtube.com/@fcpublicmedia
    Instagram: https://www.instagram.com/fcpublicmedia/
    Newsletter: https://conta.cc/3G5YyWi

permalink: pretty
markdown: kramdown

defaults:
  - scope:
      path: ""
    values:
      layout: page

sass:
  style: compressed

# Underscored, so skipped by default; the host reads them from the output root.
include:
  - _redirects
  - _headers

# Only these. Internal documents live outside site/; see docs/site.md#never-published.
exclude:
  - bin
  - tests
  - README.md
