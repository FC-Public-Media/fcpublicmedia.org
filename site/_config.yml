title: FC Public Media  # Don't stylize, is used for dynamic copy
url: https://fcpublicmedia.org
baseurl: ""  # Root page /

fcpm:
  domain: fcpublicmedia.org  # just a hint, controls nothing
  hero_image: /assets/img/studio.avif
  slogan_1: Don't Just View It.
  slogan_2: Do It.
  tagline: You are PUBLIC MEDIA.
  mission: >-
    FC Public Media is a 501(c)(3) broadcasting the community of Fort Collins and its immediate area.

  email:
    info: info@fcpublicmedia.org
    education: education@fcpublicmedia.org
    equipment: equipment@fcpublicmedia.org
    bookings: bookings@fcpublicmedia.org
    donate: donate@fcpublicmedia.org
    legal: legal@fcpublicmedia.org

  phone: 970-818-2490

  tiers:
    supporter: Half-off one class.
    student: Half-off all classes. Free rentals.
    creator: Half-off all classes. Half-off rentals.
    producer: Free classes. Free rentals.
    a-la-carte: Single- and multi-project studio rates available.

  hero_video: /assets/video/wix-was.mp4

  address:
    venue: Center for Creativity
    street: 200 Mathews St
    city: Fort Collins
    state: CO
    zip: "80524"

  menu:
    - Watch
    - Learn
    - Meet
    - Reserve
    - Join
    - Submit
  # The first to give up their words as the bar narrows (they keep their icons).
  menu_folds:
    - Join
    - Submit

  channels:
    On-site: /reserve/
    In town: /meet/
    Comcast 97: /watch/
    YouTube: https://www.youtube.com/@fcpublicmedia
    Instagram: https://www.instagram.com/fcpublicmedia/
    Newsletter: https://conta.cc/3G5YyWi

  stream:
    cablecast: https://ch97.fcpublicmedia.org/internetchannel/watch-live-embed?streamId=1
    cablecast2: https://ch97.fcpublicmedia.org/internetchannel/watch-live-embed?streamId=2
    cablecast3: https://ch97.fcpublicmedia.org/internetchannel/watch-live-embed?streamId=3
    youtube: https://www.youtube.com/watch?v=pKj9zdsTV0A

  classes:
    rate: $50/hr
    lead_minutes: 90
    late_minutes: 45

  membership:
    nonprofit_rate: 0.5

# Site system configuration
permalink: pretty
markdown: kramdown
defaults:
  - scope:
      path: ""
    values:
      layout: page
sass:
  style: compressed
include:
  - _redirects
  - _headers
exclude:
  - bin
  - tests
  - README.md
