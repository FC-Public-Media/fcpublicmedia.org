<!-- see docs/inline/site/_includes/clock-hands.html.md#1 -->
<svg class="clock" viewBox="0 0 100 100" aria-hidden="true" style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible">
  <g class="ticks" stroke="var(--ink, #121417)" stroke-linecap="square">
    <line x1="50" y1="9" x2="50" y2="15" stroke-width="3"/>
    <line x1="50" y1="11" x2="50" y2="15" stroke-width="1.6" transform="rotate(30 50 50)"/>
    <line x1="50" y1="11" x2="50" y2="15" stroke-width="1.6" transform="rotate(60 50 50)"/>
    <line x1="50" y1="9" x2="50" y2="15" stroke-width="3" transform="rotate(90 50 50)"/>
    <line x1="50" y1="11" x2="50" y2="15" stroke-width="1.6" transform="rotate(120 50 50)"/>
    <line x1="50" y1="11" x2="50" y2="15" stroke-width="1.6" transform="rotate(150 50 50)"/>
    <line x1="50" y1="9" x2="50" y2="15" stroke-width="3" transform="rotate(180 50 50)"/>
    <line x1="50" y1="11" x2="50" y2="15" stroke-width="1.6" transform="rotate(210 50 50)"/>
    <line x1="50" y1="11" x2="50" y2="15" stroke-width="1.6" transform="rotate(240 50 50)"/>
    <line x1="50" y1="9" x2="50" y2="15" stroke-width="3" transform="rotate(270 50 50)"/>
    <line x1="50" y1="11" x2="50" y2="15" stroke-width="1.6" transform="rotate(300 50 50)"/>
    <line x1="50" y1="11" x2="50" y2="15" stroke-width="1.6" transform="rotate(330 50 50)"/>
  </g>
  <!-- see docs/inline/site/_includes/clock-hands.html.md#2 -->
  <g class="hh" stroke-linecap="square">
    <line x1="50" y1="54" x2="50" y2="29" stroke="var(--signal, #ffc61a)" stroke-width="9"/>
    <line x1="50" y1="54" x2="50" y2="29" stroke="var(--ink, #121417)" stroke-width="5.5"/>
  </g>
  <g class="mm" stroke-linecap="square">
    <line x1="50" y1="55" x2="50" y2="17" stroke="var(--signal, #ffc61a)" stroke-width="7"/>
    <line x1="50" y1="55" x2="50" y2="17" stroke="var(--ink, #121417)" stroke-width="3.5"/>
  </g>
</svg>
<script>
(function () {
  if (window.clockHands) return window.clockHands();
  function tick() {
    var d = new Date(), m = d.getMinutes() + d.getSeconds() / 60, h = d.getHours() % 12 + m / 60;
    document.querySelectorAll('svg.clock .hh').forEach(function (n) { n.setAttribute('transform', 'rotate(' + h * 30 + ' 50 50)'); });
    document.querySelectorAll('svg.clock .mm').forEach(function (n) { n.setAttribute('transform', 'rotate(' + m * 6 + ' 50 50)'); });
  }
  window.clockHands = tick;
  tick(); setInterval(tick, 1000);
})();
</script>
