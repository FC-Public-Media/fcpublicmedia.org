{%- if include.config.snippet and include.config.snippet != "" -%}
  <div class="booqable-store is-list">
    {%- for component in include.config.components %}
      <div class="{{ component.class }}" {{ component.attributes }}></div>
    {%- endfor %}
  </div>

  {{ include.config.snippet }}
  <script src="{{ '/assets/js/booqable-view.js' }}?v={{ site.time | date: '%s' }}" defer></script>

  <noscript>
    <p class="muted">
      Booking here needs JavaScript. Email
      <a href="mailto:{{ site.fcpm.email.equipment }}">{{ site.fcpm.email.equipment }}</a>
      and we'll sort it out with you directly &mdash; that route works for
      everything, and for a lot of members it is the easier one anyway.
    </p>
  </noscript>
{%- else -%}
  <p>Online reservations are presently unavailable.</p>
{%- endif -%}
