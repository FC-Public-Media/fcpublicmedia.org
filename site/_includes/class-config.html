{%- comment -%}
  The class schedule as JSON for assets/js/classes.js: _data/calendar.json's sessions, with the
  windows from _config.yml. Times go through date_to_xmlschema; jsonify alone is not ISO 8601.
  See docs/programming.md.
{%- endcomment -%}

<script type="application/json" id="class-config">
{
  "leadMinutes": {{ site.fcpm.classes.lead_minutes | default: 90 }},
  "lateMinutes": {{ site.fcpm.classes.late_minutes | default: 45 }},
  "sessions": [
    {%- for s in site.data.calendar.sessions -%}
    {
      "title": {{ s.title | jsonify }},
      "starts": {{ s.starts | date_to_xmlschema | jsonify }},
      "ends": {{ s.ends | date_to_xmlschema | jsonify }},
      "room": {{ s.room | default: "" | jsonify }},
      "summary": {{ s.summary | default: "" | strip_newlines | strip | jsonify }},
      "signup": {{ s.signup | default: "/learn/" | jsonify }}
    }{% unless forloop.last %},{% endunless %}
    {%- endfor -%}
  ]
}
</script>
