<!DOCTYPE html>
<html lang="en">
{% include head.html %}
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  {% include header.html %}
  <main id="main">
    {{ content }}
  </main>
  {% include footer.html %}
  <script src="{{ '/assets/js/nav.js' | relative_url }}?v={{ site.time | date: '%s' }}" defer></script>
  <script src="{{ '/assets/js/theme.js' | relative_url }}?v={{ site.time | date: '%s' }}" type="module" defer></script>
  {%- comment -%} Only pages with an on-air slot load the schedule. {%- endcomment -%}
  {% if content contains 'data-onair' %}
    <script src="{{ '/assets/js/onair.js' | relative_url }}?v={{ site.time | date: '%s' }}" type="module" defer></script>
  {% endif %}
</body>
</html>
