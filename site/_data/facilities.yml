# The bookable spaces; membership is required for all. See docs/site.md#data-files.
# `summary` is the board's wording: keep it verbatim. `plan_label` is the room's name on floor-plan.png.

- name: Video Studio
  plan_label: STUDIO
  area: 635
  couples_with: Podcast Studio
  activities: [video, green-screen, lighting]
  summary: >-
    An adaptable space perfect for nearly every project. Includes a
    state-of-the-art RGB light system, live editing board, acoustic treatment,
    and a massive green screen to make your vision real.

# Acoustically coupled: booking either studio blocks both.
- name: Podcast Studio
  plan_label: OFFICE
  area: 113
  couples_with: Video Studio
  activities: [podcast, audio]
  summary: >-
    Room for up to four in-person guests. Acoustically treated, with
    professional audio equipment to make your podcast sound great.

# One room with two interchangeable stations; "editing bay" names both the room and each station.
- name: Editing Bays
  plan_label: CONTROL ROOM
  area: 318
  stations: 2
  activities: [video, audio, editing]
  summary: >-
    The entire Adobe Suite for video and audio projects. These are
    state-of-the-art machines — you can edit 4K footage and above. Two
    stations, both dual-monitor, and a window straight into the video studio.

- name: Equipment Checkout
  activities: [video, audio, photo]
  summary: >-
    Arranged by email rather than through the booking calendar. The catalogue
    is further down this page.
