# Email claims: signed tokens minted by site/bin/mint-claim.py, checked in the browser.
# A claim is not a login. See docs/identity.md#email-claims.

# Shown to the visitor so a claim link is attributable to someone real.
issuer: Fort Collins Public Media

# Public halves (mint-claim.py --new-key prints one); removing a key voids every claim it signed.
keys: []
# - id: 2026-08
#   x: "…"
#   y: "…"

# Days a minted claim stays valid.
days: 120

# What the page says when someone has no claim, the ordinary state.
unverified_note: >-
  You can put your email here so your visits line up with your membership. We
  can't confirm it from this page, so it stays on your device as something you
  told us rather than something we checked.
