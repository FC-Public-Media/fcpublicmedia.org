# Microsoft Forms framed in our pages by _includes/hosted-form.html. See docs/payments.md#hosted-forms.
# Set each form to "Anyone can respond": Safari blocks the sign-in cookie inside a frame.

book:
  title: Book a studio
  lede: Tell us what you need and when. We'll confirm.

  # Paste the src from Forms > Collect responses > Embed.
  embed: ""
  # The plain share link. Always shown, so a blocked frame is never a dead end.
  direct: ""

  requires_signin: false

  intro: >-
    Studios and editing bays are for members. Requests aren't confirmed
    straight away — someone needs to check the room is free and that a host
    can be there, so expect a reply rather than an instant booking.

  after: >-
    We'll email you once it's confirmed. If you need it sooner than that,
    call us.

register:
  title: Register for a class
  lede: Save a seat. Classes are open to everyone, member or not.

  embed: ""
  direct: ""

  requires_signin: false

  intro: >-
    Tell us which class and how to reach you. If a class is full we'll let you
    know and put you first in line for the next one.

  after: >-
    You'll get a confirmation by email. Turning up on the day without
    registering is usually fine too &mdash; registering just means we know to
    expect you.
