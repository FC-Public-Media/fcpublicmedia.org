# /check-in/: visits recorded in the visitor's own browser, sent nowhere. See docs/identity.md#check-in.

# What the QR encodes. Regenerate after changing it: python3 site/bin/make-qr.py
url: https://new.fcpublicmedia.org/check-in/

location:
  required: true

  name: Carnegie Center for Creativity
  address: 200 Mathews Street, Fort Collins, CO 80524

  # Geocoded from the address (OpenStreetMap Nominatim); confirm at the front door.
  latitude: 40.5849119
  longitude: -105.0735292

  radius_m: 200

  # Cap on the accuracy credited toward the radius, so a ±3km fix cannot pass from home.
  accuracy_slack_m: 100

  # Re-checks run only while the tab is visible.
  recheck_seconds: 300

# Preselect one from the URL: /check-in/?reason=Class
reasons:
  - Studio or bay reservation
  - Equipment pickup or return
  - Class
  - Volunteering or crew
  - Meeting
  - Just visiting

identity:
  # none, or access: Cloudflare Access on /check-in/sign-in/ (50 free seats). See docs/identity.md.
  mode: none

  anonymous_note: >-
    You are not signed in, so this check-in is recorded on this device only
    and is not linked to an email address.

history_limit: 200
