# Guest Wi-Fi and its poster. Regenerate the code after any change: python3 site/bin/make-wifi-qr.py
# The password never goes in this file. See docs/site.md#never-published.

network:
  # The guest network, not "FC Public WiFi". It has gone missing before: check it is up before printing.
  ssid: FC Public Media Guest

  # wpa (WPA/WPA2/WPA3), open, or wep.
  security: wpa

  hidden: false

  # The name is confirmed (not that the network is up). The generator refuses while false.
  confirmed: true

poster:
  title: Guest Wi-Fi
  note: >-
    Point your camera at the code and tap the notification. It joins you
    automatically — there is nothing to type and no sign-in page.

  # Printed under the code. Placeholder wording.
  fallback: >-
    Can't see this network? Tell us — it may be down rather than you.
