# see docs/inline/site/_data/wifi.yml.md#1

# ------------------------------------------------------------------ network

network:
  # see docs/inline/site/_data/wifi.yml.md#2
  ssid: FC Public Media Guest

  # see docs/inline/site/_data/wifi.yml.md#3
  security: wpa

  # true if the network does not broadcast its name.
  hidden: false

  # see docs/inline/site/_data/wifi.yml.md#4
  confirmed: true

# ------------------------------------------------------------------- poster

poster:
  title: Guest Wi-Fi
  note: >-
    Point your camera at the code and tap the notification. It joins you
    automatically — there is nothing to type and no sign-in page.

  # see docs/inline/site/_data/wifi.yml.md#5
  fallback: >-
    Can't see this network? Tell us — it may be down rather than you.
