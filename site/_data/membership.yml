# see docs/inline/site/_data/membership.yml.md#2
term:
  summary: A full year from the day you join.
  notes:
    - Not the calendar year. Join in November and you are covered until the following November.
    - No half-year price any more, because there is no half year to buy — everyone gets twelve months.
    - No monthly option.

# see docs/inline/site/_data/membership.yml.md#3
nonprofit:
  rate: 0.5
  summary: Nonprofits pay half, on every tier.
  # see docs/inline/site/_data/membership.yml.md#4
  before_you_pay: >-
    Tell us which organization you're with before you pay, and we'll set the
    rate. You should never have to buy the wrong membership and wait for a
    refund.

