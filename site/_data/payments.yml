# Which system takes which payment, the subscription terms, and Booqable. See docs/payments.md.
# Only the pk_ key belongs here; an rk_ or sk_ key in this repository is burned and must be rotated.

stripe:
  # pk_live_ or pk_test_, from https://dashboard.stripe.com/apikeys.
  publishable_key: ""

  # true once the live key is in and the board has agreed the terms below.
  live: false

terms:
  # Board to confirm.
  price_change_notice_days: 30

  lock:
    upfront: >-
      Paying for the year up front fixes your price for that year. Nothing can
      change until you renew.
    subscription: >-
      A renewing membership is charged at the price on the day it renews. We
      announce any change at least a month beforehand, and it applies to
      everyone at once — we do not keep old members on old prices.

  # Shown on the checkout page and in the confirmation email.
  summary:
    - A membership runs one year from the day you buy it.
    - You choose whether it renews. A single payment simply lapses at the end of the year.
    - Paying up front fixes your price for that year.
    - If you choose to renew, we email you before each renewal.
    - We announce any price change at least a month before it would affect you.
    - Everyone pays the current price. We do not keep old members on old prices.
    - You can cancel a renewal at any time, and the year you already paid for still runs out.

  # Step 4 of a price change (docs/payments.md#price-changes). Channel unconfirmed; owner for the board.
  announcements:
    channel: Constant Contact
    owner: TODO

  # Does not exist yet; required before subscriptions are switched on.
  page: /policies/membership-terms/

# `sku_prefix` matches keys in worker/src/prices.js.
sells:
  - what: Membership
    sku_prefix: "membership:"
    system: stripe
    page: /membership/
    note: One year from purchase, optionally renewing.

  - what: Class drop-in
    sku_prefix: "class-dropin:"
    system: stripe
    page: /classes/
    note: >-
      Not switched on — the drop-in prices in _data/classes.yml are still TODO,
      so the generator refuses to put them up for sale.

  - what: Equipment rental
    sku_prefix: null
    system: booqable
    page: /reserve/
    note: >-
      Booqable's own checkout, on Booqable's own Stripe connection. We
      deliberately do not sell equipment through our broker — two systems
      charging for one booking is how somebody gets billed twice and only one
      side knows to release the gear.

booqable:
  # Pasted verbatim from Settings → Online Bookings → Website integration; never reconstructed.
  snippet: '<script src="https://1463eea8-db0a-45d4-9801-176111dc06a5.assets.booqable.com/v2/booqable.js"></script>'

  # The dashboard subdomain for the API, not the snippet's UUID. Only for a build-time catalog sync.
  company_slug: ""

  # Mount points Booqable's script hydrates. Restoring the datepicker means removing two site.css rules.
  components:
    # - class: booqable-datepicker
    #   what: Pick the dates first, so everything below shows real availability.
    - class: booqable-product-list
      attributes: 'data-per="12" data-show-search="true"'
      what: Every product, twelve to a page, with the search field built in.
