# Board members who host studio time, and what they can support. No page reads this yet:
# publishing a name is a decision. Bios are written by each person; never add characterisations.
# The reserve plan is in docs/OPEN.md.

# Shared vocabulary, picked from. Presence is implied by being scheduled; production is not offered.
activities:
  - id: orientation
    label: Getting started
    detail: >-
      Finding the equipment, getting the software open, making sure sound is
      coming out of the right place. Nobody should leave because they could not
      work out how to begin.
  - id: audio
    label: Audio
  - id: video
    label: Video
  - id: podcast
    label: Podcasting
  - id: broadcast
    label: Broadcast
  - id: editing
    label: Editing
  - id: web
    label: Web
  - id: outreach
    label: Outreach and publicity

# Order is not significance. `scheduled: false` means on the board but not in the hosting rotation.
