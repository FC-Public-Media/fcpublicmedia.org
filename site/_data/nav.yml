# Header (`primary`) and the Donate button (`cta`). A `label` with `items` makes a group.
# `icon` names a drawing in _includes/nav-icon.html, shown beside the word.
# See docs/site.md#data-files.

primary:
  - title: Watch
    icon: watch
    url: /watch/
  - title: Learn
    icon: learn
    url: /classes/
  - title: Meet
    icon: meet
    url: /meet/
  - title: Reserve
    icon: reserve
    url: /reserve/
  - title: Join
    icon: join
    url: /membership/
  - title: Submit
    icon: submit
    url: /submit/

cta:
  title: Donate
  url: /donate/

# Not a menu: nothing links these. The `page` layout prints no <h1>, so this is how the header can
# still say which page you are on. A page named nowhere shows no label, which is allowed.
elsewhere:
  - title: For Nonprofits
    url: /nonprofits/
  - title: Check In
    url: /check-in/
  - title: Non-Discrimination Policy
    url: /policies/non-discrimination/
