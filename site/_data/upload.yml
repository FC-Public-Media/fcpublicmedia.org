# /upload/: a member signs in with their passkey and produces a feed entry for their own site.
# A future-dated entry in their _data/programs.yml is the submission. See docs/identity.md.

# Empty uses the serving domain (previews); must match _data/authorize.yml.
rp_id: ""

# Broker base URL. Empty (shipped): the page shows the entry for the member to send in.
url: ""

programs_path: _data/programs.yml

# Where finished files go. Empty: the page reads the file's details and asks the member to send it.
destination: ""

fallback_note: >-
  Send the finished file the way you normally do &mdash; the shared Dropbox
  folder, or ask us and we'll sort it out. Nothing about that has changed yet.

# Times carry Colorado's offset wherever the member is (as in _data/classes.yml).
timezone: America/Denver

# Default drop time, when the evening block starts.
default_time: "18:00"
