# Board meetings, minutes and documents, shown under "The board" on /meet/. See docs/site.md#data-files.
# FCPM is not a public body: open meetings are the board's choice, not a statute.

meetings:
  # false replaces the invitation with a "not open" notice.
  open: true

  # Plain language, e.g. "The third Tuesday of the month, 6:30pm".
  schedule: ""

  # Empty falls back to the studio address in _data/org.yml.
  location: ""

  what_to_expect: ""

  recorded: false

  # Each: starts (with offset: "2026-09-15T18:30:00-06:00"), note. Also in "What's on".
  upcoming: []

minutes:
  # Empty: the page offers to email them instead.
  url: ""

  note: >-
    Minutes are approved at the following meeting, so the most recent set is
    usually a month behind.

  # Empty falls back to org.email.
  request_email: ""

# Each: name, url. Entries without a url are skipped.
documents: []
