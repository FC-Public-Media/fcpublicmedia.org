# Who our library is: its branches by purpose, and the holdings it addresses by label. No paths:
# each machine binds a label to an address in machines/<profile>/library.yml. `fcpm library` reads both.
# Engine: .library-engine (library.anecdote.channel). Doc: docs/library.md.

# Each branch says what it is for. Only main is merged into; the others are separate concerns, kept
# beside it on purpose and never merged. On a machine, the library is ~/code/library, a folder per branch
# it keeps (a worktree each). `pushes: lan` marks what is the LAN's: it goes to origin.local, eagerly,
# and never past it; the origin's relay will not carry it to GitHub (machines/origin/intake, LAN_ONLY).
branches:
  main:
    for: "what we publish and what we run: the site, the machines, and this declaration"
  library:
    for: "holdings in git: the tenant list (trade/), city/, voices/; a skeleton (docs/members.md)"
    merges: never
    pushes: lan
  origin:
    for: "the actual origin: canonical submodule references to what we consider worth working on, which
      FCPM's computers fast-forward from (machines/origin). Not refs/: that stays each machine's live line
      to its cloud sources, and its nomination of what it is concerned with there"
    merges: never
    made: false
  archives:
    for: "what the library keeps after it stops being worked on; not assigned yet"
    merges: never
    made: false
  lobby:
    for: "first contact and orientation: what is here and where, taking people to things on other branches.
      Thin: directions, never the things themselves"
    merges: never
    made: false
  studies:
    for: "studies: a folder each, flat: what we are working out, in our own words, and every file tree
      made during it, written out. On GitHub, so a cloud session commits to it too. Intake takes only
      main, so it comes down to the LAN once a machine nominates it. Distilled before anything is published"
    merges: never
  librarians:
    for: "what librarian agents answer to: their constitution, and each place's decorum as AGENTS.md
      files in that place's own folder shape. Instructions, never data"
    merges: never
    pushes: lan
  retain/studies:
    for: "studies: a flat list of what we are working out, in our own words, before any of it is decided.
      The working half: what settles is summarized into a released branch, because the point is to show the
      work in the open"
    merges: never
    pushes: lan
  retain/<machine>:
    for: "a machine's own record: each holding's x-ray, one commit per look, and later the notes,
      summaries and errors its librarians write. Our operational history, kept on the LAN"
    merges: never
    pushes: lan

# A holding is a place with things in it. Its label is ours; `is:` is the engine's word for the same
# thing (.library-engine/residency.yml). `disposition` is who has been promised a read: none of these is
# secret, because a computer anyone signs in to cannot keep a secret (docs/library.md, Who can see).
holdings:
  attic:
    is: intake
    holds: "what came down from the Google Drive and has not been placed: big video and audio from
      members' projects, and the board's older documents. Heavy, and we are not sure how it all got there"
    lifecycle: transient
    disposition: private
    expects: sensitive        # board records and members' work: assume a name or a number in it
    # What fcpm library xray records of it: names, sizes and times. Never what a file says.
    xray: shape

  downloads:
    is: intake
    holds: "whatever a browser on this computer was asked to fetch: installers, exports, members'
      files passing through. Same plan as the attic, with fewer expectations of what lands"
    lifecycle: transient
    disposition: private
    expects: ordinary         # mostly not sensitive; private still, since nobody was promised a read
    xray: shape

  enhance:
    is: intake
    holds: "the Drobo's TO ENHANCE volume, over iSCSI: what waits to be enhanced, and post's tank (POST,
      DOORS). Production's own pipeline writes here"
    lifecycle: transient
    disposition: private
    expects: ordinary         # members' takes and their working files
    xray: shape

  buffalo:
    is: intake
    holds: "the Buffalo DriveStation's RAID Backup volume (NTFS, about 19 TB used): the old Mac backup
      that once ran this place, among other things. Kept unplugged. We need to know whether anything on it
      matters before we can cut it loose"
    lifecycle: transient
    disposition: private
    expects: sensitive        # an old backup of everything; assume a name or a number in anything
    xray: shape

  drive:
    is: intake
    holds: "the organization's Google Drive, mounted as a drive (streamed, not mirrored to a folder): the
      cloud slice people drop files in to reach another of our computers, and the board's documents still
      there while they are moved off. A live line to a cloud source, as refs/ is to GitHub"
    lifecycle: transient
    disposition: private
    expects: sensitive        # it is where the board's documents were; most files are placeholders here
    xray: shape

# The receptionist's inbox: asks of the library that came by a wizard, through Helm, kept in the library
# here (~/code/library/inbox/<lane>/) until a seat takes them. Each lane is its own wizard, chosen by
# whoever asks, so no dispatcher has to guess what a request wants. Lanes are taken in this order.
# A different behaviour is a new lane, written here. Doc: docs/library.md, The receptionist's inbox.
inbox:
  lanes:
    urgent:
      wizard: wizard:library+urgent
      for: "an ask somebody called urgent: taken before any other, whatever the round's budget"
      budget: all              # every urgent ask waiting is taken on the next round, or one called up for it
    ask:
      wizard: wizard:library+ask
      for: "an ordinary ask of the library: taken in rounds, oldest first"
      budget: 2                # asks one round takes; the rest wait for the next
