<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fort Collins Public Media</title>

<!-- The idle screen: open it full screen and leave it. No build, no network. brand/README.md. -->

<style>
  /* site/assets/css/site.css's :root values, copied: this works from a USB stick with no server. */
  :root {
    --ink:    #121417;
    --slate:  #232830;
    --paper:  #f4f1ea;
    --signal: #ffc61a;
    --soft:   #9ba3ad;

    --step: 4s;   /* one dwell: slow enough to read as a tally light, not a spinner */
  }

  * { box-sizing: border-box; margin: 0; }

  html, body {
    height: 100%;
    background: var(--ink);
    color: var(--paper);
    font-family: Archivo, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden;
    cursor: none;
  }

  /* vmin throughout, for portrait or landscape. The brand sits on the optical centre. */
  .screen {
    height: 100%;
    display: grid;
    grid-template-rows: 0.85fr auto 1fr;
    justify-items: center;
    padding: 6vmin;
  }
  .brand {
    display: grid;
    justify-items: center;
    gap: 6vmin;
  }
  .screen footer {
    align-self: end;
    display: grid;
    justify-items: center;
    gap: 3vmin;
  }

  /* The mark is drawn by dim.css and dim.js beside this file, the same one every screen dims to. */

  /* --- The type ---------------------------------------------------------- */

  .lockup { text-align: center; }
  .lockup b {
    display: block;
    font-family: "Source Serif 4", Georgia, "Times New Roman", serif;
    font-size: 4.4vmin; font-weight: 780; letter-spacing: -0.02em;
  }
  .lockup span {
    display: block;
    font-size: 2.1vmin; text-transform: uppercase;
    letter-spacing: 0.3em; text-indent: 0.3em;
    color: var(--soft);
    margin-top: 0.8vmin;
  }

  .clock {
    font-variant-numeric: tabular-nums;
    font-size: 3.4vmin;
    letter-spacing: 0.08em;
    color: var(--soft);
  }

  /* --- THE SLOT: one idea of live content; empty, it collapses ----------- */
  .slot:empty { display: none; }
  .slot {
    text-align: center;
    max-width: 60ch;
    font-size: 2.6vmin;
    line-height: 1.5;
    color: var(--soft);
  }
  .slot strong { color: var(--paper); font-weight: 600; }
</style>
<link rel="stylesheet" href="dim.css">
<script src="dim.js"></script>

<div class="screen">
  <div></div>

  <div class="brand">
    <div id="tally"></div>

    <p class="lockup">
      <b>Fort Collins</b>
      <span>Public Media</span>
    </p>
  </div>

  <footer>
    <p class="slot" id="slot"></p>
    <p class="clock" id="clock"></p>
  </footer>
</div>

<script>
  var clock = document.getElementById('clock');

  // The mark, the same one every screen shows when it falls to dim.
  if (window.FCPMDim) window.FCPMDim.tally(document.getElementById('tally'));

  function tick() {
    // No seconds: a panel nobody watches is the goal.
    clock.textContent = new Date().toLocaleTimeString([], {
      hour: 'numeric', minute: '2-digit'
    });
  }

  // ?say=... fills the slot; textContent, never innerHTML, since it comes off a URL.
  var say = new URLSearchParams(location.search).get('say');
  if (say) document.getElementById('slot').textContent = say;

  tick();
  setInterval(tick, 15000);

  // setInterval falls behind while asleep: re-read the clock on wake.
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) tick();
  });
</script>
