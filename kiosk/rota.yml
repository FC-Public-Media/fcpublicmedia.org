# rota.yml — who is on at the studio, by default.
#
# The standing rotation, as agreed at a board meeting. It is canonical, and it
# is what the welcome screen's footer falls back to when no other source says
# who is on. Calendars come later. Microsoft 365 is the likely first one, and
# which calendar it is has not been settled. They will sit in front of this
# file, and this file keeps answering whenever they cannot.
#
# Times are the studio's local time, 24-hour. `days` takes mon tue wed thu fri
# sat sun. A shift with several names shows them all.
#
#   - days: [tue, thu]
#     from: "10:00"
#     to: "14:00"
#     who: [A Name, Another Name]
#
# `role` is optional and shows beside the name.
#
# Given by Autumn, 2026-09-23, as agreed at the board meeting.
#
# NO MONDAY, on purpose. The building has work on then. Coming in is
# possible, but nobody has to be here.

shifts:
  - days: [tue]
    from: "14:30"
    to: "17:30"
    who: [James]

  - days: [wed]
    from: "11:00"
    to: "16:00"
    who: [Morey]

  - days: [thu]
    from: "17:00"
    to: "19:00"
    who: [Nate]

  - days: [fri]
    from: "17:00"
    to: "19:30"
    who: [Chris]

  - days: [sat]
    from: "11:00"
    to: "16:00"
    who: [Autumn]

  # Sunday is different. Josh hosts a specific group, so he is busy with
  # them, but he is the one in charge if anyone else comes in. His name
  # belongs on the screen for that reason, and `role` says so.
  - days: [sun]
    from: "13:00"
    to: "22:00"
    who: [Josh]
    role: hosting
